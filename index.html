<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- ===== SEÇÃO 1: CONFIGURAÇÃO (EDITE AQUI) ===== -->
<script>
/* ╔══════════════════════════════════════════════════════════════════════╗
   ║                    EDITE AQUI — CONFIGURAÇÃO                          ║
   ║                    Tigrinho do L&A (corte da gravata)                 ║
   ╚══════════════════════════════════════════════════════════════════════╝

   Tudo o que dá para mudar no jogo fica neste bloco. Não precisa mexer no
   resto do arquivo.

   Como editar sem quebrar:
   - Textos ficam entre aspas simples: 'assim'. Se o texto tiver aspas
     simples dentro, escreva \' (barra invertida antes).
   - Cada item termina com vírgula.
   - Números usam PONTO como separador decimal: 2.5 (e não 2,5).
   - Se algo ficar errado, o jogo abre mesmo assim com valores seguros e o
     problema aparece só no console do navegador (nunca na tela).

   Seções:
   - textos ....... frases e rótulos fixos da tela.
   - etapas ....... os degraus do multiplicador (1x até 20x). Cada etapa tem um
                    desfecho "ganhou" e um "perdeu", com chance, título e mensagem.
   - intensidades . a partir de qual multiplicador cada faixa visual começa.
   - simbolos ..... os 9 símbolos do tabuleiro (um deles é a Carta LA).
   - tempos ....... velocidade geral e durações-base das animações.
   - som .......... som ligado/desligado e volume.
*/
window.CONFIG = {

  /* ---------- TEXTOS FIXOS DA TELA ----------
     Todo texto fixo que aparece na tela vem daqui. Mude à vontade (sem emoji: as fontes do
     jogo têm as letras com acento do português, números e pontuação comum). */
  textos: {
    // Nome do jogo. Aparece no anunciador da tela inicial e no lugar da Logo se ela faltar.
    titulo: 'Tigrinho do L&A',
    // Frase do cartão da tela inicial.
    fraseInicial: 'Agora que você já contribuiu, vamos ver se o tigrinho ta soltando a carta pra você',
    // Botão do cartão inicial (um toque começa a rodada).
    botaoTentarASorte: 'Tentar a sorte',
    // Botão de girar do jogo. Fica travado durante a rodada.
    botaoGirar: 'Girar',
    botaoGirando: 'Girando…',
    // Botão que aparece no resultado e volta para a tela inicial.
    botaoJogarDeNovo: 'Jogar de novo',
    // Aviso discreto, sempre visível.
    avisoBrincadeira: 'É só brincadeira: nenhum dinheiro passa por aqui.',
    // Aviso que aparece no lugar do jogo quando o celular está deitado. Ao voltar o celular
    // para em pé, o jogo continua de onde estava.
    avisoGirar: 'Gire o celular para jogar',
    // Rótulo da etapa lido pelos leitores de tela (ex.: "Etapa 3").
    rotuloEtapa: 'Etapa',
    // Anunciador de fliperama durante a rodada: a cada etapa aparece "ROUND 3 · 3x".
    rotuloRound: 'ROUND',
    // Rótulo da barra de ganho.
    rotuloGanho: 'Ganho',
    // Pílulas do placar decorativo: 2 ou 3 textos curtos (até ~15 letras cada). É só piada:
    // nada de dinheiro, valores ou palavras de aposta.
    placar: ['Saldo: ∞ amor', 'Torcida: 100%'],
    // Como o tipo do resultado aparece na tela.
    tipoGanhou: 'Ganhou!',
    tipoPerdeu: 'Perdeu!',
    // Palavra da derrota (anunciador, no fim da rodada perdida) e da vitória na última etapa.
    palavraDerrota: 'K.O.',
    palavraVitoriaMaxima: 'PERFECT!',
  },

  /* ---------- ETAPAS (1x até 20x) ----------
     A rodada passa pelas etapas de cima para baixo até a etapa final sorteada.
     - Remover uma entrada remove a etapa do jogo. Ex.: deixando só as 10 primeiras,
       o jogo nunca passa de 10x.
     - Acrescentar uma entrada no fim cria uma etapa nova. Ex.: com 25 entradas, o jogo
       pode chegar até a etapa 25.

     Cada etapa tem:
     - multiplicador: o número mostrado na tela (ex.: 5 aparece como "5x");
     - intensidade (opcional): 'morno', 'quente', 'pegando-fogo', 'lendario' ou 'jackpot'.
       Se ficar de fora, vem da tabela "intensidades" mais abaixo; se estiver aqui, ela manda
       (sobrescreve a faixa só desta etapa);
     - ganhou e perdeu: cada um com
         chance   → a chance desse desfecho (veja abaixo);
         titulo   → título curto do resultado;
         mensagem → um texto, ou uma lista de textos ['a', 'b', 'c'] (aí um deles é sorteado).

     COMO ESCREVER TÍTULOS E MENSAGENS
     - Título com até 28 caracteres e mensagem com até 140, para caber em qualquer celular
       sem corte. Se passar disso, o jogo mostra mesmo assim e avisa só no console.
     - Lista de mensagens: a cada rodada que termina nesse resultado, uma é sorteada, sem
       repetir a última que apareceu para ele. Assim a fila não vê a mesma piada duas vezes
       seguidas. Os resultados mais comuns (perdeu em 1x, 2x e 3x) já vêm com 3 variações.
     - Texto vazio ou lista vazia não quebra nada: o jogo usa uma mensagem segura padrão
       e avisa só no console.
     - É só zoeira: nenhuma mensagem promete prêmio, pede outra contribuição ou fala de
       dinheiro de verdade.
     - A tabela de revisão das 40 mensagens fica em docs/mensagens/tabela-revisao.md
       (fora do jogo publicado).

     COMO LER AS CHANCES
     - Leia cada chance como porcentagem das rodadas: "perdeu em 1x" com chance 25 quer
       dizer que 25% das rodadas terminam com derrota em 1x. As 40 chances padrão somam 100.
     - Se a soma não der 100, o jogo normaliza sozinho: cada chance vale proporcionalmente
       ao total. Ex.: se tudo somar 250, uma chance 25 vale 25 ÷ 250 = 10% das rodadas.
       Ou seja, um erro de conta não quebra nada; só muda as proporções.
     - Chance 0 = esse desfecho nunca sai.
     - Chance negativa, vazia ou que não seja número conta como 0 (o aviso aparece só no
       console do navegador). Se todas ficarem 0, todos os desfechos passam a ter a mesma chance.
     - Use ponto nos decimais: 0.45 (e não 0,45).

     CHANCES PADRÃO (somam 100)
     - Vitórias somam 15: cerca de 15% das rodadas, cada vez mais raras nas etapas altas
       (de 3.5 em 1x até 0.2 em 20x).
     - Derrotas somam 85, concentradas no começo:
         1x a 3x ... 25 + 15 + 10 = 50 (metade das rodadas termina em derrota até 3x);
         4x a 10x .. somam 28, decrescendo;
         11x a 20x . somam 7, decrescendo. */
  etapas: [
    { multiplicador: 1,
      ganhou: { chance: 3.5,  titulo: 'Soltou a carta!',
                mensagem: 'Logo no primeiro round o tigrinho abriu a mão. Rápido e sem enrolação, igual ao sim dos noivos!' },
      perdeu: { chance: 25,   titulo: 'K.O. no primeiro round',
                mensagem: [
                  'O tigrinho guardou a carta no bolso do terno e fingiu que nem viu. Pelo menos a festa continua linda!',
                  'Round 1, FIGHT... e K.O.! O tigrinho nem suou. Vai pra pista, que a dança perdoa tudo.',
                  'O texugo nem tinha acordado e o tigrinho já tinha guardado a carta. Mas o sorriso dos noivos é seu.',
                ] } },
    { multiplicador: 2,
      ganhou: { chance: 2.4,  titulo: 'Combo duplo',
                mensagem: 'Dois rounds e a Carta LA encheu o tabuleiro. O cachorro abanou o rabo de aprovação!' },
      perdeu: { chance: 15,   titulo: 'Caiu no segundo round',
                mensagem: [
                  'Dois rounds e o tigrinho mudou de ideia: escondeu a carta debaixo do boné e saiu assobiando.',
                  'Começou bem, mas o cachorro sentou em cima da carta. E ninguém discute com cachorro sentado.',
                  'K.O. no segundo round! O tigrinho mandou dizer que adorou seu estilo, só não soltou a carta.',
                ] } },
    { multiplicador: 3,
      ganhou: { chance: 1.7,  titulo: 'Trinca da sorte',
                mensagem: 'Três rounds e o tigrinho cedeu. Ergam os copos de Aperol: tim-tim pra você e pros noivos!' },
      perdeu: { chance: 10,   titulo: 'Três rounds e um K.O.',
                mensagem: [
                  'O tigrinho até pensou em soltar a carta, mas lembrou do Aperol dele no balcão e foi embora.',
                  'Três rounds de pura fé. O tigrinho segurou a carta com as duas patas e ainda deu tchauzinho.',
                  'Quase esquentou! No terceiro round o tigrinho guardou a carta no paletó e pediu um whisky.',
                ] } },
    { multiplicador: 4,
      ganhou: { chance: 1.3,  titulo: 'O tigrinho foi com sua cara',
                mensagem: 'Quatro rounds de charme e a carta saiu. O texugo tirou o boné em sinal de respeito.' },
      perdeu: { chance: 6.5,  titulo: 'Bateu na trave',
                mensagem: 'Quatro rounds e a carta quase escorregou da pata do tigrinho. Mas ficou presa no cadarço do tênis.' } },
    { multiplicador: 5,
      ganhou: { chance: 1,    titulo: 'Mão quente',
                mensagem: 'Cinco rounds e a Carta LA tomou conta do tabuleiro. Sua mão está mais quente que a pista de dança!' },
      perdeu: { chance: 5.5,  titulo: 'K.O. de cinema',
                mensagem: 'Cinco rounds de emoção e uma queda digna de filme. Os noivos aplaudiram a luta mesmo assim.' } },
    { multiplicador: 6,
      ganhou: { chance: 0.8,  titulo: 'Tigrinho domado',
                mensagem: 'Seis rounds e o tigrinho já ronrona pra você. Até o cachorro ficou com ciúme.' },
      perdeu: { chance: 4.5,  titulo: 'Faltou um golpe',
                mensagem: 'Seis rounds e o tigrinho defendeu tudo. A carta ficou com ele, mas o cachorro virou seu fã.' } },
    { multiplicador: 7,
      ganhou: { chance: 0.6,  titulo: 'Sete é conta de mentiroso',
                mensagem: 'Mas é verdade: sete rounds e o tigrinho soltou a carta. Pode ir pra pista dançar de tênis e tudo!' },
      perdeu: { chance: 4,    titulo: 'Sete rounds de drama',
                mensagem: 'Foi lindo até o sétimo round. O tigrinho segurou a carta e o texugo bufou de raiva por você.' } },
    { multiplicador: 8,
      ganhou: { chance: 0.5,  titulo: 'Golpe especial',
                mensagem: 'Oito rounds e você mandou o golpe especial: Carta LA no tabuleiro inteiro. PLAYER 1 venceu!' },
      perdeu: { chance: 3.5,  titulo: 'Esquentou, mas não ferveu',
                mensagem: 'Oito rounds! O tabuleiro já estava quase dourado quando o tigrinho fechou a pata. Que maldade.' } },
    { multiplicador: 9,
      ganhou: { chance: 0.45, titulo: 'Nove rounds de nervo',
                mensagem: 'O tigrinho cansou de segurar e soltou a carta no nono round. O texugo levantou pra aplaudir!' },
      perdeu: { chance: 2.2,  titulo: 'Caiu com classe',
                mensagem: 'Nove rounds de luta e uma queda elegante. O boné até voou, mas a carta não saiu do lugar.' } },
    { multiplicador: 10,
      ganhou: { chance: 0.4,  titulo: 'Dez rounds, zero medo',
                mensagem: 'A Carta LA encheu o tabuleiro e até o HUNCH brilhou mais forte. Os noivos querem você no time deles!' },
      perdeu: { chance: 1.8,  titulo: 'Dez rounds e um suspiro',
                mensagem: 'A plateia já gritava quando o tigrinho guardou a carta no último segundo. Coisa de vilão de novela.' } },
    { multiplicador: 11,
      ganhou: { chance: 0.3,  titulo: 'Tabuleiro em chamas',
                mensagem: 'Onze rounds e o tabuleiro pegando fogo. O tigrinho soltou a carta e ainda pediu uma foto com você.' },
      perdeu: { chance: 1.3,  titulo: 'Chegou tão perto...',
                mensagem: 'Onze rounds! Chegou tão perto que o texugo até levantou da cadeira. Só faltou a carta cair.' } },
    { multiplicador: 12,
      ganhou: { chance: 0.3,  titulo: 'Uma dúzia de coragem',
                mensagem: 'Doze rounds! A carta veio, o boné voou longe e o cachorro uivou de alegria.' },
      perdeu: { chance: 1.1,  titulo: 'O tigrinho suou frio',
                mensagem: 'Doze rounds com o tigrinho suando frio. No fim ele segurou a carta pela pontinha. Que luta!' } },
    { multiplicador: 13,
      ganhou: { chance: 0.25, titulo: '13 não dá azar',
                mensagem: 'Treze rounds e, quem diria, o 13 virou número da sorte. O tigrinho se rendeu a você!' },
      perdeu: { chance: 0.95, titulo: 'Agora o 13 deu azar',
                mensagem: 'Treze rounds e o 13 resolveu fazer jus à fama. O tigrinho guardou a carta rindo baixinho.' } },
    { multiplicador: 14,
      ganhou: { chance: 0.25, titulo: 'Fôlego de maratonista',
                mensagem: 'Catorze rounds e você nem suou. O tênis pediu arrego, mas a Carta LA encheu o tabuleiro!' },
      perdeu: { chance: 0.8,  titulo: 'Quase, quase, quase',
                mensagem: 'Catorze rounds! O whisky já estava no gelo pra comemorar quando veio o K.O. Fica a lenda.' } },
    { multiplicador: 15,
      ganhou: { chance: 0.25, titulo: 'Vitória lendária',
                mensagem: 'Quinze rounds! A plateia levantou, o texugo chorou de emoção e o tigrinho soltou a carta.' },
      perdeu: { chance: 0.7,  titulo: 'Derrota lendária',
                mensagem: 'Quinze rounds e ninguém vai esquecer essa luta. Vai ter história pra contar a festa inteira.' } },
    { multiplicador: 16,
      ganhou: { chance: 0.2,  titulo: 'Modo lenda ativado',
                mensagem: 'Dezesseis rounds sem um K.O. sequer. O tigrinho fez reverência e entregou a carta de bandeja.' },
      perdeu: { chance: 0.6,  titulo: 'Final de roer as unhas',
                mensagem: 'Dezesseis rounds e um K.O. no detalhe. Até os noivos pararam tudo pra assistir essa luta.' } },
    { multiplicador: 17,
      ganhou: { chance: 0.2,  titulo: 'Imbatível',
                mensagem: 'Dezessete rounds! Ergam o Aperol e o whisky: tem lenda jogando o tigrinho do L&A hoje.' },
      perdeu: { chance: 0.5,  titulo: 'Por um fio de bigode',
                mensagem: 'Dezessete rounds! Faltou um fio do bigode do tigrinho pra carta sair. O cachorro está inconsolável.' } },
    { multiplicador: 18,
      ganhou: { chance: 0.2,  titulo: 'O tigrinho jogou a toalha',
                mensagem: 'Dezoito rounds e o tigrinho desistiu de lutar: a Carta LA tomou o tabuleiro. A pista de dança é toda sua!' },
      perdeu: { chance: 0.4,  titulo: 'Até o tigrinho ficou triste',
                mensagem: 'Dezoito rounds e K.O. no finzinho. O tigrinho ficou com tanta pena que quase devolveu a carta.' } },
    { multiplicador: 19,
      ganhou: { chance: 0.2,  titulo: 'Quase impossível',
                mensagem: 'Dezenove rounds! A um passo do topo, o tigrinho soltou a carta. Os noivos estão de queixo caído.' },
      perdeu: { chance: 0.35, titulo: 'Na beira do topo',
                mensagem: 'Dezenove rounds! Faltava um degrau quando o tigrinho segurou a carta. O salão inteiro gritou NÃOOO.' } },
    { multiplicador: 20,
      ganhou: { chance: 0.2,  titulo: 'Zerou o tigrinho!',
                mensagem: 'Vinte rounds, tabuleiro dourado e o tigrinho de joelhos. Você zerou o jogo do casamento! L&A te aplaudem de pé.' },
      perdeu: { chance: 0.3,  titulo: 'K.O. na grande final',
                mensagem: 'Vinte rounds e K.O. na última luta. A derrota mais épica da história do L&A. Respeita, tigrinho!' } },
  ],

  /* ---------- INTENSIDADES ----------
     Faixa visual de cada etapa: quanto mais alta, mais exageradas as animações.
       morno ........ (1x a 3x)   brilho e faíscas leves;
       quente ....... (4x a 7x)   giro mais rápido, faíscas, moldura dourada pulsando, Logo pulando;
       pegando-fogo . (8x a 12x)  tela tremendo, partículas de fogo, fundo esquentando, "batimento";
       lendario ..... (13x a 19x) câmera lenta na parada, raios, chuva de moedas, zoom;
       jackpot ...... (20x)       tudo isso e, se ganhar, o monograma LA em tela cheia, fogos e tela dourada.

     COMO AJUSTAR AS FRONTEIRAS
     - "aPartirDe" é o multiplicador em que a faixa começa; ela vai até a próxima faixa começar.
       Ex.: para o "quente" começar no 3x, troque o 4 por 3 (aí o "morno" fica só com 1x e 2x).
     - Mantenha os 5 ids como estão (sem acento). A ordem das linhas não importa: vale o "aPartirDe".
     - Para uma etapa ter outra faixa, sem mexer aqui, escreva "intensidade" nela, na lista de etapas.
       Ex.: { multiplicador: 10, intensidade: 'lendario', ganhou: …, perdeu: … }. Isso vale só para ela. */
  intensidades: [
    { id: 'morno',        aPartirDe: 1 },
    { id: 'quente',       aPartirDe: 4 },
    { id: 'pegando-fogo', aPartirDe: 8 },
    { id: 'lendario',     aPartirDe: 13 },
    { id: 'jackpot',      aPartirDe: 20 },
  ],

  /* ---------- SÍMBOLOS DO TABULEIRO ----------
     9 símbolos, já desenhados dentro do arquivo (iguais em qualquer aparelho). Exatamente um tem
     "carta: true": é a Carta LA, que enche o tabuleiro na vitória.
     - id: não mude. É ele que liga o símbolo ao desenho provisório.
     - nome: o que os leitores de tela falam.
     - imagem: deixe '' para usar o desenho provisório.

     COMO TROCAR O DESENHO POR UMA IMAGEM REAL (ex.: o texugo ou a logo da HUNCH):
       1. Deixe a imagem quadrada e leve: PNG ou WebP, uns 300×300 px, de preferência com fundo
          transparente e até ~100 KB.
       2. Coloque-a no bloco ASSETS (no fim do arquivo) com um nome curto, sem espaços. Ex.:
          "texugo-real": "data:image/webp;base64,...". O jeito fácil: acrescente a imagem em
          ferramentas/blocos.json e rode  node ferramentas/blocos-pesados.js
       3. Escreva o mesmo nome aqui, no símbolo: imagem: 'texugo-real'.
     A imagem aparece dentro da mesma moldura dourada dos outros símbolos (na Carta, ocupa a carta
     inteira). Se o nome não existir no ASSETS ou a imagem estiver corrompida, o desenho provisório
     volta sozinho e o problema aparece só no console do navegador. */
  simbolos: [
    { id: 'dinheiro', nome: 'Dinheiro', imagem: '' },
    { id: 'aperol',   nome: 'Aperol',   imagem: '' },
    { id: 'whisky',   nome: 'Whisky',   imagem: '' },
    { id: 'texugo',   nome: 'Texugo',   imagem: '' },
    { id: 'cachorro', nome: 'Cachorro', imagem: '' },
    { id: 'tenis',    nome: 'Tênis',    imagem: '' },
    { id: 'bone',     nome: 'Boné',     imagem: '' },
    { id: 'hunch',    nome: 'HUNCH',    imagem: '' },
    { id: 'carta',    nome: 'Carta LA', imagem: '', carta: true },
  ],

  /* ---------- TEMPOS ----------
     Ritmo da rodada. Durações em milissegundos (1000 = 1 segundo).
     Como a rodada anda: a cada etapa os rolos giram e param um de cada vez (da esquerda para a
     direita) e a etapa é anunciada ("ROUND 3 · 3x"). As etapas encurtam aos poucos. A última etapa,
     a do desfecho, tem suspense: o último rolo gira mais lento, "quase" completando.
     Com os valores abaixo: uma rodada que termina em 1x leva uns 4 s, uma que vai até 20x uns 14 s, e
     a rodada média (com as chances padrão) uns 6 s.
     - velocidade: multiplica a velocidade de TUDO. 1 = normal; 2 = duas vezes mais rápido (metade do
       tempo); 0.5 = duas vezes mais lento.
     - primeiraEtapaMs: duração da 1ª etapa (giro + paradas + anúncio). As seguintes ficam um pouco
       mais curtas a cada etapa...
     - etapaMaisCurtaMs: ...até chegar a esta duração mínima.
     - suspenseMs: na última etapa, quanto tempo a mais o último rolo leva para parar (o "quase").
     - pausaAntesDoResultadoMs: depois da última parada, quanto tempo até o resultado aparecer. */
  tempos: {
    velocidade: 1,
    primeiraEtapaMs: 800,
    etapaMaisCurtaMs: 450,
    suspenseMs: 1500,
    pausaAntesDoResultadoMs: 1500,
  },

  /* ---------- SOM ----------
     Efeitos sonoros gerados na hora (sem arquivo de áudio e sem música de fundo): tique dos rolos,
     parada, subida de etapa, fanfarra de vitória e "K.O." na derrota.
     - ligado: true = o jogo começa com som; false = começa mudo. Nos dois casos o botão de
       som (ao lado do placar) liga e desliga a qualquer momento, inclusive durante a rodada.
     - volume: de 0 (mudo) a 1 (máximo). O 1 já é moderado, pensado para um salão com gente perto.
     O som só começa depois do primeiro toque na tela (exigência do iPhone). */
  som: {
    ligado: true,
    volume: 0.8,
  },
};
</script>

     indicador de início). Sem zoom: escala fixa em 1 (o CSS e o código do app completam a proteção). -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tigrinho do L&amp;A</title>

<!-- ===== SEÇÃO 2: ESTILOS ===== -->
<style>
  /* ---------- 2.1 TOKENS: todas as cores, degradês e fontes do jogo ----------
     Paleta do tigrinho: laca vermelha profunda, dourado e verde jade (sem ciano).
     Para mudar uma cor, mude só aqui: o resto do arquivo usa estes nomes. */
  :root {
    /* Laca vermelha (fundo do gabinete e painéis) */
    --laca-950: #1d0303;
    --laca-900: #320606;
    --laca-800: #4d0a0a;
    --laca-700: #6f0e0e;
    --laca-600: #921515;
    --laca-500: #b6201b;
    --laca-400: #db4630;
    /* Dourado (molduras, ornamentos e números) */
    --ouro-50:  #fffbea;
    --ouro-100: #fff0b3;
    --ouro-200: #ffdf78;
    --ouro-300: #f6c544;
    --ouro-400: #e2a528;
    --ouro-500: #c2831a;
    --ouro-600: #925c10;
    --ouro-700: #5c3807;
    /* Verde jade (botões e barra "Ganho") */
    --jade-100: #cbf7e0;
    --jade-200: #8debbf;
    --jade-300: #47d395;
    --jade-400: #1fb276;
    --jade-500: #12905c;
    --jade-600: #0a6a44;
    --jade-700: #06482e;
    --jade-800: #03301f;
    /* Textos */
    --creme: #fff6e5;
    --creme-suave: #f2dbb8;
    /* Sombras, brilhos e véus (translúcidos) */
    --sombra-forte: rgba(18, 0, 0, .68);
    --sombra-suave: rgba(18, 0, 0, .35);
    --brilho: rgba(255, 248, 220, .6);
    --brilho-fraco: rgba(255, 248, 220, .16);
    --trelica: rgba(255, 196, 96, .055);
    --linha-tela: rgba(0, 0, 0, .2);
    --veu-inicio: rgba(29, 3, 3, .38);
    --ornamento: rgba(255, 196, 96, .14);
    /* Cores próprias dos desenhos dos símbolos (sprite da seção 3). As molduras, a Carta LA e o HUNCH
       usam o dourado e a laca acima; o dinheiro usa o jade. */
    --aperol-200: #ffc888;
    --aperol-400: #ff8d2e;
    --aperol-600: #e2590d;
    --aperol-800: #8c3204;
    --whisky-200: #f6c46e;
    --whisky-400: #d4862a;
    --whisky-600: #965015;
    --whisky-800: #4f2606;
    --cinza-300: #c7bfb7;
    --cinza-500: #8b827a;
    --cinza-700: #403935;
    --cinza-900: #1b1715;
    --caramelo-200: #f4c98f;
    --caramelo-400: #d99247;
    --caramelo-600: #a45f22;
    --caramelo-800: #5c3010;
    --rosa-300: #ff9ea6;
    --rosa-500: #df5068;
    --azul-200: #9db6f7;
    --azul-400: #4c72e2;
    --azul-600: #2745a8;
    --azul-800: #132260;

    /* Degradês feitos com os tokens acima */
    --grad-ouro: linear-gradient(180deg, var(--ouro-100) 0%, var(--ouro-300) 32%, var(--ouro-500) 58%, var(--ouro-200) 82%, var(--ouro-400) 100%);
    --grad-ouro-moldura: linear-gradient(135deg, var(--ouro-200) 0%, var(--ouro-500) 22%, var(--ouro-100) 48%, var(--ouro-500) 74%, var(--ouro-300) 100%);
    --grad-ouro-texto: linear-gradient(180deg, var(--ouro-50) 0%, var(--ouro-200) 40%, var(--ouro-400) 64%, var(--ouro-600) 100%);
    --grad-ouro-cartao: linear-gradient(160deg, var(--ouro-100) 0%, var(--ouro-300) 38%, var(--ouro-200) 62%, var(--ouro-400) 100%);
    --grad-moeda: radial-gradient(circle at 35% 30%, var(--ouro-50) 0%, var(--ouro-300) 38%, var(--ouro-500) 72%, var(--ouro-700) 100%);
    --grad-laca: radial-gradient(130% 75% at 50% 38%, var(--laca-600) 0%, var(--laca-700) 42%, var(--laca-900) 100%);
    --grad-laca-painel: linear-gradient(180deg, var(--laca-700) 0%, var(--laca-800) 55%, var(--laca-900) 100%);
    --grad-jade: linear-gradient(180deg, var(--jade-200) 0%, var(--jade-400) 28%, var(--jade-500) 62%, var(--jade-700) 100%);
    --grad-jade-botao: radial-gradient(110% 150% at 50% 15%, var(--jade-200) 0%, var(--jade-400) 34%, var(--jade-600) 74%, var(--jade-800) 100%);

    /* Fontes (embutidas no bloco ASSETS, com fallback do sistema) */
    --fonte-display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
    --fonte-pixel: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
    --fonte-texto: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  /* ---------- 2.2 BASE E PROTEÇÃO CONTRA TOQUES ACIDENTAIS ----------
     Nenhum convidado "quebra" a tela sem querer:
     - sem zoom por toque duplo ou pinça: touch-action: none em tudo (bloqueia o toque duplo, como
       manipulation, e também a pinça; um toque continua virando clique normalmente);
     - sem rolagem, sem efeito elástico e sem puxar para recarregar: overflow: hidden e
       overscroll-behavior: none no html e no body;
     - sem menu ao segurar o dedo numa imagem: -webkit-touch-callout: none, imagens sem arrastar e sem
       receber toques (o toque passa para o elemento de baixo);
     - sem seleção de texto nem destaque de toque.
     O código do app (5.8.1) completa a proteção nos navegadores que ignoram parte disto (Safari antigo). */
  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
  [hidden] { display: none !important; }
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    background: var(--laca-950);
  }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    color: var(--creme);
    font-family: var(--fonte-texto);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }
  img, svg { display: block; pointer-events: none; -webkit-user-drag: none; -webkit-touch-callout: none; }
  button {
    font: inherit;
    color: inherit;
    border: 0;
    background: none;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  /* Só para leitores de tela (some da tela, continua no texto da página). */
  .so-leitor { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Texto com degradê dourado (números, multiplicadores, "Ganho" e títulos). */
  .texto-ouro {
    --sombra-texto: var(--laca-950);
    background: var(--grad-ouro-texto);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 0 var(--sombra-texto)) drop-shadow(0 0 1px var(--sombra-texto));
  }

  /* ---------- 2.3 SALÃO E GABINETE ----------
     O gabinete é o "fliperama" retrato onde o jogo vive, centralizado na tela:
     - celular em pé: preenche a tela (nunca mais largo que 3:4 nem mais alto que 9:21);
     - iPad e telas grandes (largura ≥ 600 px e altura ≥ 500 px, em pé ou deitado): escalado pela altura,
       na proporção 1:2 (a mesma composição de um celular, maior), com o fundo decorativo nas laterais (2.13);
     - celular deitado (altura < 500 px): o aviso "gire o celular" aparece no lugar dele (2.14).
     O tamanho vem do viewport dinâmico (dvw/dvh, que acompanha as barras do Safari e do Chrome).
     Tudo dentro dele escala junto, medido em unidades do próprio gabinete:
     - --gw = 1% da largura (1cqw), --gh = 1% da altura (1cqh);
     - --gu = 1% da largura, limitado pela altura (proporção de referência 9:16): usado nos textos e nas
       peças que precisam caber na altura, para nada transbordar quando o gabinete fica mais largo
       (ex.: Safari com as barras à mostra).
     Sem container query units (navegadores antigos), as mesmas variáveis valem em vw/vh, calculadas a
     partir do tamanho do gabinete. Os textos usam clamp() com mínimo legível e máximo para telas grandes.
     Pilha vertical: área segura → Logo → faixa do multiplicador → tabuleiro → "Ganho" →
     placar e mudo → botão de girar → aviso → área segura. */
  :root {
    --tela-l: 100vw;
    --tela-a: 100vh;
    --gab-l: min(var(--tela-l), var(--tela-a) * 3 / 4);
    --gab-a: min(var(--tela-a), var(--tela-l) * 21 / 9);
    --gw: calc(var(--gab-l) / 100);
    --gh: calc(var(--gab-a) / 100);
    /* Áreas seguras: notch/Dynamic Island no topo, indicador de início embaixo (0 onde não existem). */
    --seguro-topo: env(safe-area-inset-top, 0px);
    --seguro-base: env(safe-area-inset-bottom, 0px);
    --seguro-esq: env(safe-area-inset-left, 0px);
    --seguro-dir: env(safe-area-inset-right, 0px);
  }
  @supports (height: 100dvh) {
    :root { --tela-l: 100dvw; --tela-a: 100dvh; }
  }
  @media (min-width: 600px) and (min-height: 500px) {
    :root { --gab-l: min(var(--tela-l), var(--tela-a) / 2); --gab-a: var(--tela-a); }
  }
  #app {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: radial-gradient(120% 70% at 50% 25%, var(--laca-800) 0%, var(--laca-950) 75%);
  }
  #gabinete {
    position: relative;
    z-index: 1;
    flex: none;
    --gu: min(var(--gw), var(--gh) * 9 / 16);
    width: var(--gab-l);
    height: var(--gab-a);
    container-type: size;
    display: flex;
    flex-direction: column;
    padding: max(6px, var(--seguro-topo)) max(10px, var(--seguro-dir)) max(6px, var(--seguro-base)) max(10px, var(--seguro-esq));
    text-align: center;
    background:
      repeating-linear-gradient(45deg, var(--trelica) 0 2px, transparent 2px 24px),
      repeating-linear-gradient(-45deg, var(--trelica) 0 2px, transparent 2px 24px),
      var(--grad-laca);
    box-shadow: 0 0 0 2px var(--ouro-600), 0 0 48px var(--sombra-forte);
  }
  /* Com container query units, as unidades do gabinete medem o próprio gabinete (cqw/cqh). */
  @supports (width: 1cqw) {
    #gabinete { --gw: 1cqw; --gh: 1cqh; }
  }
  /* iPad e telas grandes: moldura dourada mais rica, para o gabinete "assentar" sobre o fundo decorativo. */
  @media (min-width: 600px) and (min-height: 500px) {
    #gabinete {
      box-shadow: 0 0 0 2px var(--ouro-600), 0 0 0 6px var(--laca-900), 0 0 0 8px var(--ouro-400), 0 0 64px 8px var(--sombra-forte);
    }
  }
  /* Trilhos dourados nas laterais do gabinete */
  #gabinete::before, #gabinete::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 4px;
    pointer-events: none;
    background: linear-gradient(90deg, var(--ouro-700), var(--ouro-300) 50%, var(--ouro-700));
  }
  #gabinete::before { left: 2px; }
  #gabinete::after { right: 2px; }
  #jogo {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(4px, var(--gh), 14px);
  }
  #jogo > * { flex: none; }

  /* ---------- 2.4 TOPO: telhado de pagode + Logo em moldura de fliperama ----------
     A Logo é a primeira a encolher em telas baixas: de ~29% até ~17% da altura do gabinete.
     Ela é recortada (object-fit: cover), sem distorção, centrada nos lutadores. */
  #topo {
    --telhado: clamp(24px, calc(var(--gu) * 12.5), 100px);
    --coluna: clamp(8px, calc(var(--gw) * 3), 24px);
    position: relative;
    flex: 0 1000 calc(var(--gh) * 29); /* encolhe muito antes do tabuleiro (fator 1000 contra 1) */
    min-height: calc(var(--gh) * 17);
    display: flex;
    flex-direction: column;
    padding: 0 var(--coluna);
  }
  /* Colunas de laca dos lados da Logo */
  #topo::before, #topo::after {
    content: '';
    position: absolute;
    top: calc(var(--telhado) * .5);
    bottom: 0;
    width: var(--coluna);
    border-radius: 3px;
    background: linear-gradient(90deg, var(--laca-800), var(--laca-500) 45%, var(--laca-800));
    box-shadow: inset 1px 0 0 var(--ouro-400), inset -1px 0 0 var(--ouro-400);
  }
  #topo::before { left: 0; }
  #topo::after { right: 0; }
  #telhado {
    position: relative;
    z-index: 2;
    flex: none;
    width: calc(100% + 2 * var(--coluna));
    height: var(--telhado);
    margin: 0 calc(-1 * var(--coluna)) calc(var(--telhado) * -.26);
    overflow: visible;
    filter: drop-shadow(0 3px 2px var(--sombra-forte));
  }
  #telhado .ouro { fill: url(#telhado-ouro); stroke: var(--ouro-700); stroke-width: .8; }
  #telhado .jade { fill: url(#telhado-jade); stroke: var(--jade-800); stroke-width: .8; }
  #telhado .telhas { fill: url(#telhado-telhas); }
  #telhado .telha { fill: var(--jade-700); opacity: .5; }
  #telhado .viga { fill: var(--laca-600); stroke: var(--ouro-400); stroke-width: 1; }
  #telhado .perola { fill: url(#telhado-perola); stroke: var(--ouro-700); stroke-width: .6; }
  #telhado .borla { fill: var(--laca-500); stroke: var(--ouro-600); stroke-width: .6; }
  .parada-ouro-0 { stop-color: var(--ouro-50); }
  .parada-ouro-1 { stop-color: var(--ouro-100); }
  .parada-ouro-3 { stop-color: var(--ouro-300); }
  .parada-ouro-5 { stop-color: var(--ouro-500); }
  .parada-ouro-6 { stop-color: var(--ouro-600); }
  .parada-jade-2 { stop-color: var(--jade-200); }
  .parada-jade-4 { stop-color: var(--jade-400); }
  .parada-jade-6 { stop-color: var(--jade-600); }
  #moldura-logo {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    padding: 3px;
    border: 3px solid transparent;
    border-radius: 10px;
    background: linear-gradient(var(--laca-950), var(--laca-950)) padding-box, var(--grad-ouro-moldura) border-box;
    box-shadow: 0 0 0 2px var(--laca-900), 0 6px 14px var(--sombra-forte);
    overflow: hidden;
    container: moldura-logo / size;
  }
  /* A arte é 3:2 e os lutadores ficam entre 30% (bonés) e 92% (tênis) da altura dela.
     Moldura alta: mostra os lutadores inteiros. Moldura baixa (telas baixas, resultado):
     sobe o recorte para não cortar os rostos. Nunca distorce (object-fit: cover). */
  #logo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 68%;
    border-radius: 6px;
    -webkit-user-drag: none;
  }
  @container moldura-logo (min-aspect-ratio: 2/1) { #logo { object-position: 50% 58%; } }
  @container moldura-logo (min-aspect-ratio: 13/5) { #logo { object-position: 50% 46%; } }
  @container moldura-logo (min-aspect-ratio: 4/1) { #logo { object-position: 50% 40%; } }
  /* Tela de fliperama: linhas de varredura e vinheta discretas sobre a Logo */
  #moldura-logo::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 6px;
    pointer-events: none;
    background:
      repeating-linear-gradient(180deg, var(--linha-tela) 0 1px, transparent 1px 3px),
      radial-gradient(120% 120% at 50% 50%, transparent 62%, var(--sombra-suave) 100%);
  }
  #titulo { font-family: var(--fonte-display); font-weight: 400; }
  /* Sem a Logo (asset ausente ou corrompido): o título aparece no lugar dela. */
  #topo.sem-logo #logo { display: none; }
  #topo.sem-logo #titulo {
    position: absolute;
    inset: 3px;
    width: auto;
    height: auto;
    clip-path: none;
    white-space: normal;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(26px, calc(var(--gw) * 9), 72px);
  }

  /* ---------- 2.5 FAIXA DO MULTIPLICADOR E DO ANUNCIADOR ---------- */
  #faixa-multiplicador {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    height: clamp(40px, calc(var(--gh) * 6.2), 88px);
    padding: 4px 14px 4px 5px;
    border: 2px solid transparent;
    border-radius: 12px;
    background: var(--grad-laca-painel) padding-box, var(--grad-ouro-moldura) border-box;
    box-shadow: 0 3px 8px var(--sombra-forte);
  }
  /* Anunciador estilo fliperama: "ROUND N · Nx", "K.O." (fonte pixel) */
  #anunciador {
    flex: 1 1 auto;
    min-width: 0;
    align-self: stretch;
    display: flex;
    align-items: center;
    padding: 0 10px;
    border-radius: 8px;
    background: var(--laca-950);
    box-shadow: inset 0 2px 6px var(--sombra-forte), inset 0 0 0 1px var(--ouro-700);
    font-family: var(--fonte-pixel);
    font-size: clamp(10px, calc(var(--gu) * 3.3), 26px);
    line-height: 1.4;
    text-transform: uppercase;
    text-align: left;
    white-space: nowrap;
    color: var(--ouro-200);
    text-shadow: 0 0 6px var(--ouro-500);
  }
  #anunciador[data-tom="ko"] { color: var(--creme); text-shadow: 0 0 8px var(--laca-400), 0 2px 0 var(--laca-500); }
  #anunciador[data-tom="maxima"] { color: var(--ouro-50); text-shadow: 0 0 10px var(--ouro-300); }
  /* O texto do anunciador fica num <span> (anima com transform/opacity sem mexer no painel).
     "ROUND N · Nx" no estilo do placar de luta da Logo: rótulo dourado com contorno escuro de pixel e o
     multiplicador em creme. */
  #anunciador .anuncio { display: inline-block; transform-origin: 0 50%; }
  #anunciador[data-tom="round"] {
    color: var(--ouro-200);
    text-shadow: 2px 2px 0 var(--laca-950), -1px -1px 0 var(--laca-950), 0 0 8px var(--ouro-500);
  }
  #anunciador .anuncio-ponto { color: var(--ouro-500); }
  #anunciador .anuncio-mult { color: var(--creme); text-transform: none; }
  /* Multiplicador em destaque: o selo explode a cada etapa nova (anel dourado e faíscas por trás do número). */
  #faixa-multiplicador { z-index: 2; }
  #selo-multiplicador {
    position: relative;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(28px, calc(var(--gu) * 9.5), 76px);
  }
  #multiplicador {
    position: relative;
    flex: none;
    padding: .07em 0;
    font-family: var(--fonte-display);
    font-size: clamp(28px, calc(var(--gu) * 9.5), 76px);
    line-height: 1;
  }
  .estouro { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
  .estouro .anel {
    position: absolute;
    left: -.8em;
    top: -.8em;
    width: 1.6em;
    height: 1.6em;
    border-radius: 50%;
    background: radial-gradient(circle, transparent 40%, var(--ouro-100) 50%, var(--ouro-300) 58%, var(--ouro-500) 64%, transparent 72%);
    opacity: 0;
  }
  .estouro i {
    position: absolute;
    left: -.12em;
    top: -.12em;
    width: .24em;
    height: .24em;
    border-radius: 50%;
    background: var(--grad-moeda);
    box-shadow: 0 0 .18em var(--ouro-300);
    opacity: 0;
  }

  /* ---------- 2.6 TABULEIRO 3×3 COM MARCADORES DE LINHA ----------
     O tabuleiro tem prioridade: ocupa o maior quadrado que couber no espaço que sobra.
     Cada célula mostra um símbolo do sprite SVG (seção 3, #sprite-simbolos) com <use>: a moldura dourada
     comum + o desenho do símbolo (ou a imagem real, se o CONFIG der uma). */
  #area-tabuleiro {
    flex: 1 1 calc(var(--gw) * 100 - 40px);
    min-height: 0;
    container-type: size;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #moldura-tabuleiro {
    --marcador: clamp(14px, calc(var(--gw) * 5.4), 44px);
    --lado: min(100cqh, calc(100cqw - 2 * var(--marcador) - 12px));
    display: grid;
    grid-template-columns: var(--marcador) var(--lado) var(--marcador);
    align-items: center;
    column-gap: 6px;
  }
  /* Reserva sem container query units: o lado é estimado a partir da altura útil do gabinete (sem as áreas
     seguras), já que não dá para medir o espaço que sobra. No resultado o painel ocupa mais espaço. */
  @supports not (width: 1cqw) {
    #moldura-tabuleiro {
      --util: calc(var(--gab-a) - var(--seguro-topo) - var(--seguro-base));
      --lado: max(60px, min(calc(var(--gab-l) - 2 * var(--marcador) - 32px), calc(var(--util) * .36)));
    }
    #app[data-estado="RESULTADO"] #moldura-tabuleiro {
      --lado: max(60px, min(calc(var(--gab-l) - 2 * var(--marcador) - 32px), calc(var(--util) - var(--gab-a) * .42 - max(255px, var(--util) * .3))));
    }
    /* Tabuleiro estimado pode ficar bem pequeno em telas baixas: o nome escrito (só de símbolo sem desenho) acompanha. */
    #tabuleiro .celula { font-size: clamp(5px, calc(var(--lado) * .05), 32px); }
  }
  #tabuleiro {
    /* Medidas do tabuleiro (as células e os rolos usam as mesmas): recuo interno, vão entre as células
       e o passo de um símbolo para o próximo num rolo (altura de uma célula + um vão). */
    --borda-tabuleiro: 3px;
    --recuo: calc(var(--lado) * .028);
    --vao: calc(var(--lado) * .022);
    --passo: calc((var(--lado) - 2 * var(--borda-tabuleiro) - 2 * var(--recuo) + var(--vao)) / 3);
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    grid-auto-flow: column; /* as células vêm rolo a rolo (coluna a coluna) */
    gap: var(--vao);
    width: var(--lado);
    height: var(--lado);
    padding: var(--recuo);
    border: var(--borda-tabuleiro) solid transparent;
    border-radius: 14px;
    background: linear-gradient(var(--laca-950), var(--laca-900)) padding-box, var(--grad-ouro-moldura) border-box;
    box-shadow: 0 0 0 2px var(--laca-900), 0 8px 18px var(--sombra-forte);
  }
  .celula {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    border-radius: 16%; /* o mesmo arredondado da moldura desenhada no sprite */
    font-size: clamp(8px, calc(var(--lado) * .046), 32px);
    font-weight: 600;
    line-height: 1.1;
    color: var(--creme);
    text-shadow: 0 1px 0 var(--laca-950);
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  .celula .simbolo { width: 100%; height: 100%; }
  /* A Carta LA tem a própria moldura ornamental (e uma aura dourada em volta da célula). */
  .celula.carta { box-shadow: 0 0 calc(var(--lado) * .03) var(--ouro-300); }
  .celula.carta .simbolo-moldura { display: none; }
  /* Nome do símbolo: só aparece se um símbolo novo, inventado no CONFIG, não tiver desenho nem imagem. */
  .simbolo-nome {
    position: absolute;
    inset: 14%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Tela inicial: atrás do cartão desfocado, os símbolos "respiram" e um brilho sutil passa pelo
     tabuleiro em onda pela diagonal (o atraso --i de cada célula vem do código do app). Só transform e
     opacity, sem nada sair da célula. Para fora da tela inicial e com "reduzir movimento". */
  .celula::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(125deg, transparent 18%, var(--brilho) 40%, transparent 62%);
    opacity: 0;
  }
  #app[data-estado="INICIO"] .celula .simbolo { animation: respirar 3.6s ease-in-out infinite; animation-delay: calc(var(--i, 0) * -.45s); }
  #app[data-estado="INICIO"] .celula::after { animation: reluzir 5s ease-in-out infinite; animation-delay: calc(var(--i, 0) * .2s); }
  @keyframes respirar {
    0%, 100% { transform: scale(.955); }
    50% { transform: scale(1); }
  }
  @keyframes reluzir {
    0%, 100% { opacity: 0; }
    10% { opacity: .55; }
    24% { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #app[data-estado="INICIO"] .celula .simbolo, #app[data-estado="INICIO"] .celula::after { animation: none; }
  }
  /* Sprite dos símbolos: fica na página (os <use> das células apontam para ele), mas sem ocupar espaço. */
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* Rolos (só durante a rodada): 3 colunas exatamente por cima das células. Cada rolo é uma janela
     (overflow: hidden) com duas fitas de símbolos empilhados, que descem juntas (translateY, animado pelo
     código do app com GSAP): a nítida e a borrada (o mesmo desenho com um desfoque vertical fixo, que
     aparece por opacidade quando o rolo está rápido = blur de movimento). Só transform e opacity mudam.
     Durante a rodada as células ficam escondidas por baixo e recebem o símbolo de cada rolo quando ele
     para; no resultado os rolos somem e as células (com o mesmo tabuleiro) voltam. */
  .rolos {
    position: absolute;
    inset: var(--recuo);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    column-gap: var(--vao);
    pointer-events: none;
    visibility: hidden;
  }
  #tabuleiro.girando .rolos { visibility: visible; }
  #tabuleiro.girando .celula { visibility: hidden; }
  /* Ensaio invisível na abertura (atrás do cartão inicial): os rolos giram uma vez quase transparentes,
     para o navegador já ter os desenhos prontos no primeiro toque. Os filtros fixos abaixo são os mesmos
     que o toque liga (botões travados e o véu do cartão sumindo): assim o navegador também já os preparou. */
  #tabuleiro.aquecendo .rolos {
    visibility: visible;
    opacity: .02;
    filter: saturate(.35) brightness(.78);
    -webkit-backdrop-filter: blur(7px) saturate(1.15);
    backdrop-filter: blur(7px) saturate(1.15);
  }
  .rolos .item.vazio { visibility: hidden; } /* itens da fita que a etapa não usa: nada a desenhar */
  .rolo { position: relative; min-width: 0; overflow: hidden; }
  .fita { position: absolute; top: 0; left: 0; right: 0; will-change: transform; }
  .fita-borrada { opacity: 0; will-change: transform, opacity; }
  .rolos .item { position: relative; height: var(--passo); padding-bottom: var(--vao); }
  .rolos .item .simbolo { width: 100%; height: 100%; }
  .fita-borrada .item .simbolo { overflow: visible; } /* o rastro do desfoque passa para o vão */
  .rolos .item.carta .simbolo-moldura { display: none; }
  .rolos .item-nome {
    position: absolute;
    inset: 14% 14% calc(14% + var(--vao));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(8px, calc(var(--lado) * .046), 32px);
    font-weight: 600;
    line-height: 1.1;
    color: var(--creme);
    overflow-wrap: anywhere;
  }
  .marcadores {
    display: grid;
    grid-template-rows: repeat(3, 1fr);
    align-items: center;
    justify-items: center;
    height: var(--lado);
    padding: calc(var(--lado) * .028) 0;
  }
  .marcadores span {
    display: grid;
    place-items: center;
    width: var(--marcador);
    height: var(--marcador);
    border-radius: 50%;
    background: var(--grad-moeda);
    box-shadow: 0 1px 3px var(--sombra-forte), inset 0 0 0 1px var(--ouro-600);
    font-family: var(--fonte-display);
    font-size: clamp(9px, calc(var(--marcador) * .62), 28px);
    line-height: 1;
    color: var(--laca-800);
  }

  /* ---------- 2.7 BARRA "GANHO" (jade) ----------
     Na vitória o valor conta de 0x até Nx (5.7.2); na derrota fica 0x. */
  #barra-ganho {
    --moeda: clamp(28px, calc(var(--gu) * 10), 80px);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .45em;
    height: clamp(40px, calc(var(--gh) * 5.8), 82px);
    margin: 0 calc(var(--moeda) * .5);
    padding: 0 var(--moeda);
    border: 2px solid transparent;
    border-radius: 999px;
    background: var(--grad-jade) padding-box, var(--grad-ouro-moldura) border-box;
    box-shadow: inset 0 2px 0 var(--brilho), inset 0 -4px 8px var(--sombra-suave), 0 4px 10px var(--sombra-forte);
  }
  /* Moedas douradas (com furo quadrado) nas pontas da barra */
  #barra-ganho::before, #barra-ganho::after {
    content: '';
    position: absolute;
    top: 50%;
    width: var(--moeda);
    height: var(--moeda);
    margin-top: calc(var(--moeda) * -.5);
    border-radius: 50%;
    background: linear-gradient(var(--jade-700), var(--jade-700)) center / 28% 28% no-repeat, var(--grad-moeda);
    box-shadow: 0 2px 5px var(--sombra-forte), inset 0 0 0 2px var(--ouro-600);
  }
  #barra-ganho::before { left: calc(var(--moeda) * -.5); }
  #barra-ganho::after { right: calc(var(--moeda) * -.5); }
  #barra-ganho .texto-ouro { --sombra-texto: var(--jade-800); font-family: var(--fonte-display); line-height: 1.2; }
  #rotulo-ganho { font-size: clamp(18px, calc(var(--gu) * 5.6), 45px); }
  #valor-ganho { font-size: clamp(22px, calc(var(--gu) * 7.4), 60px); }

  /* ---------- 2.8 PLACAR DECORATIVO (só piada, não é dinheiro) E ESPAÇO DO BOTÃO DE MUDO ---------- */
  #placar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: clamp(28px, calc(var(--gh) * 4.2), 60px);
  }
  .pilula {
    flex: 0 1 auto;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
    padding: 0 .9em;
    border: 1.5px solid transparent;
    border-radius: 999px;
    background: linear-gradient(var(--laca-950), var(--laca-900)) padding-box, var(--grad-ouro-moldura) border-box;
    box-shadow: inset 0 2px 4px var(--sombra-forte);
    font-size: clamp(11px, calc(var(--gu) * 3.4), 27px);
    font-weight: 600;
    white-space: nowrap;
    color: var(--creme);
  }
  /* Botão de som (mudo): no espaço reservado do placar, do mesmo tamanho de antes (quadrado da altura
     do placar), então nada muda de lugar. Nunca é travado: funciona durante a rodada.
     aria-pressed="true" = mudo (ícone com X, mais apagado); "false" = som ligado (ícone com ondas). */
  #botao-mudo {
    position: relative;
    flex: none;
    height: 100%;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1.5px solid transparent;
    border-radius: 50%;
    background: linear-gradient(var(--laca-950), var(--laca-900)) padding-box, var(--grad-ouro-moldura) border-box;
    box-shadow: inset 0 2px 4px var(--sombra-forte);
    color: var(--ouro-100);
  }
  /* Área de toque um pouco maior (para os lados e para cima), sem invadir o botão de girar embaixo. */
  #botao-mudo::before { content: ''; position: absolute; inset: -8px -8px 0; }
  #botao-mudo:active { transform: scale(.94); }
  #botao-mudo:focus-visible { outline: 2px solid var(--ouro-300); outline-offset: 2px; }
  .icone-som { width: 64%; height: 64%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .icone-som .alto-falante { fill: currentColor; }
  .icone-som .xis { display: none; }
  #botao-mudo[aria-pressed="true"] { color: var(--creme-suave); background: linear-gradient(var(--laca-950), var(--laca-950)) padding-box, var(--grad-ouro-moldura) border-box; }
  #botao-mudo[aria-pressed="true"] .icone-som { opacity: .75; }
  #botao-mudo[aria-pressed="true"] .ondas { display: none; }
  #botao-mudo[aria-pressed="true"] .xis { display: inline; stroke: var(--aperol-400); }

  /* ---------- 2.9 BOTÕES (jade com moldura dourada) ---------- */
  .botao-jade {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .35em;
    min-height: 64px;
    padding: 0 1.1em;
    border: 3px solid transparent;
    border-radius: 999px;
    background: var(--grad-jade-botao) padding-box, var(--grad-ouro-moldura) border-box;
    box-shadow: inset 0 3px 0 var(--brilho), inset 0 -5px 10px var(--sombra-suave), 0 4px 0 var(--ouro-700), 0 9px 18px var(--sombra-forte);
    font-family: var(--fonte-display);
    line-height: 1.05;
    color: var(--ouro-50);
    text-shadow: 0 2px 0 var(--jade-800), 0 0 2px var(--jade-800);
  }
  .botao-jade:active:not(:disabled) { transform: translateY(2px) scale(.98); }
  .botao-jade:disabled { filter: saturate(.35) brightness(.78); cursor: default; }
  /* Botão de girar: grande, na zona do polegar (embaixo), com pelo menos 64 px de altura. */
  #botao-girar {
    align-self: center;
    width: min(calc(var(--gw) * 74), 600px);
    height: clamp(64px, calc(var(--gh) * 9.2), 130px);
    font-size: clamp(22px, calc(var(--gu) * 7), 56px);
  }
  #rotulo-girar { line-height: 1.25; }
  .icone-girar {
    width: 1.05em;
    height: 1.05em;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 2px 0 var(--jade-800));
  }

  /* ---------- 2.10 RESULTADO ----------
     Ocupa o lugar do botão de girar (na zona do polegar). A Logo e depois o tabuleiro encolhem para
     o título e a mensagem caberem inteiros, sem rolagem, até no iPhone SE (375×667). */
  #painel-resultado {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: clamp(3px, calc(var(--gh) * .8), 12px);
    padding: clamp(8px, calc(var(--gh) * 1.4), 20px) clamp(10px, calc(var(--gw) * 3.6), 28px);
    border: 2px solid transparent;
    border-radius: 16px;
    background: var(--grad-laca-painel) padding-box, var(--grad-ouro-moldura) border-box;
    box-shadow: 0 6px 16px var(--sombra-forte);
  }
  .resultado-cabecalho { display: flex; align-items: baseline; justify-content: center; gap: .35em; }
  #resultado-tipo {
    font-family: var(--fonte-display);
    font-size: clamp(20px, calc(var(--gu) * 6.2), 50px);
    line-height: 1.05;
    padding: .06em 0; /* espaço para os glifos da fonte display, sem mudar a altura da linha */
    margin: -.06em 0;
    color: var(--creme);
  }
  #painel-resultado[data-tipo="ganhou"] #resultado-tipo { color: var(--ouro-200); }
  #resultado-multiplicador {
    font-family: var(--fonte-display);
    font-size: clamp(22px, calc(var(--gu) * 7), 56px);
    line-height: 1.05;
    padding: .06em 0;
    margin: -.06em 0;
  }
  #resultado-titulo {
    max-width: 100%;
    font-family: var(--fonte-display);
    font-weight: 400;
    font-size: clamp(18px, calc(var(--gu) * 5.6), 45px);
    line-height: 1.15;
    overflow-wrap: break-word;
  }
  #resultado-mensagem {
    max-width: 100%;
    font-size: clamp(13px, calc(var(--gu) * 3.8), 30px);
    line-height: 1.4;
    color: var(--creme-suave);
    overflow-wrap: break-word;
  }
  #botao-jogar-de-novo {
    align-self: center;
    width: min(100%, max(320px, calc(var(--gw) * 60)));
    min-height: max(64px, calc(var(--gh) * 7));
    margin-top: 2px;
    font-size: clamp(20px, calc(var(--gu) * 6.2), 50px);
  }

  /* ---------- 2.10.1 REVELAÇÃO FINAL (vitória e derrota) E FESTA ----------
     Camadas por cima das células, dentro do #tabuleiro (criadas pelo código do app, 5.7.1). Todas
     começam invisíveis e só a opacidade e o transform delas mudam:
     - .linhas-pagamento: as 3 linhas acendem na vitória (cada traço cresce com scaleX e brilha);
     - .morto + .apagado: rolos "mortos" na derrota. O .morto é um cinza com mix-blend-mode: saturation
       (tira a cor do que está embaixo) e o .apagado é um véu escuro. Os dois são estáticos e aparecem
       por opacidade: a dessaturação acontece sem animar filter;
     - .ko: o "K.O." gigante em fonte pixel.
     A festa (confete e chuva de moedas) é desenhada em dois <canvas> numa camada por cima do jogo (#festa). */
  #tabuleiro { isolation: isolate; } /* o .morto só tira a cor do tabuleiro, não do resto da tela */
  .camada-revelacao { position: absolute; inset: var(--recuo); pointer-events: none; opacity: 0; visibility: hidden; }
  .camada-revelacao.ativa { visibility: visible; }
  .morto { background: hsl(0 0% 50%); mix-blend-mode: saturation; border-radius: 8px; }
  .apagado { background: var(--laca-950); border-radius: 8px; }
  .linhas-pagamento { opacity: 1; }
  .linhas-pagamento .linha {
    position: absolute;
    left: -2%;
    right: -2%;
    height: calc(var(--lado) * .034);
    margin-top: calc(var(--lado) * -.017);
    border-radius: 999px;
    background: linear-gradient(90deg, transparent, var(--ouro-100) 8%, var(--ouro-50) 50%, var(--ouro-100) 92%, transparent);
    box-shadow: 0 0 calc(var(--lado) * .025) var(--ouro-300), 0 0 calc(var(--lado) * .06) var(--ouro-400);
    transform-origin: 0 50%;
    opacity: 0;
  }
  .linhas-pagamento .linha[data-linha="2"] { top: 16.67%; }
  .linhas-pagamento .linha[data-linha="1"] { top: 50%; }
  .linhas-pagamento .linha[data-linha="3"] { top: 83.33%; }
  .ko {
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--fonte-pixel);
    font-size: calc(var(--lado) * .2);
    line-height: 1;
    white-space: nowrap;
    color: var(--laca-400);
    text-shadow:
      .05em 0 0 var(--laca-950), -.05em 0 0 var(--laca-950), 0 .05em 0 var(--laca-950), 0 -.05em 0 var(--laca-950),
      .05em .05em 0 var(--laca-950), -.05em -.05em 0 var(--laca-950), .05em -.05em 0 var(--laca-950), -.05em .05em 0 var(--laca-950),
      0 .11em 0 var(--ouro-500), 0 .16em .12em var(--sombra-forte);
  }
  /* A festa fica dentro do gabinete, por cima do tabuleiro e da Logo, mas embaixo do painel do resultado
     (o texto continua legível com a chuva caindo) e do aviso de brincadeira. */
  #festa { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  #painel-resultado { position: relative; z-index: 4; }
  #festa canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* Vitória: um brilho passa pelas Cartas (o mesmo .celula::after da tela inicial; só opacidade). */
  #tabuleiro.vitoria .celula::after { animation: reluzir 1.6s ease-in-out 3; animation-delay: calc(var(--i, 0) * .12s); }
  @media (prefers-reduced-motion: reduce) {
    #tabuleiro.vitoria .celula::after { animation: none; }
  }

  /* ---------- 2.10.2 EFEITOS POR INTENSIDADE (faixas da etapa, Logo, fogo, raios, jackpot) ----------
     A faixa da etapa revelada fica em #jogo[data-intensidade] (morno, quente, pegando-fogo, lendario, jackpot).
     Peças (criadas pelo código do app, 5.7.3, ou na marcação), todas só com opacity e transform:
     - .aura-tabuleiro: moldura dourada em volta do tabuleiro que pulsa durante a rodada, do "quente" em diante
       (mais rápida nas faixas altas, sempre bem abaixo de 3 vezes por segundo);
     - .brilho-logo: brilho dourado por cima da Logo;
     - #efeitos: camada por cima de tudo, sem receber toques: .calor (fundo esquentando), .flash (clarão dos
       raios), .jackpot (tela dourada com o monograma LA) e o <canvas> das faíscas, brasas, raios e fogos.
     "Reduzir movimento" (classe .reduzir-movimento na raiz, ligada a prefers-reduced-motion): o pulso vira
     um fade lento e os raios de sol do jackpot não giram. Aba oculta (.aba-oculta): animações CSS pausam. */
  #moldura-tabuleiro { position: relative; }
  .aura-tabuleiro {
    position: absolute;
    grid-column: 2;
    grid-row: 1;
    inset: -5px;
    border: 3px solid var(--ouro-200);
    border-radius: 18px;
    box-shadow: 0 0 10px 2px var(--ouro-300), 0 0 26px 6px var(--ouro-500), inset 0 0 14px var(--ouro-300);
    pointer-events: none;
    opacity: 0;
  }
  #app[data-estado="GIRANDO"] #jogo[data-intensidade="quente"] .aura-tabuleiro { animation: pulsar-aura 1.1s ease-in-out infinite; }
  #app[data-estado="GIRANDO"] #jogo[data-intensidade="pegando-fogo"] .aura-tabuleiro { animation: pulsar-aura .85s ease-in-out infinite; }
  #app[data-estado="GIRANDO"] #jogo[data-intensidade="lendario"] .aura-tabuleiro,
  #app[data-estado="GIRANDO"] #jogo[data-intensidade="jackpot"] .aura-tabuleiro { animation: pulsar-aura .7s ease-in-out infinite; }
  @keyframes pulsar-aura { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  .reduzir-movimento #app[data-estado] #jogo[data-intensidade] .aura-tabuleiro { animation-duration: 2.4s; }
  .brilho-logo {
    position: absolute;
    inset: 3px;
    border-radius: 6px;
    background: radial-gradient(75% 75% at 50% 45%, var(--ouro-50), var(--ouro-300) 45%, transparent 78%);
    mix-blend-mode: screen;
    pointer-events: none;
    opacity: 0;
  }
  #efeitos { position: absolute; inset: 0; z-index: 10; pointer-events: none; overflow: hidden; }
  #efeitos > * { position: absolute; inset: 0; }
  #efeitos canvas { width: 100%; height: 100%; }
  #efeitos .calor {
    opacity: 0;
    background:
      linear-gradient(0deg, var(--aperol-400), transparent 34%),
      radial-gradient(80% 70% at 50% 48%, transparent 52%, var(--aperol-400) 86%, var(--laca-500) 100%);
  }
  #efeitos .flash { opacity: 0; background: radial-gradient(90% 70% at 50% 40%, var(--ouro-50), var(--ouro-200) 45%, transparent 90%); }
  #efeitos .jackpot {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vh, 20px);
    overflow: hidden;
    visibility: hidden;
    opacity: 0;
    background: radial-gradient(circle at 50% 45%, var(--ouro-50) 0%, var(--ouro-200) 22%, var(--ouro-400) 50%, var(--ouro-600) 80%, var(--ouro-700) 100%);
  }
  #efeitos .jackpot.ativo { visibility: visible; }
  .jackpot .raios-sol {
    position: absolute;
    left: 50%;
    top: 45%;
    width: 170vmax;
    height: 170vmax;
    margin: -85vmax 0 0 -85vmax;
    border-radius: 50%;
    background: repeating-conic-gradient(var(--ouro-50) 0deg 7deg, transparent 7deg 20deg);
    opacity: .35;
  }
  .jackpot .monograma {
    position: relative;
    width: min(80vw, 58vh);
    height: min(80vw, 58vh);
    filter: drop-shadow(0 6px 18px var(--sombra-forte));
  }
  .jackpot .jackpot-texto {
    position: relative;
    margin: 0;
    font-family: var(--fonte-pixel);
    font-size: clamp(18px, 7vw, 44px);
    line-height: 1.2;
    color: var(--laca-600);
    text-shadow: 0 .08em 0 var(--ouro-50), 0 .14em .1em var(--sombra-forte);
  }
  .aba-oculta *, .aba-oculta *::before, .aba-oculta *::after { animation-play-state: paused !important; }
  @media (orientation: landscape) and (max-height: 500px) {
    #efeitos { visibility: hidden; }
  }

  /* ---------- 2.11 AVISO DE BRINCADEIRA (sempre visível, acima do cartão inicial) ---------- */
  #aviso-brincadeira {
    position: relative;
    z-index: 6;
    flex: none;
    padding-top: 5px;
    font-size: clamp(10px, calc(var(--gu) * 2.9), 22px);
    line-height: 1.3;
    color: var(--creme-suave);
    opacity: .85;
  }

  /* ---------- 2.12 TELA INICIAL: cartão dourado sobre o gabinete desfocado ----------
     O desfoque é estático (véu com backdrop-filter). Entrar e sair usam só opacity e transform. */
  #cartao-inicio {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(var(--gh) * 5) calc(var(--gw) * 6);
    background: var(--veu-inicio);
    -webkit-backdrop-filter: blur(7px) saturate(1.15);
    backdrop-filter: blur(7px) saturate(1.15);
    opacity: 1;
    transition: opacity .3s ease, display .3s allow-discrete;
  }
  #cartao-inicio[hidden] { opacity: 0; }
  @starting-style { #cartao-inicio { opacity: 0; } }
  /* Sem backdrop-filter: o próprio jogo fica desfocado atrás do cartão. */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    #app[data-estado="INICIO"] #jogo { filter: blur(6px); }
  }
  .cartao {
    position: relative;
    width: min(100%, calc(var(--gu) * 96));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(16px, calc(var(--gh) * 3.2), 44px);
    padding: clamp(24px, calc(var(--gh) * 4.2), 58px) clamp(18px, calc(var(--gw) * 6), 46px);
    border-radius: 20px;
    background: var(--grad-ouro-cartao);
    box-shadow:
      inset 0 0 0 2px var(--ouro-600),
      inset 0 0 0 6px var(--ouro-100),
      inset 0 0 0 7.5px var(--laca-600),
      inset 0 2px 18px var(--brilho),
      0 0 0 2px var(--laca-900),
      0 18px 40px var(--sombra-forte);
    transition: transform .3s ease;
  }
  #cartao-inicio[hidden] .cartao { transform: translateY(10px) scale(.94); }
  @starting-style { .cartao { transform: translateY(10px) scale(.94); } }
  /* Cravos de laca nos quatro cantos do cartão */
  .cartao::before {
    content: '';
    position: absolute;
    inset: 13px;
    pointer-events: none;
    background:
      radial-gradient(circle, var(--laca-600) 0 3px, transparent 3.5px) left top / 10px 10px no-repeat,
      radial-gradient(circle, var(--laca-600) 0 3px, transparent 3.5px) right top / 10px 10px no-repeat,
      radial-gradient(circle, var(--laca-600) 0 3px, transparent 3.5px) left bottom / 10px 10px no-repeat,
      radial-gradient(circle, var(--laca-600) 0 3px, transparent 3.5px) right bottom / 10px 10px no-repeat;
  }
  #frase-inicial {
    position: relative;
    max-width: 22em;
    font-size: clamp(17px, calc(var(--gu) * 5.4), 40px);
    font-weight: 600;
    line-height: 1.4;
    color: var(--laca-800);
    text-shadow: 0 1px 0 var(--ouro-50);
  }
  #botao-comecar {
    width: 100%;
    min-height: clamp(66px, calc(var(--gh) * 10), 136px);
    font-size: clamp(24px, calc(var(--gu) * 8), 60px);
    animation: pulsar 1.6s ease-in-out infinite;
  }
  /* Auréola que pulsa em volta do botão (só opacity/transform; ~0,6 pulso por segundo). */
  #botao-comecar::after {
    content: '';
    position: absolute;
    inset: -7px;
    border-radius: inherit;
    pointer-events: none;
    box-shadow: 0 0 0 3px var(--jade-200), 0 0 22px 6px var(--jade-300);
    opacity: .2;
    animation: aureola 1.6s ease-in-out infinite;
  }
  @keyframes pulsar {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  @keyframes aureola {
    0%, 100% { opacity: .15; transform: scale(.98); }
    50% { opacity: .9; transform: scale(1.04); }
  }
  @media (prefers-reduced-motion: reduce) {
    #botao-comecar { animation: none; }
    #botao-comecar::after { animation-duration: 3.2s; }
    #cartao-inicio, .cartao { transition-duration: .01s; }
  }

  /* ---------- 2.13 FUNDO DECORATIVO DAS LATERAIS (iPad e telas largas) ----------
     Laca vermelha com treliça e moedas douradas, uma lanterna em cada lado e pétalas caindo.
     Só aparece quando sobra espaço ao lado do gabinete. É só enfeite: não recebe toques e fica fora da
     leitura de tela. As pétalas e as lanternas animam só transform; com "reduzir movimento" ficam paradas. */
  #fundo { display: none; }
  @media (min-width: 600px) and (min-height: 500px), (min-aspect-ratio: 3/4) and (min-height: 500px) {
    #fundo {
      display: block;
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
  }
  .lateral {
    --lado-l: calc((var(--tela-l) - var(--gab-l)) / 2);
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: var(--lado-l);
    overflow: hidden;
    background:
      radial-gradient(circle, var(--ouro-300) 0 2.5px, var(--ouro-600) 3px 4px, transparent 4.5px) 0 0 / 64px 64px,
      radial-gradient(circle, var(--ouro-300) 0 2.5px, var(--ouro-600) 3px 4px, transparent 4.5px) 32px 32px / 64px 64px,
      linear-gradient(45deg, transparent calc(50% - 1px), var(--ornamento) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)) 0 0 / 64px 64px,
      linear-gradient(-45deg, transparent calc(50% - 1px), var(--ornamento) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)) 0 0 / 64px 64px,
      radial-gradient(140% 60% at 100% 50%, var(--laca-700) 0%, transparent 70%),
      linear-gradient(90deg, var(--laca-950) 0%, transparent 60%);
  }
  /* O lado direito é o espelho do esquerdo. */
  .lateral-dir { left: auto; right: 0; transform: scaleX(-1); }
  /* Lanterna de papel pendurada num cordão dourado. */
  .lanterna {
    --l: clamp(30px, calc(var(--lado-l) * .5), 120px);
    position: absolute;
    top: 13%;
    left: 50%;
    width: var(--l);
    aspect-ratio: 1 / 1.12;
    margin-left: calc(var(--l) / -2);
    border-radius: 50% / 46%;
    background:
      linear-gradient(90deg, transparent 0 21%, var(--sombra-suave) 21% 24%, transparent 24% 48.5%, var(--sombra-suave) 48.5% 51.5%, transparent 51.5% 76%, var(--sombra-suave) 76% 79%, transparent 79%),
      radial-gradient(circle at 40% 36%, var(--laca-400) 0%, var(--laca-500) 34%, var(--laca-700) 74%, var(--laca-900) 100%);
    box-shadow: inset 0 0 0 1.5px var(--ouro-500), 0 0 42px 10px var(--brilho-fraco);
    transform-origin: 50% -110%;
    animation: balancar 5.5s ease-in-out infinite alternate;
  }
  .lanterna::before {
    content: '';
    position: absolute;
    left: 22%;
    right: 22%;
    bottom: 97%;
    height: 100vh;
    border-radius: 0 0 3px 3px;
    background:
      var(--grad-ouro) center bottom / 100% calc(var(--l) * .13) no-repeat,
      linear-gradient(var(--ouro-400), var(--ouro-400)) center top / 2px 100% no-repeat;
  }
  .lanterna::after {
    content: '';
    position: absolute;
    left: 28%;
    right: 28%;
    top: 97%;
    height: calc(var(--l) * .62);
    background:
      var(--grad-ouro) center top / 100% calc(var(--l) * .1) no-repeat,
      linear-gradient(var(--ouro-300), var(--ouro-300)) center calc(var(--l) * .09) / 3px calc(var(--l) * .12) no-repeat,
      repeating-linear-gradient(90deg, var(--laca-500) 0 2px, var(--ouro-500) 2px 3px) center bottom / 58% calc(var(--l) * .38) no-repeat;
  }
  @keyframes balancar {
    from { transform: rotate(-3deg); }
    to { transform: rotate(3deg); }
  }
  /* Pétalas de flor de ameixeira caindo (6 em cada lado, em ritmos diferentes). */
  .petala {
    --cor: var(--laca-400);
    position: absolute;
    top: -32px;
    left: var(--x);
    width: var(--t);
    height: calc(var(--t) * .78);
    border-radius: 80% 0 80% 0;
    background: radial-gradient(circle at 30% 30%, var(--ouro-50) 0%, var(--cor) 72%);
    box-shadow: 0 1px 2px var(--sombra-suave);
    opacity: .92;
    animation: cair var(--dur) linear var(--atraso) infinite;
  }
  .petala:nth-of-type(even) { --cor: var(--ouro-300); }
  /* Laterais largas (iPad grande, iPad deitado): pétalas um pouco maiores. */
  @media (min-width: 1000px) { .petala { width: calc(var(--t) * 1.5); height: calc(var(--t) * 1.17); } }
  .petala:nth-of-type(1) { --x: 12%; --y: 22vh; --t: 14px; --dur: 11s;   --atraso: -1s;   --balanco: 26px; }
  .petala:nth-of-type(2) { --x: 64%; --y: 61vh; --t: 11px; --dur: 14s;   --atraso: -6s;   --balanco: -20px; }
  .petala:nth-of-type(3) { --x: 36%; --y: 44vh; --t: 16px; --dur: 9.5s;  --atraso: -3.5s; --balanco: 32px; }
  .petala:nth-of-type(4) { --x: 80%; --y: 83vh; --t: 12px; --dur: 12.5s; --atraso: -9s;   --balanco: -28px; }
  .petala:nth-of-type(5) { --x: 22%; --y: 74vh; --t: 10px; --dur: 15s;   --atraso: -12s;  --balanco: 18px; }
  .petala:nth-of-type(6) { --x: 52%; --y: 9vh;  --t: 13px; --dur: 10.5s; --atraso: -7.5s; --balanco: -24px; }
  @keyframes cair {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
    25%  { transform: translate3d(var(--balanco), 28vh, 0) rotate(100deg); }
    50%  { transform: translate3d(0, 56vh, 0) rotate(190deg); }
    75%  { transform: translate3d(calc(var(--balanco) * -1), 84vh, 0) rotate(280deg); }
    100% { transform: translate3d(0, calc(112vh + 32px), 0) rotate(370deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .lanterna { animation: none; }
    .petala { animation: none; transform: translateY(var(--y)) rotate(40deg); }
  }

  /* ---------- 2.14 CELULAR DEITADO: aviso "gire o celular" ----------
     Com o celular deitado (altura < 500 px), o aviso cobre a tela no lugar do jogo. O jogo continua na
     memória (mesma rodada, mesmo resultado) e reaparece igual ao voltar o celular para em pé.
     Fica fora do gabinete, então as medidas daqui usam o viewport (vh/vw). */
  #aviso-girar { display: none; }
  @media (orientation: landscape) and (max-height: 500px) {
    #gabinete, #fundo { visibility: hidden; }
    #aviso-girar {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 4vh, 22px);
      padding: max(14px, var(--seguro-topo)) max(24px, var(--seguro-dir)) max(14px, var(--seguro-base)) max(24px, var(--seguro-esq));
      text-align: center;
      background:
        repeating-linear-gradient(45deg, var(--trelica) 0 2px, transparent 2px 24px),
        repeating-linear-gradient(-45deg, var(--trelica) 0 2px, transparent 2px 24px),
        var(--grad-laca);
    }
  }
  .icone-celular {
    width: clamp(64px, 26vh, 120px);
    height: clamp(64px, 26vh, 120px);
    overflow: visible;
    filter: drop-shadow(0 3px 0 var(--laca-950));
  }
  .icone-celular .aparelho {
    fill: var(--laca-900);
    stroke: var(--ouro-300);
    stroke-width: 3.5;
    stroke-linejoin: round;
    transform-box: view-box;
    transform-origin: 50% 60%;
    animation: virar 2.8s ease-in-out infinite;
  }
  .icone-celular .tela-aparelho { fill: var(--jade-500); stroke: none; }
  .icone-celular .seta { fill: none; stroke: var(--jade-300); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes virar {
    0%, 18% { transform: rotate(-90deg); }
    48%, 86% { transform: rotate(0deg); }
    100% { transform: rotate(-90deg); }
  }
  #texto-girar {
    max-width: 16em;
    font-family: var(--fonte-display);
    font-weight: 400;
    font-size: clamp(22px, 9vh, 44px);
    line-height: 1.15;
  }
  #aviso-girar-brincadeira {
    max-width: 36em;
    font-size: clamp(10px, 3.4vh, 15px);
    line-height: 1.3;
    color: var(--creme-suave);
    opacity: .85;
  }
  @media (prefers-reduced-motion: reduce) {
    .icone-celular .aparelho { animation: none; }
  }
</style>

<body>
<!-- ===== SEÇÃO 3: MARCAÇÃO ===== -->
<!-- Sprite dos símbolos: SVG próprio, desenhado à mão para este jogo (nada do jogo original).
     Cada <symbol> é um desenho de 100×100; as células do tabuleiro o mostram com <use>, sem repetir o SVG.
     Estilo único "brilhante": degradês, realce de luz e contorno escuro. As cores vêm dos tokens do :root
     (2.1) pelas paradas dos degradês abaixo. Nenhum desenho usa emoji nem fonte: até as letras do HUNCH e
     o monograma LA são traços e formas.
     - sb-moldura: moldura dourada comum aos 7 ícones e ao HUNCH;
     - sb-dinheiro, sb-aperol, sb-whisky, sb-texugo, sb-cachorro, sb-tenis, sb-bone: os 7 ícones;
     - sb-hunch: letreiro dourado HUNCH;
     - sb-carta: a Carta LA (monograma em folha de ouro sobre carta vermelha, moldura ornamental e aura).
     Imagem real no CONFIG (campo "imagem" do símbolo): o código do app cria aqui um <symbol> com ela. -->
<svg id="sprite-simbolos" class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <!-- Desfoque vertical da fita borrada dos rolos (blur de movimento). Fixo: só a opacidade da fita muda. -->
    <filter id="sf-borrao" x="-5%" y="-45%" width="110%" height="190%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 11"/></filter>
    <!-- Cores lisas (userSpaceOnUse: valem também em traços retos, que não têm área) -->
    <linearGradient id="sg-contorno" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100"><stop offset="0" style="stop-color:var(--laca-950)"/></linearGradient>
    <linearGradient id="sg-realce" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100"><stop offset="0" style="stop-color:var(--ouro-50)"/></linearGradient>
    <linearGradient id="sg-ouro-liso" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100"><stop offset="0" style="stop-color:var(--ouro-300)"/></linearGradient>
    <linearGradient id="sg-creme-liso" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100"><stop offset="0" style="stop-color:var(--creme)"/></linearGradient>
    <linearGradient id="sg-azul-liso" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100"><stop offset="0" style="stop-color:var(--azul-800)"/></linearGradient>
    <linearGradient id="sg-caramelo-liso" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100"><stop offset="0" style="stop-color:var(--caramelo-800)"/></linearGradient>
    <radialGradient id="sg-sombra" cx=".5" cy=".5" r=".5"><stop offset="0" style="stop-color:var(--laca-950);stop-opacity:.75"/><stop offset="1" style="stop-color:var(--laca-950);stop-opacity:0"/></radialGradient>
    <!-- Moldura dourada e janela de laca -->
    <linearGradient id="sg-moldura" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--ouro-200)"/><stop offset=".22" style="stop-color:var(--ouro-500)"/><stop offset=".48" style="stop-color:var(--ouro-100)"/><stop offset=".74" style="stop-color:var(--ouro-500)"/><stop offset="1" style="stop-color:var(--ouro-300)"/></linearGradient>
    <linearGradient id="sg-moldura-dentro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ouro-700)"/><stop offset="1" style="stop-color:var(--ouro-300)"/></linearGradient>
    <radialGradient id="sg-janela" cx=".5" cy=".38" r=".72"><stop offset="0" style="stop-color:var(--laca-500)"/><stop offset=".55" style="stop-color:var(--laca-700)"/><stop offset="1" style="stop-color:var(--laca-900)"/></radialGradient>
    <!-- Ouro dos detalhes, do letreiro e da folha da Carta -->
    <linearGradient id="sg-ouro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ouro-50)"/><stop offset=".4" style="stop-color:var(--ouro-200)"/><stop offset=".66" style="stop-color:var(--ouro-400)"/><stop offset="1" style="stop-color:var(--ouro-600)"/></linearGradient>
    <linearGradient id="sg-folha" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--ouro-100)"/><stop offset=".28" style="stop-color:var(--ouro-300)"/><stop offset=".46" style="stop-color:var(--ouro-50)"/><stop offset=".62" style="stop-color:var(--ouro-400)"/><stop offset=".84" style="stop-color:var(--ouro-200)"/><stop offset="1" style="stop-color:var(--ouro-500)"/></linearGradient>
    <linearGradient id="sg-placa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--laca-900)"/><stop offset="1" style="stop-color:var(--laca-950)"/></linearGradient>
    <!-- Carta LA -->
    <radialGradient id="sg-aura" cx=".5" cy=".5" r=".72"><stop offset="0" style="stop-color:var(--ouro-100)"/><stop offset=".5" style="stop-color:var(--ouro-300)"/><stop offset=".85" style="stop-color:var(--ouro-500)"/><stop offset="1" style="stop-color:var(--ouro-600)"/></radialGradient>
    <radialGradient id="sg-carta" cx=".5" cy=".42" r=".7"><stop offset="0" style="stop-color:var(--laca-400)"/><stop offset=".45" style="stop-color:var(--laca-500)"/><stop offset=".8" style="stop-color:var(--laca-600)"/><stop offset="1" style="stop-color:var(--laca-800)"/></radialGradient>
    <radialGradient id="sg-halo" cx=".5" cy=".5" r=".5"><stop offset="0" style="stop-color:var(--ouro-200);stop-opacity:.45"/><stop offset="1" style="stop-color:var(--ouro-200);stop-opacity:0"/></radialGradient>
    <!-- Dinheiro (jade) -->
    <linearGradient id="sg-nota" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--jade-200)"/><stop offset=".5" style="stop-color:var(--jade-400)"/><stop offset="1" style="stop-color:var(--jade-600)"/></linearGradient>
    <linearGradient id="sg-nota-fundo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--jade-400)"/><stop offset="1" style="stop-color:var(--jade-700)"/></linearGradient>
    <radialGradient id="sg-medalhao" cx=".4" cy=".35" r=".7"><stop offset="0" style="stop-color:var(--jade-300)"/><stop offset="1" style="stop-color:var(--jade-700)"/></radialGradient>
    <!-- Copos e bebidas -->
    <linearGradient id="sg-vidro" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--creme);stop-opacity:.5"/><stop offset=".3" style="stop-color:var(--creme);stop-opacity:.12"/><stop offset=".72" style="stop-color:var(--creme);stop-opacity:.2"/><stop offset="1" style="stop-color:var(--creme);stop-opacity:.42"/></linearGradient>
    <linearGradient id="sg-vidro-boca" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--creme);stop-opacity:.6"/><stop offset="1" style="stop-color:var(--creme);stop-opacity:.16"/></linearGradient>
    <linearGradient id="sg-gelo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--ouro-50);stop-opacity:.95"/><stop offset="1" style="stop-color:var(--creme-suave);stop-opacity:.55"/></linearGradient>
    <linearGradient id="sg-aperol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--aperol-200)"/><stop offset=".35" style="stop-color:var(--aperol-400)"/><stop offset="1" style="stop-color:var(--aperol-600)"/></linearGradient>
    <linearGradient id="sg-aperol-claro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--aperol-200)"/><stop offset="1" style="stop-color:var(--aperol-400)"/></linearGradient>
    <linearGradient id="sg-casca" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--aperol-400)"/><stop offset="1" style="stop-color:var(--aperol-800)"/></linearGradient>
