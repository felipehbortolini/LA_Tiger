<div id="app" data-estado="INICIO">
  <!-- Fundo decorativo das laterais (iPad e telas largas): laca, treliça dourada, lanternas e pétalas caindo. Só enfeite. -->
  <div id="fundo" aria-hidden="true">
    <div class="lateral lateral-esq"><span class="lanterna"></span><i class="petala"></i><i class="petala"></i><i class="petala"></i><i class="petala"></i><i class="petala"></i><i class="petala"></i></div>
    <div class="lateral lateral-dir"><span class="lanterna"></span><i class="petala"></i><i class="petala"></i><i class="petala"></i><i class="petala"></i><i class="petala"></i><i class="petala"></i></div>
  </div>

  <div id="gabinete">
    <main id="jogo">
      <!-- Topo: telhado de pagode (SVG próprio) e a Logo dos noivos em moldura de fliperama.
           A Logo vem do bloco ASSETS (nome "logo") e é colocada aqui pelo código do app. -->
      <header id="topo">
        <svg id="telhado" viewBox="0 0 400 52" preserveAspectRatio="none" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="telhado-ouro" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" class="parada-ouro-1"/>
              <stop offset=".45" class="parada-ouro-3"/>
              <stop offset="1" class="parada-ouro-5"/>
            </linearGradient>
            <linearGradient id="telhado-jade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" class="parada-jade-2"/>
              <stop offset=".55" class="parada-jade-4"/>
              <stop offset="1" class="parada-jade-6"/>
            </linearGradient>
            <radialGradient id="telhado-perola" cx=".35" cy=".3" r=".8">
              <stop offset="0" class="parada-ouro-0"/>
              <stop offset=".5" class="parada-ouro-3"/>
              <stop offset="1" class="parada-ouro-6"/>
            </radialGradient>
            <pattern id="telhado-telhas" width="9" height="52" patternUnits="userSpaceOnUse">
              <rect x="0" y="0" width="1.8" height="52" class="telha"/>
            </pattern>
          </defs>
          <path class="jade" d="M46 38 C 78 32, 98 20, 110 11 L 290 11 C 302 20, 322 32, 354 38 Z"/>
          <path class="telhas" d="M46 38 C 78 32, 98 20, 110 11 L 290 11 C 302 20, 322 32, 354 38 Z"/>
          <rect class="viga" x="30" y="44" width="340" height="7" rx="1.5"/>
          <path class="ouro" d="M2 30 C 34 39, 70 39, 100 38 L 300 38 C 330 39, 366 39, 398 30 L 393 40 C 362 47, 330 47, 300 46 L 100 46 C 70 47, 38 47, 7 40 Z"/>
          <path class="borla" d="M8 40 L 12 51 L 4 51 Z M392 40 L 396 51 L 388 51 Z"/>
          <rect class="ouro" x="104" y="6.5" width="192" height="5.5" rx="2.75"/>
          <circle class="ouro" cx="104" cy="9" r="5"/>
          <circle class="ouro" cx="296" cy="9" r="5"/>
          <circle class="perola" cx="200" cy="7" r="6"/>
        </svg>
        <div id="moldura-logo">
          <img id="logo" alt="" draggable="false">
          <h1 id="titulo" class="so-leitor texto-ouro"></h1>
        </div>
      </header>

      <!-- Faixa do multiplicador e do anunciador ("ROUND N · Nx", "K.O."). #etapa é só para leitores de tela.
           O selo do multiplicador tem o "estouro" (anel e faíscas) que explode a cada etapa nova. -->
      <div id="faixa-multiplicador">
        <span id="etapa" class="so-leitor"></span>
        <span id="anunciador" aria-hidden="true"></span>
        <span id="selo-multiplicador">
          <span class="estouro" aria-hidden="true"><b class="anel"></b><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span id="multiplicador" class="texto-ouro"></span>
        </span>
      </div>

      <!-- Tabuleiro 3×3 com marcadores de linha nas laterais. As 9 células são criadas pelo código do app (rolo a rolo). -->
      <div id="area-tabuleiro">
        <div id="moldura-tabuleiro">
          <div class="marcadores" aria-hidden="true"><span>2</span><span>1</span><span>3</span></div>
          <div id="tabuleiro" aria-label="Tabuleiro"></div>
          <div class="marcadores" aria-hidden="true"><span>2</span><span>1</span><span>3</span></div>
        </div>
      </div>

      <!-- Barra "Ganho" -->
      <div id="barra-ganho">
        <span id="rotulo-ganho" class="texto-ouro"></span>
        <span id="valor-ganho" class="texto-ouro"></span>
      </div>

      <!-- Placar decorativo (as pílulas vêm de textos.placar) e o botão de som (mudo), nunca travado -->
      <div id="placar">
        <button id="botao-mudo" type="button" aria-pressed="false" aria-label="Silenciar o som" title="Som ligado: toque para silenciar"><svg class="icone-som" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="alto-falante" d="M3.5 9.2h3.8L12 5.2v13.6l-4.7-4H3.5z"/><path class="ondas" d="M15.4 9a4.2 4.2 0 0 1 0 6M18 6.4a8 8 0 0 1 0 11.2"/><path class="xis" d="M15.6 9.4l5.2 5.2M20.8 9.4l-5.2 5.2"/></svg></button>
      </div>

      <!-- Anúncio do resultado para leitores de tela (sempre na página, para o anúncio sair na hora):
           tipo, multiplicador, título e mensagem. O painel abaixo é o que se vê. -->
      <p id="anuncio-resultado" class="so-leitor" role="status" aria-live="polite" aria-atomic="true"></p>

      <section id="painel-resultado" hidden>
        <div class="resultado-cabecalho">
          <p id="resultado-tipo"></p>
          <p id="resultado-multiplicador" class="texto-ouro"></p>
        </div>
        <h2 id="resultado-titulo" class="texto-ouro"></h2>
        <p id="resultado-mensagem"></p>
        <button id="botao-jogar-de-novo" class="botao-jade" type="button"></button>
      </section>

      <!-- Sem espaços entre os filhos: o texto do botão é exatamente o rótulo ("Girar" / "Girando…"). -->
      <button id="botao-girar" class="botao-jade" type="button"><svg class="icone-girar" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 0 1-13.7 5.6M4 12a8 8 0 0 1 13.7-5.6M18.6 2.6v4.6H14M5.4 21.4v-4.6H10"/></svg><span id="rotulo-girar"></span></button>
    </main>

    <!-- Festa da vitória: confete (canvas-confetti) e chuva de moedas, por cima do jogo e sem receber toques. -->
    <div id="festa" aria-hidden="true"><canvas id="festa-confete"></canvas><canvas id="festa-moedas"></canvas></div>

    <!-- Aviso discreto, sempre visível (fica por cima do cartão inicial) -->
    <p id="aviso-brincadeira"></p>

    <!-- Tela inicial: cartão dourado sobre o gabinete desfocado -->
    <div id="cartao-inicio">
      <div class="cartao">
        <p id="frase-inicial"></p>
        <button id="botao-comecar" class="botao-jade" type="button"></button>
      </div>
    </div>
  </div>

  <!-- Efeitos por intensidade (5.7.3), por cima de tudo e sem receber toques: fundo esquentando, clarão dos raios,
       revelação do jackpot (tela dourada + monograma LA) e o canvas das faíscas, brasas, raios e fogos. -->
  <div id="efeitos" aria-hidden="true">
    <div class="calor"></div>
    <div class="flash"></div>
    <div class="jackpot"><div class="raios-sol"></div><svg class="monograma" viewBox="0 0 100 100" focusable="false"><use class="simbolo-desenho"/></svg><p class="jackpot-texto"></p></div>
    <canvas id="efeitos-canvas"></canvas>
  </div>

  <!-- Celular deitado: aviso amigável no lugar do jogo (o jogo continua de onde estava ao voltar para em pé). -->
  <div id="aviso-girar">
    <svg class="icone-celular" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <path class="seta" d="M12 34 A 34 34 0 0 1 52 8"/>
      <path class="seta" d="M44 2 L 53 8 L 44 14"/>
      <g class="aparelho">
        <rect x="35" y="32" width="30" height="56" rx="6"/>
        <rect class="tela-aparelho" x="40" y="39" width="20" height="38" rx="2"/>
      </g>
    </svg>
    <p id="texto-girar" class="texto-ouro"></p>
    <p id="aviso-girar-brincadeira"></p>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- 5.1 UTILIDADES ---------- */
  function avisar(texto) {
    console.warn('[Tigrinho] ' + texto);
  }
  function ehObjeto(valor) {
    return valor !== null && typeof valor === 'object' && !Array.isArray(valor);
  }
  function ehTexto(valor) {
    return typeof valor === 'string' && valor.trim() !== '';
  }
  function formatarMultiplicador(multiplicador) {
    return String(multiplicador).replace('.', ',') + 'x';
  }
  // SVG criado pelo código (células do tabuleiro, imagens dos símbolos).
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const XLINK_NS = 'http://www.w3.org/1999/xlink';
  // Aponta um <use>/<image> do SVG para um símbolo do sprite ('#sb-…') ou para uma imagem (data URI).
  // Usa href e também xlink:href (Safari antigo). '' tira o apontamento. Só mexe se mudou.
  function apontarPara(elemento, alvo) {
    if ((elemento.getAttribute('href') || '') === alvo) return;
    if (alvo) {
      elemento.setAttribute('href', alvo);
      elemento.setAttributeNS(XLINK_NS, 'xlink:href', alvo);
    } else {
      elemento.removeAttribute('href');
      elemento.removeAttributeNS(XLINK_NS, 'href');
    }
  }

  /* ---------- 5.2 CONFIGURAÇÃO ATIVA (valores seguros) ----------
     Lê o window.CONFIG do padrinho e devolve uma cópia completa e válida.
     Qualquer problema vira um aviso no console e um valor seguro; nada aparece na tela. */
  const TEXTOS_PADRAO = {
    titulo: 'Tigrinho do L&A',
    fraseInicial: 'Agora que você já contribuiu, vamos ver se o tigrinho ta soltando a carta pra você',
    botaoTentarASorte: 'Tentar a sorte',
    botaoGirar: 'Girar',
    botaoGirando: 'Girando…',
    botaoJogarDeNovo: 'Jogar de novo',
    avisoBrincadeira: 'É só brincadeira: nenhum dinheiro passa por aqui.',
    avisoGirar: 'Gire o celular para jogar',
    rotuloEtapa: 'Etapa',
    rotuloRound: 'ROUND',
    rotuloGanho: 'Ganho',
    placar: ['Saldo: ∞ amor', 'Torcida: 100%'],
    tipoGanhou: 'Ganhou!',
    tipoPerdeu: 'Perdeu!',
    palavraDerrota: 'K.O.',
    palavraVitoriaMaxima: 'PERFECT!',
  };
  const LIMITE_PILULAS = 3; // o placar decorativo mostra até 3 pílulas
  const SIMBOLOS_PADRAO = [
    { id: 'dinheiro', nome: 'Dinheiro' }, { id: 'aperol', nome: 'Aperol' }, { id: 'whisky', nome: 'Whisky' },
    { id: 'texugo', nome: 'Texugo' }, { id: 'cachorro', nome: 'Cachorro' }, { id: 'tenis', nome: 'Tênis' },
    { id: 'bone', nome: 'Boné' }, { id: 'hunch', nome: 'HUNCH' }, { id: 'carta', nome: 'Carta LA', carta: true },
  ];
  // Desenho provisório (o <symbol> do sprite, seção 3) de cada id de símbolo.
  const DESENHOS_DOS_SIMBOLOS = {
    dinheiro: 'sb-dinheiro', aperol: 'sb-aperol', whisky: 'sb-whisky', texugo: 'sb-texugo', cachorro: 'sb-cachorro',
    tenis: 'sb-tenis', bone: 'sb-bone', hunch: 'sb-hunch', carta: 'sb-carta',
  };
  const INTENSIDADES_PADRAO = [
    { id: 'morno', aPartirDe: 1 }, { id: 'quente', aPartirDe: 4 }, { id: 'pegando-fogo', aPartirDe: 8 },
    { id: 'lendario', aPartirDe: 13 }, { id: 'jackpot', aPartirDe: 20 },
  ];
  const IDS_INTENSIDADE = INTENSIDADES_PADRAO.map(function (f) { return f.id; });
  // Aceita o id com acento, espaço ou maiúscula ("Lendário", "pegando fogo"); devolve '' se não for uma faixa conhecida.
  function idIntensidade(valor, onde) {
    if (!ehTexto(valor)) return '';
    const id = valor.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '-');
    if (IDS_INTENSIDADE.indexOf(id) >= 0) return id;
    avisar(onde + ': intensidade "' + valor + '" não existe (use ' + IDS_INTENSIDADE.join(', ') + '). Ignorada.');
    return '';
  }
  const TEMPOS_PADRAO = { velocidade: 1, primeiraEtapaMs: 800, etapaMaisCurtaMs: 450, suspenseMs: 1500, pausaAntesDoResultadoMs: 1500 };
  const SOM_PADRAO = { ligado: true, volume: 0.8 };

  function numeroSeguro(valor, padrao, minimo, onde) {
    const n = typeof valor === 'number' ? valor : (ehTexto(valor) ? Number(valor) : NaN);
    if (Number.isFinite(n) && n >= minimo) return n;
    if (valor !== undefined) avisar(onde + ' inválido (' + JSON.stringify(valor) + '): usando ' + padrao + '.');
    return padrao;
  }

  // Chance de um desfecho: número ≥ 0. Negativa, vazia, ausente ou não numérica conta como 0 (com aviso).
  // Um número escrito como texto ('25' ou '2,5') é aceito, com aviso para corrigir.
  function chanceSegura(valor, onde) {
    if (typeof valor === 'number' && Number.isFinite(valor) && valor >= 0) return valor;
    if (ehTexto(valor)) {
      const n = Number(valor.trim().replace(',', '.'));
      if (Number.isFinite(n) && n >= 0) {
        avisar('Chance em ' + onde + ' escrita como texto (' + JSON.stringify(valor) + '): usando ' + n + '. Escreva sem aspas, com ponto nos decimais.');
        return n;
      }
    }
    const lido = valor === undefined ? 'ausente' : (typeof valor === 'number' ? String(valor) : JSON.stringify(valor));
    avisar('Chance inválida em ' + onde + ' (' + lido + '): contando como 0.');
    return 0;
  }

  function prepararTextos(crus) {
    const textos = Object.assign({}, TEXTOS_PADRAO);
    if (!ehObjeto(crus)) {
      avisar('Seção "textos" ausente ou inválida: usando os textos padrão.');
      return textos;
    }
    Object.keys(TEXTOS_PADRAO).forEach(function (chave) {
      const valor = crus[chave];
      if (chave === 'placar') {
        if (Array.isArray(valor)) {
          textos.placar = valor.filter(ehTexto);
          if (textos.placar.length > LIMITE_PILULAS) {
            avisar('textos.placar tem ' + textos.placar.length + ' textos: só os ' + LIMITE_PILULAS + ' primeiros aparecem.');
            textos.placar = textos.placar.slice(0, LIMITE_PILULAS);
          }
        } else if (valor !== undefined) avisar('textos.placar deve ser uma lista de textos: usando o padrão.');
      } else if (ehTexto(valor)) {
        textos[chave] = valor;
      } else if (valor !== undefined) {
        avisar('textos.' + chave + ' vazio ou inválido: usando o padrão.');
      }
    });
    return textos;
  }

  // Tamanhos que cabem na tela de qualquer aparelho sem corte. Passar disso só gera aviso no console.
  const LIMITE_TITULO = 28;
  const LIMITE_MENSAGEM = 140;

  function avisarSeLongo(texto, limite, onde) {
    if (texto.length > limite) {
      avisar(onde + ' tem ' + texto.length + ' caracteres (o recomendado é até ' + limite + '): pode não caber em telas pequenas.');
    }
  }

  // A mensagem pode ser um texto ou uma lista de textos. Itens vazios ou que não são texto são
  // ignorados; se não sobrar nenhum (texto vazio, lista vazia…), usa a mensagem segura padrão.
  function listaDeMensagens(valor, padrao, onde) {
    const crus = Array.isArray(valor) ? valor : [valor];
    const lista = crus.filter(ehTexto);
    if (!lista.length) {
      avisar('Mensagem vazia ou inválida em ' + onde + ': usando a mensagem segura "' + padrao + '".');
      return [padrao];
    }
    if (lista.length < crus.length) {
      avisar((crus.length - lista.length) + ' mensagem(ns) vazia(s) ou inválida(s) em ' + onde + ': ignorada(s).');
    }
    lista.forEach(function (texto, i) {
      avisarSeLongo(texto, LIMITE_MENSAGEM, Array.isArray(valor) ? onde + '[' + i + ']' : onde);
    });
    return lista;
  }

  function prepararDesfecho(bloco, tipo, multiplicador, onde) {
    const b = ehObjeto(bloco) ? bloco : {};
    const lugar = onde + '.' + tipo;
    const tituloPadrao = (tipo === 'ganhou' ? 'Ganhou em ' : 'Perdeu em ') + formatarMultiplicador(multiplicador);
    const mensagemPadrao = tipo === 'ganhou' ? 'O tigrinho soltou a carta!' : 'O tigrinho guardou a carta.';
    let titulo = tituloPadrao;
    if (ehTexto(b.titulo)) {
      titulo = b.titulo;
      avisarSeLongo(titulo, LIMITE_TITULO, lugar + '.titulo');
    } else {
      avisar('Título vazio ou inválido em ' + lugar + '.titulo: usando "' + tituloPadrao + '".');
    }
    return {
      chance: chanceSegura(b.chance, lugar + '.chance'),
      titulo: titulo,
      mensagens: listaDeMensagens(b.mensagem, mensagemPadrao, lugar + '.mensagem'),
    };
  }

  // Conjunto seguro: 20 etapas (1x a 20x) com chances uniformes (2.5 cada, soma 100), como pede o spec.
  function etapasSeguras() {
    const lista = [];
    for (let m = 1; m <= 20; m++) {
      lista.push({
        multiplicador: m,
        ganhou: { chance: 2.5, titulo: 'Ganhou em ' + m + 'x', mensagem: 'O tigrinho soltou a carta!' },
        perdeu: { chance: 2.5, titulo: 'Perdeu em ' + m + 'x', mensagem: 'O tigrinho guardou a carta.' },
      });
    }
    return lista;
  }

  // Qualquer quantidade de etapas funciona (o máximo do jogo é a última da lista).
  // Entradas quebradas são ignoradas; lista vazia ou quebrada vira 20 etapas seguras.
  function prepararEtapas(cruas) {
    let lista = [];
    if (Array.isArray(cruas)) {
      cruas.forEach(function (etapa, i) {
        if (ehObjeto(etapa)) lista.push({ etapa: etapa, onde: 'etapas[' + i + ']' });
        else avisar('etapas[' + i + '] não é uma etapa válida (' + JSON.stringify(etapa) + '): ignorada.');
      });
    }
    if (!lista.length) {
      avisar('A lista "etapas" está vazia ou quebrada: usando 20 etapas seguras (1x a 20x).');
      lista = etapasSeguras().map(function (etapa, i) { return { etapa: etapa, onde: 'etapas seguras[' + i + ']' }; });
    }
    return lista.map(function (item, i) {
      const etapa = item.etapa;
      const onde = item.onde;
      const multiplicador = numeroSeguro(etapa.multiplicador, i + 1, 0, onde + '.multiplicador');
      return {
        multiplicador: multiplicador,
        intensidade: idIntensidade(etapa.intensidade, onde), // se vier, sobrescreve a faixa desta etapa
        ganhou: prepararDesfecho(etapa.ganhou, 'ganhou', multiplicador, onde),
        perdeu: prepararDesfecho(etapa.perdeu, 'perdeu', multiplicador, onde),
      };
    });
  }

  function prepararIntensidades(cruas) {
    const lista = Array.isArray(cruas)
      ? cruas.filter(function (f, i) {
        return ehObjeto(f) && idIntensidade(f.id, 'intensidades[' + i + ']') && Number.isFinite(Number(f.aPartirDe));
      })
      : [];
    if (!lista.length) {
      if (cruas !== undefined) avisar('Seção "intensidades" inválida: usando as faixas padrão.');
      return INTENSIDADES_PADRAO.slice();
    }
    return lista
      .map(function (f) { return { id: idIntensidade(f.id, 'intensidades'), aPartirDe: Number(f.aPartirDe) }; })
      .sort(function (a, b) { return a.aPartirDe - b.aPartirDe; });
  }

  function prepararSimbolos(crus) {
    let lista = Array.isArray(crus) ? crus.filter(function (s) { return ehObjeto(s) && ehTexto(s.id); }) : [];
    if (lista.length < 2) {
      avisar('Seção "simbolos" ausente ou quebrada: usando os símbolos padrão.');
      lista = SIMBOLOS_PADRAO;
    }
    lista = lista.map(function (s) {
      if (s.imagem !== undefined && s.imagem !== '' && !ehTexto(s.imagem)) {
        avisar('simbolos "' + s.id + '": imagem deve ser o nome de um asset entre aspas (' + JSON.stringify(s.imagem) + '): usando o desenho provisório.');
      }
      return { id: s.id, nome: ehTexto(s.nome) ? s.nome : s.id, imagem: ehTexto(s.imagem) ? s.imagem.trim() : '', carta: s.carta === true };
    });
    lista.forEach(function (s) {
      if (!s.carta && !s.imagem && !Object.prototype.hasOwnProperty.call(DESENHOS_DOS_SIMBOLOS, s.id)) {
        avisar('Símbolo "' + s.id + '" não tem desenho provisório: a célula mostra o nome dele (dê uma imagem no campo "imagem").');
      }
    });
    const cartas = lista.filter(function (s) { return s.carta; });
    if (cartas.length === 0) {
      avisar('Nenhum símbolo marcado como Carta (carta: true): usando a Carta LA padrão.');
      lista.push({ id: 'carta', nome: 'Carta LA', imagem: '', carta: true });
    } else if (cartas.length > 1) {
      avisar('Mais de um símbolo marcado como Carta: só o primeiro vale.');
      lista.forEach(function (s) { if (s.carta && s !== cartas[0]) s.carta = false; });
    }
    return lista;
  }

  function prepararConfig(cru) {
    let c = cru;
    if (!ehObjeto(c)) {
      avisar('CONFIG ausente ou inválido: usando valores seguros.');
      c = {};
    }
    const t = ehObjeto(c.tempos) ? c.tempos : {};
    if (c.tempos !== undefined && !ehObjeto(c.tempos)) avisar('Seção "tempos" inválida: usando os tempos padrão.');
    const s = ehObjeto(c.som) ? c.som : {};
    if (c.som !== undefined && !ehObjeto(c.som)) avisar('Seção "som" inválida: usando o som padrão.');
    return {
      textos: prepararTextos(c.textos),
      etapas: prepararEtapas(c.etapas),
      intensidades: prepararIntensidades(c.intensidades),
      simbolos: prepararSimbolos(c.simbolos),
      tempos: {
        velocidade: numeroSeguro(t.velocidade, TEMPOS_PADRAO.velocidade, 0.05, 'tempos.velocidade'),
        primeiraEtapaMs: numeroSeguro(t.primeiraEtapaMs, TEMPOS_PADRAO.primeiraEtapaMs, 100, 'tempos.primeiraEtapaMs'),
        etapaMaisCurtaMs: numeroSeguro(t.etapaMaisCurtaMs, TEMPOS_PADRAO.etapaMaisCurtaMs, 100, 'tempos.etapaMaisCurtaMs'),
        suspenseMs: numeroSeguro(t.suspenseMs, TEMPOS_PADRAO.suspenseMs, 0, 'tempos.suspenseMs'),
        pausaAntesDoResultadoMs: numeroSeguro(t.pausaAntesDoResultadoMs, TEMPOS_PADRAO.pausaAntesDoResultadoMs, 0, 'tempos.pausaAntesDoResultadoMs'),
      },
      som: {
        ligado: typeof s.ligado === 'boolean' ? s.ligado : SOM_PADRAO.ligado,
        volume: Math.min(1, numeroSeguro(s.volume, SOM_PADRAO.volume, 0, 'som.volume')),
      },
    };
  }

  /* ---------- 5.3 MOTOR DE SORTEIO ----------
     Não toca no DOM. Recebe a configuração preparada e uma fonte de aleatoriedade
     (função que devolve um número em [0, 1)) e devolve o Resultado inteiro de uma vez:
     { etapa, multiplicador, tipo, titulo, mensagem, chave, velocidade, duracaoMs, roteiro: [etapa 1 … etapa N] }.
     duracaoMs = do toque até o resultado ficar visível (soma das etapas).
     Cada passo do Roteiro: { etapa, multiplicador, intensidade, final, suspense, duracaoMs, paradasMs,
     revelacaoMs, tabuleiro }:
     - duracaoMs: duração da etapa (na última, até o resultado aparecer);
     - paradasMs: [rolo 1, rolo 2, rolo 3] = quando cada rolo para, contado do começo da etapa;
     - revelacaoMs: quando a etapa é anunciada (na parada do último rolo);
     - suspense: true na última etapa (o último rolo gira mais lento, o "quase");
     - tabuleiro[rolo][linha] = id do símbolo (3 rolos × 3 linhas) mostrado quando os rolos param.
     Os tempos já vêm divididos pela velocidade do CONFIG.

     CONTRATO DA ORDEM DOS SORTEIOS (a cópia de verificação depende dele):
     - o 1º número consumido por Motor.sortear decide o Resultado: escolherDesfecho()
       percorre tabelaDeDesfechos() na ordem (etapa 1 ganhou, etapa 1 perdeu, etapa 2 ganhou…)
       e para no primeiro desfecho cuja probabilidade acumulada passa do número;
     - os números seguintes escolhem a mensagem (se for lista: 1 número, entre as variações
       que não são a última exibida daquele resultado) e os tabuleiros do Roteiro.
     Ao mudar o motor, mantenha esse contrato. */
  const Motor = (function () {
    const tabelas = new WeakMap(); // tabela normalizada por configuração (calculada uma vez)

    // Tabela plana: um desfecho para cada (etapa, tipo), com a probabilidade normalizada (0 a 1).
    // As chances são pesos relativos: probabilidade = chance ÷ soma de todas as chances.
    // Peso inválido conta como 0; chance 0 nunca é sorteada; tudo 0 → sorteio uniforme (com aviso).
    function tabelaDeDesfechos(config) {
      if (tabelas.has(config)) return tabelas.get(config);
      const linhas = [];
      config.etapas.forEach(function (etapa, i) {
        ['ganhou', 'perdeu'].forEach(function (tipo) {
          const peso = etapa[tipo].chance;
          linhas.push({ etapa: i + 1, multiplicador: etapa.multiplicador, tipo: tipo,
            peso: typeof peso === 'number' && Number.isFinite(peso) && peso > 0 ? peso : 0 });
        });
      });
      let soma = linhas.reduce(function (total, l) { return total + l.peso; }, 0);
      if (!(soma > 0) || !Number.isFinite(soma)) {
        avisar('Todas as chances estão zeradas ou inválidas: usando sorteio uniforme entre os ' + linhas.length + ' desfechos.');
        linhas.forEach(function (l) { l.peso = 1; });
        soma = linhas.length;
      } else if (Math.abs(soma - 100) > 0.001) {
        console.info('[Tigrinho] As chances somam ' + +soma.toFixed(3) + ' (e não 100): o jogo normaliza, cada chance vale chance ÷ ' + +soma.toFixed(3) + '.');
      }
      linhas.forEach(function (l) { l.probabilidade = l.peso / soma; });
      tabelas.set(config, linhas);
      return linhas;
    }

    function escolherDesfecho(tabela, numero) {
      let acumulado = 0;
      for (let i = 0; i < tabela.length; i++) {
        acumulado += tabela[i].probabilidade;
        if (tabela[i].probabilidade > 0 && numero < acumulado) return tabela[i];
      }
      // Arredondamento de ponto flutuante: fica com o último desfecho possível.
      for (let i = tabela.length - 1; i >= 0; i--) if (tabela[i].probabilidade > 0) return tabela[i];
      return tabela[tabela.length - 1];
    }

    // Última mensagem de cada resultado, por configuração, só em memória (nada persiste entre aberturas).
    // Toda rodada sorteada é encenada até o fim, então a última sorteada é a última exibida.
    const ultimasMensagens = new WeakMap();

    // Lista de variações: sorteia uma entre as que NÃO são a última exibida daquele resultado
    // (a fila nunca vê a mesma piada duas vezes seguidas). Consome 1 número quando há lista.
    function escolherMensagem(config, chave, mensagens, aleatorio) {
      if (mensagens.length === 1) return mensagens[0];
      let ultimas = ultimasMensagens.get(config);
      if (!ultimas) {
        ultimas = {};
        ultimasMensagens.set(config, ultimas);
      }
      let opcoes = mensagens.filter(function (m) { return m !== ultimas[chave]; });
      if (!opcoes.length) opcoes = mensagens; // todas iguais: não há como variar
      const escolhida = opcoes[Math.floor(aleatorio() * opcoes.length) % opcoes.length];
      ultimas[chave] = escolhida;
      return escolhida;
    }

    function intensidadeDe(config, etapa) {
      if (etapa.intensidade) return etapa.intensidade;
      let id = config.intensidades[0].id;
      config.intensidades.forEach(function (faixa) { if (etapa.multiplicador >= faixa.aPartirDe) id = faixa.id; });
      return id;
    }

    function embaralhar(lista, aleatorio) {
      for (let i = lista.length - 1; i > 0; i--) {
        const j = Math.floor(aleatorio() * (i + 1)) % (i + 1);
        const troca = lista[i]; lista[i] = lista[j]; lista[j] = troca;
      }
      return lista;
    }
    function idDaCarta(config) { return config.simbolos.filter(function (s) { return s.carta; })[0].id; }
    function idsComuns(config) { return config.simbolos.filter(function (s) { return !s.carta; }).map(function (s) { return s.id; }); }

    // Tabuleiro cosmético: "cartas" posições sorteadas recebem a Carta LA; as outras, símbolos comuns.
    function montarTabuleiro(config, cartas, aleatorio) {
      const carta = idDaCarta(config);
      const comuns = idsComuns(config);
      const posicoes = embaralhar([0, 1, 2, 3, 4, 5, 6, 7, 8], aleatorio);
      const plano = new Array(9);
      posicoes.forEach(function (pos, ordem) {
        plano[pos] = ordem < cartas ? carta : comuns[Math.floor(aleatorio() * comuns.length) % comuns.length];
      });
      return [plano.slice(0, 3), plano.slice(3, 6), plano.slice(6, 9)];
    }

    // Tabuleiro do "quase" (derrota): os rolos 1 e 2 cheios de Carta e o último com só 1 ou 2 Cartas.
    // Quase completa, mas nunca enche o tabuleiro.
    function montarTabuleiroQuase(config, aleatorio) {
      const carta = idDaCarta(config);
      const comuns = idsComuns(config);
      const noUltimo = aleatorio() < 0.5 ? 1 : 2;
      const linhas = embaralhar([0, 1, 2], aleatorio);
      const ultimo = [0, 0, 0];
      linhas.forEach(function (linha, ordem) {
        ultimo[linha] = ordem < noUltimo ? carta : comuns[Math.floor(aleatorio() * comuns.length) % comuns.length];
      });
      return [[carta, carta, carta], [carta, carta, carta], ultimo];
    }

    // Cartas das etapas intermediárias: aumentam aos poucos com o avanço da rodada (de 1 até 6), nunca
    // diminuem e nunca completam o tabuleiro. A última etapa: vitória = 9 Cartas; derrota = o "quase"
    // (7 ou 8 Cartas, sempre mais que as etapas anteriores).
    const CARTAS_ATE = 6;
    function cartasIntermediarias(total, aleatorio) {
      const lista = [];
      let anterior = 1;
      for (let i = 1; i < total; i++) {
        const base = 1 + Math.floor((CARTAS_ATE - 1) * (i - 1) / Math.max(1, total - 1));
        const extra = aleatorio() < 0.35 ? 1 : 0;
        anterior = Math.max(anterior, Math.min(CARTAS_ATE, base + extra));
        lista.push(anterior);
      }
      return lista;
    }

    // Ritmo (com velocidade 1; no Roteiro tudo é dividido pela velocidade):
    // - etapa intermediária i: dura primeiraEtapaMs × 0,88^(i−1), até o mínimo etapaMaisCurtaMs. Numa etapa
    //   de duração d, os rolos param em 50%, 64% e 78% de d (esquerda → direita) e a etapa é revelada na
    //   parada do último; o resto de d é o tabuleiro parado antes do próximo giro;
    // - etapa do desfecho (a última): giro mais longo (rolos 1 e 2 param em 1,25× e 1,5625× primeiraEtapaMs)
    //   e o último rolo leva suspenseMs a mais (o "quase"); a etapa é revelada nessa parada e o resultado
    //   aparece pausaAntesDoResultadoMs depois.
    const ENCURTAMENTO = 0.88;
    const PARADAS = [0.5, 0.64, 0.78];
    const PARADAS_DO_DESFECHO = [1.25, 1.5625];
    function ritmoDaEtapa(tempos, i, final) {
      const v = tempos.velocidade;
      const em = function (ms) { return ms / v; };
      if (!final) {
        const minimo = Math.min(tempos.etapaMaisCurtaMs, tempos.primeiraEtapaMs);
        const d = Math.max(minimo, tempos.primeiraEtapaMs * Math.pow(ENCURTAMENTO, i - 1));
        const paradas = PARADAS.map(function (f) { return em(f * d); });
        return { duracaoMs: em(d), paradasMs: paradas, revelacaoMs: paradas[2], suspense: false };
      }
      const p1 = PARADAS_DO_DESFECHO[0] * tempos.primeiraEtapaMs;
      const p2 = PARADAS_DO_DESFECHO[1] * tempos.primeiraEtapaMs;
      const p3 = p2 + Math.max(tempos.suspenseMs, 0.14 * tempos.primeiraEtapaMs);
      return { duracaoMs: em(p3 + tempos.pausaAntesDoResultadoMs), paradasMs: [em(p1), em(p2), em(p3)], revelacaoMs: em(p3), suspense: true };
    }

    // Roteiro das etapas 1…N, com o ritmo e o tabuleiro de cada parada (coerente com o Resultado):
    // as intermediárias mostram cada vez mais Cartas sem completar; a última mostra as 9 Cartas na
    // vitória e o "quase" na derrota. Um tabuleiro de derrota nunca fica cheio de Cartas.
    function montarRoteiro(config, desfecho, aleatorio) {
      const passos = [];
      const cartas = cartasIntermediarias(desfecho.etapa, aleatorio);
      for (let i = 1; i <= desfecho.etapa; i++) {
        const etapa = config.etapas[i - 1];
        const final = i === desfecho.etapa;
        const ritmo = ritmoDaEtapa(config.tempos, i, final);
        let tabuleiro;
        if (!final) tabuleiro = montarTabuleiro(config, cartas[i - 1], aleatorio);
        else if (desfecho.tipo === 'ganhou') tabuleiro = montarTabuleiro(config, 9, aleatorio);
        else tabuleiro = montarTabuleiroQuase(config, aleatorio);
        passos.push({
          etapa: i,
          multiplicador: etapa.multiplicador,
          intensidade: intensidadeDe(config, etapa),
          final: final,
          suspense: ritmo.suspense,
          duracaoMs: ritmo.duracaoMs,
          paradasMs: ritmo.paradasMs,
          revelacaoMs: ritmo.revelacaoMs,
          tabuleiro: tabuleiro,
        });
      }
      return passos;
    }

    function sortear(config, aleatorio) {
      const desfecho = escolherDesfecho(tabelaDeDesfechos(config), aleatorio()); // 1º número
      const bloco = config.etapas[desfecho.etapa - 1][desfecho.tipo];
      const chave = desfecho.tipo + '-' + desfecho.etapa;
      const mensagem = escolherMensagem(config, chave, bloco.mensagens, aleatorio);
      const roteiro = montarRoteiro(config, desfecho, aleatorio);
      return {
        etapa: desfecho.etapa,
        multiplicador: desfecho.multiplicador,
        tipo: desfecho.tipo,
        titulo: bloco.titulo,
        mensagem: mensagem,
        chave: chave,
        velocidade: config.tempos.velocidade,
        duracaoMs: roteiro.reduce(function (total, passo) { return total + passo.duracaoMs; }, 0),
        roteiro: roteiro,
      };
    }

    return { sortear: sortear, tabelaDeDesfechos: tabelaDeDesfechos };
  })();

  /* ---------- 5.4 FONTE DE ALEATORIEDADE ----------
     Sempre crypto.getRandomValues; Math.random só como reserva se a API não existir. */
  function aleatorioSeguro() {
    const cripto = typeof crypto !== 'undefined' ? crypto : null;
    if (cripto && typeof cripto.getRandomValues === 'function') {
      const numeros = new Uint32Array(1);
      cripto.getRandomValues(numeros);
      return numeros[0] / 4294967296;
    }
    return Math.random();
  }

  /* ---------- 5.5 ESTADO DO APP ---------- */
  const app = {
    config: null,             // configuração preparada (5.2)
    fonte: aleatorioSeguro,   // fonte de aleatoriedade do sorteio (lida na hora do toque)
    estado: 'INICIO',         // INICIO → GIRANDO → RESULTADO → INICIO
    rodada: 0,                // muda a cada rodada/reinício; encenações antigas param sozinhas
    resultado: null,
    agendados: [],
  };

  /* ---------- 5.6 TELA (desenha; não sorteia nada) ---------- */
  const Tela = (function () {
    let el = null;

    function pegarElementos() {
      const $ = function (id) { return document.getElementById(id); };
      el = {
        app: $('app'), titulo: $('titulo'), jogo: $('jogo'), etapa: $('etapa'), multiplicador: $('multiplicador'),
        tabuleiro: $('tabuleiro'), celulas: [], botaoGirar: $('botao-girar'), aviso: $('aviso-brincadeira'),
        cartao: $('cartao-inicio'), frase: $('frase-inicial'), botaoComecar: $('botao-comecar'),
        painel: $('painel-resultado'), resultadoTipo: $('resultado-tipo'), resultadoMultiplicador: $('resultado-multiplicador'),
        resultadoTitulo: $('resultado-titulo'), resultadoMensagem: $('resultado-mensagem'), botaoJogarDeNovo: $('botao-jogar-de-novo'),
        topo: $('topo'), logo: $('logo'), anunciador: $('anunciador'), rotuloGanho: $('rotulo-ganho'), valorGanho: $('valor-ganho'),
        placar: $('placar'), botaoMudo: $('botao-mudo'), rotuloGirar: $('rotulo-girar'),
        textoGirar: $('texto-girar'), avisoGirarBrincadeira: $('aviso-girar-brincadeira'),
        selo: $('selo-multiplicador'), anuncio: null,
        desenhos: [], nomes: [],
      };
      // As 9 células são criadas uma única vez e reaproveitadas em todas as rodadas. Cada uma tem um SVG
      // com dois <use> do sprite: a moldura dourada comum e o desenho do símbolo (ver 5.6.2).
      el.tabuleiro.textContent = '';
      for (let rolo = 0; rolo < 3; rolo++) {
        for (let linha = 0; linha < 3; linha++) {
          const celula = document.createElement('div');
          celula.className = 'celula';
          celula.dataset.rolo = rolo;
          celula.dataset.linha = linha;
          celula.setAttribute('role', 'img');
          celula.style.setProperty('--i', rolo + linha); // atraso da animação da tela inicial (onda na diagonal)
          const svg = document.createElementNS(SVG_NS, 'svg');
          svg.setAttribute('class', 'simbolo');
          svg.setAttribute('viewBox', '0 0 100 100');
          svg.setAttribute('aria-hidden', 'true');
          svg.setAttribute('focusable', 'false');
          const moldura = document.createElementNS(SVG_NS, 'use');
          moldura.setAttribute('class', 'simbolo-moldura');
          apontarPara(moldura, '#sb-moldura');
          const desenho = document.createElementNS(SVG_NS, 'use');
          desenho.setAttribute('class', 'simbolo-desenho');
          svg.appendChild(moldura);
          svg.appendChild(desenho);
          const nome = document.createElement('span');
          nome.className = 'simbolo-nome';
          nome.hidden = true;
          celula.appendChild(svg);
          celula.appendChild(nome);
          el.tabuleiro.appendChild(celula);
          el.celulas.push(celula);
          el.desenhos.push(desenho);
          el.nomes.push(nome);
        }
      }
      return el;
    }

    // Todos os textos fixos da tela vêm de CONFIG.textos (já preparados em 5.2).
    function aplicarTextos(textos) {
      el.titulo.textContent = textos.titulo;
      el.logo.alt = textos.titulo;
      el.frase.textContent = textos.fraseInicial;
      el.botaoComecar.textContent = textos.botaoTentarASorte;
      el.botaoJogarDeNovo.textContent = textos.botaoJogarDeNovo;
      el.aviso.textContent = textos.avisoBrincadeira;
      el.textoGirar.textContent = textos.avisoGirar;
      el.avisoGirarBrincadeira.textContent = textos.avisoBrincadeira; // o aviso fica visível também com o celular deitado
      el.rotuloGanho.textContent = textos.rotuloGanho;
      // Pílulas do placar decorativo, antes do botão de som (mudo).
      Array.prototype.slice.call(el.placar.querySelectorAll('.pilula')).forEach(function (p) { el.placar.removeChild(p); });
      textos.placar.forEach(function (texto) {
        const pilula = document.createElement('span');
        pilula.className = 'pilula';
        pilula.textContent = texto;
        el.placar.insertBefore(pilula, el.botaoMudo);
      });
    }

    // Anunciador: o texto fica num <span class="anuncio"> (o Diretor de Animação o faz "pular" sem mexer
    // no painel). partes = [[texto, classe], …] para colorir pedaços (ex.: "ROUND 3" · "3x").
    function anunciar(texto, tom, partes) {
      el.anunciador.textContent = '';
      const anuncio = document.createElement('span');
      anuncio.className = 'anuncio';
      if (partes) {
        partes.forEach(function (p) {
          const pedaco = document.createElement('span');
          pedaco.className = p[1];
          pedaco.textContent = p[0];
          anuncio.appendChild(pedaco);
        });
      } else {
        anuncio.textContent = texto;
      }
      el.anunciador.appendChild(anuncio);
      el.anunciador.dataset.tom = tom;
      el.anuncio = anuncio;
    }

    // Cada célula mostra o desenho do símbolo (5.6.2). Só um símbolo novo do CONFIG, sem desenho nem
    // imagem, mostra o nome por escrito. O nome também vai para os leitores de tela (aria-label).
    let ultimoDesenhado = null;
    function simbolosPorId(config) {
      const porId = {};
      config.simbolos.forEach(function (s) { porId[s.id] = s; });
      return porId;
    }
    function desenharCelula(i, simbolo) {
      const celula = el.celulas[i];
      const desenho = Simbolos.desenhoDe(simbolo);
      apontarPara(el.desenhos[i], desenho);
      el.nomes[i].textContent = desenho ? '' : simbolo.nome;
      el.nomes[i].hidden = !!desenho;
      celula.setAttribute('aria-label', simbolo.nome);
      celula.dataset.simbolo = simbolo.id;
      celula.classList.toggle('carta', simbolo.carta);
    }
    function desenharTabuleiro(tabuleiro, config) {
      ultimoDesenhado = { tabuleiro: tabuleiro.map(function (c) { return c.slice(); }), config: config };
      const porId = simbolosPorId(config);
      for (let rolo = 0; rolo < 3; rolo++) {
        for (let linha = 0; linha < 3; linha++) desenharCelula(rolo * 3 + linha, porId[tabuleiro[rolo][linha]]);
      }
    }
    // Um rolo parou: as 3 células dele passam a ter os símbolos em que ele parou.
    function desenharColuna(rolo, coluna, config) {
      const porId = simbolosPorId(config);
      if (!ultimoDesenhado || ultimoDesenhado.config !== config) desenharTabuleiro(tabuleiroInicial(config), config);
      ultimoDesenhado.tabuleiro[rolo] = coluna.slice();
      for (let linha = 0; linha < 3; linha++) desenharCelula(rolo * 3 + linha, porId[coluna[linha]]);
    }
    // O tabuleiro que está nas células agora (3 rolos × 3 linhas de ids).
    function tabuleiroAtual(config) {
      if (!ultimoDesenhado || ultimoDesenhado.config !== config) return tabuleiroInicial(config);
      return ultimoDesenhado.tabuleiro.map(function (c) { return c.slice(); });
    }

    // Uma imagem de símbolo ficou pronta depois de o tabuleiro já estar na tela: redesenha o mesmo tabuleiro.
    function redesenharSimbolos() {
      if (ultimoDesenhado) desenharTabuleiro(ultimoDesenhado.tabuleiro, ultimoDesenhado.config);
    }

    // Tabuleiro fixo da tela inicial: os símbolos na ordem do CONFIG (sempre igual).
    function tabuleiroInicial(config) {
      const ids = config.simbolos.map(function (s) { return s.id; });
      const tabuleiro = [];
      for (let rolo = 0; rolo < 3; rolo++) {
        tabuleiro.push([0, 1, 2].map(function (linha) { return ids[(rolo * 3 + linha) % ids.length]; }));
      }
      return tabuleiro;
    }

    function telaInicial(config) {
      el.etapa.textContent = '';
      el.multiplicador.textContent = '—';
      delete el.jogo.dataset.etapa;
      delete el.jogo.dataset.intensidade;
      delete el.jogo.dataset.fase;
      anunciar(config.textos.titulo, 'titulo');
      el.valorGanho.textContent = '—';
      desenharTabuleiro(tabuleiroInicial(config), config);
      el.resultadoTipo.textContent = '';
      el.resultadoMultiplicador.textContent = '';
      el.resultadoTitulo.textContent = '';
      el.resultadoMensagem.textContent = '';
      delete el.painel.dataset.tipo;
      delete el.painel.dataset.etapa;
    }

    // A etapa é revelada (quando o último rolo dela para): multiplicador, "Etapa N" (leitores de tela),
    // atributos do #jogo e o anunciador "ROUND N · Nx".
    function revelarEtapa(passo, config) {
      el.etapa.textContent = config.textos.rotuloEtapa + ' ' + passo.etapa;
      el.multiplicador.textContent = formatarMultiplicador(passo.multiplicador);
      el.jogo.dataset.etapa = passo.etapa;
      el.jogo.dataset.intensidade = passo.intensidade;
      const round = config.textos.rotuloRound + ' ' + passo.etapa;
      const mult = formatarMultiplicador(passo.multiplicador);
      anunciar(round + ' · ' + mult, 'round', [[round, 'anuncio-round'], [' · ', 'anuncio-ponto'], [mult, 'anuncio-mult']]);
    }
    // Fase da etapa em curso, para os efeitos (ISSUE-009): giro, suspense, revelacao, desfecho.
    function marcarFase(fase) {
      if (fase) el.jogo.dataset.fase = fase;
      else delete el.jogo.dataset.fase;
    }
    // Encenação sem os rolos (reserva, se o GSAP faltar): o tabuleiro inteiro troca de uma vez.
    function mostrarPasso(passo, config) {
      desenharTabuleiro(passo.tabuleiro, config);
      revelarEtapa(passo, config);
    }
    // Peças que o Diretor de Animação anima (só transform e opacity).
    function pecasDaRevelacao() {
      return {
        multiplicador: el.multiplicador,
        anel: el.selo.querySelector('.anel'),
        faiscas: Array.prototype.slice.call(el.selo.querySelectorAll('.estouro i')),
        anuncio: el.anuncio,
      };
    }

    function mostrarResultado(resultado, config) {
      el.painel.dataset.tipo = resultado.tipo;
      el.painel.dataset.etapa = resultado.etapa;
      el.resultadoTipo.textContent = resultado.tipo === 'ganhou' ? config.textos.tipoGanhou : config.textos.tipoPerdeu;
      el.resultadoMultiplicador.textContent = formatarMultiplicador(resultado.multiplicador);
      el.resultadoTitulo.textContent = resultado.titulo;
      el.resultadoMensagem.textContent = resultado.mensagem;
      // Barra "Ganho" (valor final; a contagem animada é da revelação, 5.7.2) e anunciador: "K.O." na derrota; palavra de vitória máxima
      // quando ganha na última etapa; nas outras vitórias o "ROUND N" continua.
      el.valorGanho.textContent = formatarMultiplicador(resultado.tipo === 'ganhou' ? resultado.multiplicador : 0);
      if (resultado.tipo === 'perdeu') anunciar(config.textos.palavraDerrota, 'ko');
      else if (resultado.etapa === config.etapas.length) anunciar(config.textos.palavraVitoriaMaxima, 'maxima');
    }

    function mostrarEstado(estado, textos) {
      el.app.dataset.estado = estado;
      el.cartao.hidden = estado !== 'INICIO';
      el.botaoComecar.disabled = estado !== 'INICIO';
      el.botaoGirar.hidden = estado === 'RESULTADO';
      el.botaoGirar.disabled = estado !== 'INICIO';
      el.rotuloGirar.textContent = estado === 'GIRANDO' ? textos.botaoGirando : textos.botaoGirar;
      el.painel.hidden = estado !== 'RESULTADO';
      el.botaoJogarDeNovo.disabled = estado !== 'RESULTADO';
      el.jogo.setAttribute('aria-busy', estado === 'GIRANDO' ? 'true' : 'false');
    }

    return {
      pegarElementos: pegarElementos, aplicarTextos: aplicarTextos, telaInicial: telaInicial,
      mostrarPasso: mostrarPasso, revelarEtapa: revelarEtapa, marcarFase: marcarFase, desenharColuna: desenharColuna,
      tabuleiroAtual: tabuleiroAtual, pecasDaRevelacao: pecasDaRevelacao,
      mostrarResultado: mostrarResultado, mostrarEstado: mostrarEstado, redesenharSimbolos: redesenharSimbolos,
    };
  })();

  /* ---------- 5.6.1 FONTES E LOGO (lidas do bloco ASSETS, sem nenhuma requisição de rede) ----------
     As fontes ficam em base64 no bloco ASSETS (fim do arquivo) e são registradas com a API FontFace
     a partir dos próprios bytes, não de um endereço. Se uma fonte ou a Logo faltar ou estiver
     corrompida, o jogo usa a fonte do sistema / mostra o título, e o problema vai só para o console.
     Licenças das fontes (todas SIL Open Font License 1.1, OFL-1.1, que permite embutir e redistribuir):
     - Lilita One: Copyright (c) 2011 Juan Montoreano, Reserved Font Name "Lilita One".
     - Press Start 2P: Copyright 2012 The Press Start 2P Project Authors, Reserved Font Name "Press Start 2P".
     - Poppins: Copyright 2020 The Poppins Project Authors.
     Subconjunto latino (letras com acento do português, dígitos, pontuação, "x", "·", "!" e "…").
     O "∞" não existe nessas fontes: só ele é desenhado pela fonte do sistema. */
  const FONTES_EMBUTIDAS = [
    { asset: 'fonte-lilita-one', familia: 'Lilita One', peso: '400' },        // display: números, multiplicadores, "Ganho", títulos
    { asset: 'fonte-press-start-2p', familia: 'Press Start 2P', peso: '400' }, // pixel: "ROUND N", "K.O." e anunciador
    { asset: 'fonte-poppins-400', familia: 'Poppins', peso: '400' },          // textos corridos e mensagens
    { asset: 'fonte-poppins-600', familia: 'Poppins', peso: '600' },          // frase inicial, placar e nome de símbolo sem desenho
  ];

  const Recursos = (function () {
    function assetEmbutido(nome, prefixo) {
      const assets = window.ASSETS;
      const uri = assets && typeof assets === 'object' ? assets[nome] : undefined;
      return typeof uri === 'string' && uri.indexOf(prefixo) === 0 && uri.indexOf(';base64,') > 0 ? uri : null;
    }

    function bytesDoBase64(uri) {
      const binario = atob(uri.slice(uri.indexOf(',') + 1));
      const bytes = new Uint8Array(binario.length);
      for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
      return bytes.buffer;
    }

    function carregarFontes() {
      if (typeof FontFace !== 'function' || !document.fonts || typeof document.fonts.add !== 'function') {
        avisar('Este navegador não aceita fontes embutidas: usando as fontes do sistema.');
        return Promise.resolve([]);
      }
      return Promise.all(FONTES_EMBUTIDAS.map(function (f) {
        const uri = assetEmbutido(f.asset, 'data:font/');
        if (!uri) {
          avisar('Fonte "' + f.asset + '" ausente no bloco ASSETS: usando a fonte do sistema.');
          return null;
        }
        let face;
        try {
          face = new FontFace(f.familia, bytesDoBase64(uri), { weight: f.peso, style: 'normal', display: 'swap' });
          document.fonts.add(face);
        } catch (erro) {
          avisar('Fonte "' + f.asset + '" inválida (' + (erro && erro.message) + '): usando a fonte do sistema.');
          return null;
        }
        return face.load().then(function () { return face; }, function (erro) {
          document.fonts.delete(face);
          avisar('Fonte "' + f.asset + '" corrompida (' + (erro && erro.message) + '): usando a fonte do sistema.');
          return null;
        });
      }));
    }

    function carregarLogo(el) {
      const uri = assetEmbutido('logo', 'data:image/');
      function semLogo(motivo) {
        avisar('Logo ' + motivo + ': mostrando o título no lugar dela.');
        el.topo.classList.add('sem-logo');
      }
      if (!uri) {
        semLogo('ausente no bloco ASSETS');
        return Promise.resolve();
      }
      el.logo.addEventListener('error', function () { semLogo('corrompida'); }, { once: true });
      el.logo.src = uri;
      // Decodifica já na abertura: a imagem está pronta antes do primeiro giro.
      return typeof el.logo.decode === 'function' ? el.logo.decode().catch(function () {}) : Promise.resolve();
    }

    function instalar(el) {
      return Promise.all([carregarFontes(), carregarLogo(el)]);
    }

    return { instalar: instalar, assetEmbutido: assetEmbutido };
  })();

  /* ---------- 5.6.2 SÍMBOLOS (desenhos do sprite SVG e troca por imagem real) ----------
     Cada símbolo é um <symbol> do sprite (seção 3, #sprite-simbolos), mostrado nas células com <use>.
     Troca por imagem: se o CONFIG der, no campo "imagem" do símbolo, o nome de um asset do bloco ASSETS,
     a imagem é conferida (carregada e decodificada) e passa a ser usada no lugar do desenho provisório:
     - nos 7 ícones e no HUNCH, dentro da mesma moldura dourada;
     - na Carta, ocupando a carta inteira.
     Nome que não existe no ASSETS ou imagem corrompida: o desenho provisório continua e o aviso vai só
     para o console. */
  const Simbolos = (function () {
    const comImagem = {}; // símbolo (id|imagem|carta) → id do <symbol> criado com a imagem conferida
    let criados = 0;

    function chave(simbolo) {
      return simbolo.id + '|' + simbolo.imagem + '|' + (simbolo.carta ? 'carta' : '');
    }

    // Referência do desenho do símbolo ('#sb-…'): a imagem (se já conferida), o desenho do id ou, para a
    // Carta, a Carta LA. Símbolo novo sem desenho nem imagem → '' (a célula mostra o nome).
    function desenhoDe(simbolo) {
      const imagem = simbolo.imagem ? comImagem[chave(simbolo)] : '';
      if (imagem) return '#' + imagem;
      if (Object.prototype.hasOwnProperty.call(DESENHOS_DOS_SIMBOLOS, simbolo.id)) return '#' + DESENHOS_DOS_SIMBOLOS[simbolo.id];
      return simbolo.carta ? '#' + DESENHOS_DOS_SIMBOLOS.carta : '';
    }

    // Carrega e decodifica a imagem: rejeita se ela estiver corrompida ou vazia.
    function conferirImagem(uri) {
      const img = new Image();
      const carregou = new Promise(function (aceitar, recusar) {
        img.onload = aceitar;
        img.onerror = function () { recusar(new Error('não abriu')); };
      });
      img.src = uri;
      return carregou.then(function () {
        if (!(img.naturalWidth > 0 && img.naturalHeight > 0)) throw new Error('imagem vazia');
        return typeof img.decode === 'function' ? img.decode() : null;
      });
    }

    // Cria no sprite um <symbol> 100×100 com a imagem (sem distorcer: preserveAspectRatio "meet").
    function criarSimboloComImagem(simbolo, uri) {
      const id = 'sb-imagem-' + (++criados);
      const margem = simbolo.carta ? 0 : 12; // a Carta ocupa a célula inteira; os outros, a janela da moldura
      const symbol = document.createElementNS(SVG_NS, 'symbol');
      symbol.setAttribute('id', id);
      symbol.setAttribute('viewBox', '0 0 100 100');
      const image = document.createElementNS(SVG_NS, 'image');
      image.setAttribute('x', margem);
      image.setAttribute('y', margem);
      image.setAttribute('width', 100 - 2 * margem);
      image.setAttribute('height', 100 - 2 * margem);
      image.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      apontarPara(image, uri);
      symbol.appendChild(image);
      document.getElementById('sprite-simbolos').appendChild(symbol);
      return id;
    }

    // Confere as imagens dos símbolos do CONFIG. aoTrocar() é chamado a cada imagem que fica pronta,
    // para o tabuleiro na tela trocar o desenho pela imagem.
    function carregarImagens(config, aoTrocar) {
      return Promise.all(config.simbolos.filter(function (s) { return s.imagem; }).map(function (simbolo) {
        const onde = 'Imagem "' + simbolo.imagem + '" do símbolo "' + simbolo.id + '"';
        const uri = Recursos.assetEmbutido(simbolo.imagem, 'data:image/');
        if (!uri) {
          avisar(onde + ' não existe no bloco ASSETS: usando o desenho provisório.');
          return null;
        }
        return conferirImagem(uri).then(function () {
          comImagem[chave(simbolo)] = criarSimboloComImagem(simbolo, uri);
          aoTrocar();
        }, function (erro) {
          avisar(onde + ' está corrompida (' + (erro && erro.message) + '): usando o desenho provisório.');
        });
      }));
    }

    return { desenhoDe: desenhoDe, carregarImagens: carregarImagens };
  })();

  /* ---------- 5.7 DIRETOR DE ANIMAÇÃO (rolos com GSAP, etapa por etapa) ----------
     Só lê o Roteiro já sorteado (tempos e tabuleiros de cada etapa); nunca decide o desfecho.
     Uma linha do tempo GSAP por rodada, com uma etapa depois da outra, sem novos toques:
       1. os rolos giram (translateY das fitas de símbolos, com "puxada", aceleração e blur de movimento);
       2. param um de cada vez, da esquerda para a direita, com um tranco (passa um pouco e volta);
          na última etapa o último rolo desacelera até quase parar e se arrasta (o "quase");
       3. a etapa é revelada: o selo do multiplicador explode e o anunciador mostra "ROUND N · Nx".
     Só transform e opacity são animados. O GSAP pausa sozinho com a aba oculta (requestAnimationFrame).
     Os símbolos que passam pelos rolos entre uma parada e outra são só enfeite (sorteio cosmético).
     Sem o GSAP (biblioteca ausente), a rodada continua com a troca simples de tabuleiros (reserva). */
  function agendar(funcao, ms) {
    app.agendados.push(setTimeout(funcao, ms));
  }
  function cancelarAgendados() {
    app.agendados.forEach(clearTimeout);
    app.agendados = [];
  }

  const Diretor = (function () {
    const GIRO = 14;        // símbolos por segundo de um rolo girando rápido (com velocidade 1)
    const ARRASTO = 2.6;    // símbolos por segundo do último rolo se arrastando no "quase"
    const PUXADA = 0.16;    // antes de girar, o rolo sobe um pouco (em símbolos)
    const FOLGA = 5;        // itens da fita além da distância percorrida (1 acima, 3 do tabuleiro anterior, 1 abaixo)
    const CHANCE_CARTA_PASSANDO = 0.1; // Cartas que passam borradas no meio do giro (só enfeite)
    let tabuleiroEl = null;
    let rolos = [];         // [{ janela, nitida, borrada, itens: [{ nitido, borrado }] }]
    let tamanhoFita = 0;
    let linha = null;       // linha do tempo GSAP da rodada em curso
    let config = null;
    let velocidade = 1;
    let tipoAtual = '';     // ganhou/perdeu da rodada em curso (para os efeitos da última etapa)

    function gsapPronto() {
      return typeof window.gsap === 'object' && window.gsap !== null && typeof window.gsap.timeline === 'function';
    }
    function disponivel() { return !!tabuleiroEl && gsapPronto(); }

    function aleatorioCosmetico() { return aleatorioSeguro(); }

    // Um item da fita: o mesmo desenho das células (moldura + símbolo do sprite). Na fita borrada, o desenho
    // passa pelo filtro fixo de desfoque vertical (#sf-borrao).
    function criarItem(borrado) {
      const item = document.createElement('div');
      item.className = 'item';
      const svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('class', 'simbolo');
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.setAttribute('aria-hidden', 'true');
      svg.setAttribute('focusable', 'false');
      let dentro = svg;
      if (borrado) {
        dentro = document.createElementNS(SVG_NS, 'g');
        dentro.setAttribute('filter', 'url(#sf-borrao)');
        svg.appendChild(dentro);
      }
      const moldura = document.createElementNS(SVG_NS, 'use');
      moldura.setAttribute('class', 'simbolo-moldura');
      apontarPara(moldura, '#sb-moldura');
      const desenho = document.createElementNS(SVG_NS, 'use');
      desenho.setAttribute('class', 'simbolo-desenho');
      dentro.appendChild(moldura);
      dentro.appendChild(desenho);
      item.appendChild(svg);
      let nome = null;
      if (!borrado) {
        nome = document.createElement('span');
        nome.className = 'item-nome';
        nome.hidden = true;
        item.appendChild(nome);
      }
      return { item: item, desenho: desenho, nome: nome, pintado: '' };
    }

    function crescerFitas(tamanho) {
      rolos.forEach(function (rolo) {
        while (rolo.itens.length < tamanho) {
          const nitido = criarItem(false);
          const borrado = criarItem(true);
          rolo.nitida.appendChild(nitido.item);
          rolo.borrada.appendChild(borrado.item);
          rolo.itens.push({ nitido: nitido, borrado: borrado });
        }
      });
      tamanhoFita = Math.max(tamanhoFita, tamanho);
    }

    // Monta a camada dos rolos uma vez só, dentro do #tabuleiro, por cima das células.
    function preparar(tabuleiro) {
      tabuleiroEl = tabuleiro;
      const camada = document.createElement('div');
      camada.className = 'rolos';
      camada.setAttribute('aria-hidden', 'true');
      rolos = [];
      for (let r = 0; r < 3; r++) {
        const janela = document.createElement('div');
        janela.className = 'rolo';
        janela.dataset.rolo = r;
        const nitida = document.createElement('div');
        nitida.className = 'fita fita-nitida';
        const borrada = document.createElement('div');
        borrada.className = 'fita fita-borrada';
        janela.appendChild(nitida);
        janela.appendChild(borrada);
        camada.appendChild(janela);
        rolos.push({ janela: janela, nitida: nitida, borrada: borrada, itens: [] });
      }
      tabuleiro.appendChild(camada);
      crescerFitas(40);
    }

    function pintarItem(it, simbolo) {
      const desenho = Simbolos.desenhoDe(simbolo);
      const chave = simbolo.id + '|' + desenho + '|' + (simbolo.carta ? 1 : 0);
      if (it.pintado === chave) return; // nada mudou: o navegador não precisa redesenhar
      it.pintado = chave;
      apontarPara(it.desenho, desenho);
      it.item.classList.toggle('carta', simbolo.carta);
      if (it.nome) {
        it.nome.textContent = desenho ? '' : simbolo.nome;
        it.nome.hidden = !!desenho;
      }
    }

    // Desaceleração com velocidade caindo em linha reta de v1 até v2 (curva de GSAP feita à mão).
    function freioLinear(v1, v2) {
      return function (t) { return (2 * v1 * t + (v2 - v1) * t * t) / (v1 + v2); };
    }

    // Movimento de um rolo numa etapa (tempos em segundos, distâncias em símbolos; para baixo > 0):
    // puxada → aceleração → giro rápido → parada com tranco. No suspense, depois do giro rápido o rolo
    // desacelera, se arrasta devagar e só então para. A distância total vira um número inteiro de
    // símbolos (as velocidades são ajustadas em poucos %), para o rolo parar certinho na linha.
    // opcoes (5.7.3, pela intensidade da etapa): giro = fator do giro rápido ("quente" em diante gira mais
    // rápido); lenta = câmera lenta na parada ("lendário" em diante): o último rolo freia mais longo e suave
    // e, no "quase", se arrasta mais devagar. Os instantes das paradas (do Roteiro) não mudam.
    function planejarRolo(parada, inicioSuspense, opcoes) {
      const op = opcoes || {};
      const v = GIRO * velocidade * (op.giro || 1);
      const vArrasto = ARRASTO * velocidade * (op.lenta ? 0.6 : 1);
      const puxada = Math.min(0.12 * parada, 0.09 / velocidade);
      const acelera = Math.min(0.22 * parada, 0.18 / velocidade);
      const corpo = [{ fase: 'acelera', dur: acelera, dist: v * acelera / 3, ease: 'power2.in' }];
      if (inicioSuspense === null) {
        const lenta = op.lenta && op.ultimo;
        const freio = lenta ? Math.min(0.5 * parada, 0.6 / velocidade) : Math.min(0.4 * parada, 0.36 / velocidade);
        const giro = Math.max(0, parada - puxada - acelera - freio);
        corpo.push({ fase: 'giro', dur: giro, dist: v * giro, ease: 'none' });
        // back.out(s) sai com velocidade (s + 3) × distância/duração: a distância casa com o giro, sem tranco.
        if (lenta) corpo.push({ fase: 'parada', dur: freio, dist: v * freio / 4.15, ease: 'back.out(1.15)' });
        else corpo.push({ fase: 'parada', dur: freio, dist: v * freio / 4.6, ease: 'back.out(1.6)' });
      } else {
        const suspense = parada - inicioSuspense;
        const giro = Math.max(0, inicioSuspense - puxada - acelera);
        const desacelera = 0.35 * suspense;
        const arrasto = 0.3 * suspense;
        const freio = suspense - desacelera - arrasto;
        corpo.push({ fase: 'giro', dur: giro, dist: v * giro, ease: 'none' });
        corpo.push({ fase: 'desacelera', dur: desacelera, dist: (v + vArrasto) / 2 * desacelera, ease: freioLinear(v, vArrasto) });
        corpo.push({ fase: 'arrasto', dur: arrasto, dist: vArrasto * arrasto, ease: 'none' });
        corpo.push({ fase: 'parada', dur: freio, dist: vArrasto * freio / 4.3, ease: 'back.out(1.3)' });
      }
      const total = corpo.reduce(function (s, c) { return s + c.dist; }, 0);
      const distancia = Math.max(4, Math.round(total - PUXADA));
      const ajuste = total > 0 ? (distancia + PUXADA) / total : 1;
      corpo.forEach(function (c) { c.dist *= ajuste; });
      return { distancia: distancia, segmentos: [{ fase: 'puxada', dur: puxada, dist: -PUXADA, ease: 'power1.out' }].concat(corpo) };
    }

    function porcento(y) { return 100 * y / tamanhoFita; }

    // Escreve as fitas da etapa (no mesmo quadro em que ela começa, sem mudar o que está na tela):
    // índice 0 = símbolo logo acima do alvo; 1…3 = onde o rolo vai parar; 4…D = símbolos de passagem;
    // D+1…D+3 = o que está na tela agora (tabuleiro anterior); D+4 = logo abaixo. A fita começa mostrando
    // D+1…D+3 e desce D símbolos até mostrar 1…3.
    function prepararEtapa(passo, anterior, planos) {
      const porId = {};
      config.simbolos.forEach(function (s) { porId[s.id] = s; });
      const carta = config.simbolos.filter(function (s) { return s.carta; })[0];
      const comuns = config.simbolos.filter(function (s) { return !s.carta; });
      function comum(evitar) {
        let s = comuns[Math.floor(aleatorioCosmetico() * comuns.length) % comuns.length];
        if (s === evitar && comuns.length > 1) s = comuns[(comuns.indexOf(s) + 1) % comuns.length];
        return s;
      }
      rolos.forEach(function (rolo, r) {
        const d = planos[r].distancia;
        const quase = passo.suspense && r === 2; // o rolo do "quase"
        const fita = new Array(d + FOLGA);
        for (let k = 0; k < 3; k++) {
          fita[1 + k] = porId[passo.tabuleiro[r][k]];
          fita[d + 1 + k] = porId[anterior[r][k]];
        }
        for (let k = d; k >= 4; k--) {
          fita[k] = !quase && aleatorioCosmetico() < CHANCE_CARTA_PASSANDO ? carta : comum(fita[k + 1]);
        }
        fita[0] = comum(fita[1]);
        fita[d + 4] = comum(fita[d + 3]);
        if (quase && passo.tabuleiro[2].some(function (id) { return id !== carta.id; })) {
          // Derrota: a Carta que faltava passa logo antes da parada e outra fica logo acima ("quase!").
          fita[4] = carta;
          fita[0] = carta;
        }
        // Nunca 3 Cartas seguidas fora do alvo (1…3) e do tabuleiro anterior (D+1…D+3): assim, nem de
        // passagem, um rolo mostra uma coluna cheia de Cartas que não é a de verdade (uma derrota nunca
        // parece um tabuleiro cheio, nem por um instante).
        const dePassagem = function (j) { return j === 0 || (j >= 4 && j <= d) || j === d + 4; };
        for (let k = 0; k + 2 < fita.length; k++) {
          if (k === 1 || k === d + 1) continue;
          if (fita[k].carta && fita[k + 1].carta && fita[k + 2].carta) {
            for (let j = k + 2; j >= k; j--) {
              if (dePassagem(j)) { fita[j] = comum(fita[j + 1]); break; }
            }
          }
        }
        rolo.itens.forEach(function (it, k) {
          const usado = k < fita.length;
          if (usado) {
            pintarItem(it.nitido, fita[k]);
            pintarItem(it.borrado, fita[k]);
          }
          if (it.nitido.item.classList.contains('vazio') === usado) {
            it.nitido.item.classList.toggle('vazio', !usado);
            it.borrado.item.classList.toggle('vazio', !usado);
          }
        });
        window.gsap.set([rolo.nitida, rolo.borrada], { yPercent: porcento(-(d + 1)), force3D: true });
        window.gsap.set(rolo.nitida, { opacity: 1 });
        window.gsap.set(rolo.borrada, { opacity: 0 });
      });
      Tela.marcarFase('giro');
    }

    // Tweens de um rolo na linha do tempo, a partir do segundo t0.
    function animarRolo(tl, rolo, plano, t0) {
      const fitas = [rolo.nitida, rolo.borrada];
      let y = -(plano.distancia + 1);
      let t = t0;
      plano.segmentos.forEach(function (seg) {
        const destino = y + seg.dist;
        if (seg.dur > 0) {
          tl.fromTo(fitas, { yPercent: porcento(y) }, { yPercent: porcento(destino), duration: seg.dur, ease: seg.ease, force3D: true, immediateRender: false }, t);
        }
        // Blur de movimento: a fita borrada aparece enquanto o rolo acelera e some quando ele começa a frear.
        if (seg.fase === 'acelera' && seg.dur > 0) {
          tl.fromTo(rolo.borrada, { opacity: 0 }, { opacity: 1, duration: seg.dur, ease: 'power1.in', immediateRender: false }, t);
          tl.fromTo(rolo.nitida, { opacity: 1 }, { opacity: 0, duration: seg.dur, ease: 'power1.in', immediateRender: false }, t);
        }
        if ((seg.fase === 'parada' && plano.segmentos[plano.segmentos.length - 2].fase === 'giro') || seg.fase === 'desacelera') {
          const dur = Math.max(0.01, seg.dur * (seg.fase === 'desacelera' ? 0.8 : 0.45));
          tl.fromTo(rolo.borrada, { opacity: 1 }, { opacity: 0, duration: dur, ease: 'power1.out', immediateRender: false }, t);
          tl.fromTo(rolo.nitida, { opacity: 0 }, { opacity: 1, duration: dur, ease: 'power1.out', immediateRender: false }, t);
        }
        y = destino;
        t += seg.dur;
      });
    }

    // Revelação da etapa: o selo do multiplicador explode (pulo + anel + faíscas) e o anunciador entra.
    function revelar(passo) {
      Tela.revelarEtapa(passo, config);
      Tela.marcarFase(passo.final ? 'desfecho' : 'revelacao');
      if (!passo.final) Som.etapa(passo, velocidade); // na última etapa quem toca é a fanfarra ou o "K.O."
      try {
        Efeitos.etapa(passo, { velocidade: velocidade, tipo: tipoAtual }); // efeitos da faixa (5.7.3)
      } catch (erro) {
        console.error('[Tigrinho] Falha nos efeitos da etapa (seguindo sem eles):', erro);
      }
      const p = Tela.pecasDaRevelacao();
      const g = window.gsap;
      const escala = 1 / velocidade;
      matarAnimacoesDasPecas(p);
      // O número "soca" para fora (1,6×) e volta balançando; o anel abre e as faíscas voam.
      g.timeline()
        .fromTo(p.multiplicador, { scale: 1 }, { scale: 1.6, duration: 0.08 * escala, ease: 'power2.out' })
        .to(p.multiplicador, { scale: 1, duration: 0.5 * escala, ease: 'elastic.out(1, 0.55)' });
      g.fromTo(p.anel, { scale: 0.3, opacity: 1 }, { scale: 2.2, opacity: 0, duration: 0.55 * escala, ease: 'power2.out' });
      const raio = (parseFloat(getComputedStyle(p.multiplicador).fontSize) || 32) * 1.5;
      const passoAngulo = 2 * Math.PI / Math.max(1, p.faiscas.length);
      g.fromTo(p.faiscas, { x: 0, y: 0, scale: 1, opacity: 1 }, {
        x: function (i) { return Math.cos(i * passoAngulo + 0.4) * raio; },
        y: function (i) { return Math.sin(i * passoAngulo + 0.4) * raio * 0.8; },
        scale: 0.3, opacity: 0, duration: 0.55 * escala, ease: 'power3.out',
      });
      if (p.anuncio) g.fromTo(p.anuncio, { scale: 0.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3 * escala, ease: 'back.out(2)' });
    }

    function suspenseDosEfeitos(passo, duracao) {
      try {
        Efeitos.suspense(passo, duracao);
      } catch (erro) {
        console.error('[Tigrinho] Falha nos efeitos do suspense (seguindo sem eles):', erro);
      }
    }

    function pecasAnimadas() {
      const p = Tela.pecasDaRevelacao();
      const lista = [p.multiplicador, p.anel].concat(p.faiscas);
      if (p.anuncio) lista.push(p.anuncio);
      return lista;
    }
    // Interrompe as animações da revelação grupo a grupo, com a mesma lista de alvos com que foram criadas
    // (as faíscas são um grupo só). Com uma lista misturada, o GSAP só corta as propriedades e uma animação
    // que ainda não tinha desenhado o primeiro quadro ficava presa na linha do tempo (ISSUE-011).
    function matarAnimacoesDasPecas(p) {
      const g = window.gsap;
      [p.multiplicador, p.anel, p.faiscas, p.anuncio].forEach(function (alvo) {
        if (alvo && (!Array.isArray(alvo) || alvo.length)) g.killTweensOf(alvo);
      });
    }

    // Encena a rodada inteira a partir do Roteiro. aoDesfecho() é chamado na parada do último rolo da
    // última etapa (começo da revelação final, 5.7.2) e aoTerminar() quando o resultado deve aparecer.
    function encenar(resultado, cfg, aoTerminar, aoDesfecho) {
      parar();
      config = cfg;
      velocidade = resultado.velocidade || cfg.tempos.velocidade || 1;
      tipoAtual = resultado.tipo;
      Efeitos.inicioDaRodada();
      const passos = resultado.roteiro;
      const planos = passos.map(function (passo) {
        const paradas = passo.paradasMs.map(function (ms) { return ms / 1000; });
        const op = Efeitos.opcoesDoGiro(passo.intensidade);
        return [0, 1, 2].map(function (r) {
          return planejarRolo(paradas[r], passo.suspense && r === 2 ? paradas[1] : null, { giro: op.giro, lenta: op.lenta, ultimo: r === 2 });
        });
      });
      const maior = planos.reduce(function (m, p) { return Math.max(m, p[0].distancia, p[1].distancia, p[2].distancia); }, 0);
      if (maior + FOLGA > tamanhoFita) crescerFitas(maior + FOLGA);

      const tl = window.gsap.timeline({ paused: true });
      let t0 = 0;
      let anterior = Tela.tabuleiroAtual(cfg);
      passos.forEach(function (passo, i) {
        const desteTabuleiro = anterior;
        if (i === 0) prepararEtapa(passo, desteTabuleiro, planos[i]); // já, no mesmo quadro do toque
        else tl.call(prepararEtapa, [passo, desteTabuleiro, planos[i]], t0);
        // Som (5.7.4): arranque do giro, tiques enquanto os rolos giram e o baque de cada parada, presos à
        // mesma linha do tempo (pausam com a aba oculta e acompanham a velocidade).
        tl.call(Som.giro, [passo], t0);
        Som.tiquesDaEtapa(passo).forEach(function (t) { tl.call(Som.tique, null, t0 + t); });
        rolos.forEach(function (rolo, r) {
          animarRolo(tl, rolo, planos[i][r], t0);
          tl.call(Tela.desenharColuna, [r, passo.tabuleiro[r], cfg], t0 + passo.paradasMs[r] / 1000);
          tl.call(Som.parada, [r, passo], t0 + passo.paradasMs[r] / 1000);
        });
        if (passo.suspense) {
          tl.call(Tela.marcarFase, ['suspense'], t0 + passo.paradasMs[1] / 1000);
          tl.call(suspenseDosEfeitos, [passo, (passo.paradasMs[2] - passo.paradasMs[1]) / 1000], t0 + passo.paradasMs[1] / 1000);
        }
        tl.call(revelar, [passo], t0 + passo.revelacaoMs / 1000);
        if (passo.final && aoDesfecho) tl.call(aoDesfecho, null, t0 + passo.revelacaoMs / 1000);
        anterior = passo.tabuleiro;
        t0 += passo.duracaoMs / 1000;
      });
      tl.call(function () { linha = null; aoTerminar(); }, null, t0);
      linha = tl;
      tabuleiroEl.classList.add('girando');
      tl.play(0);
    }

    // Ensaio invisível na abertura (atrás do cartão inicial, com a camada dos rolos quase transparente):
    // as fitas recebem todos os símbolos e giram uma vez, nítidas e borradas. O navegador desenha e guarda
    // tudo antes do primeiro toque, e o primeiro giro de verdade sai liso. Um toque interrompe o ensaio.
    let ensaio = null;
    function aquecer(cfg) {
      if (!disponivel() || linha || ensaio) return;
      const g = window.gsap;
      const simbolos = cfg.simbolos;
      const fitas = [];
      rolos.forEach(function (rolo, r) {
        rolo.itens.forEach(function (it, k) {
          const s = simbolos[(k + 3 * r) % simbolos.length];
          pintarItem(it.nitido, s);
          pintarItem(it.borrado, s);
          it.nitido.item.classList.remove('vazio');
          it.borrado.item.classList.remove('vazio');
        });
        fitas.push(rolo.nitida, rolo.borrada);
        g.set(rolo.borrada, { opacity: 1 });
      });
      tabuleiroEl.classList.add('aquecendo');
      ensaio = g.fromTo(fitas, { yPercent: porcento(-(tamanhoFita - 3)) }, {
        yPercent: 0, duration: 0.8, ease: 'none', force3D: true,
        onComplete: function () { encerrarEnsaio(); },
      });
    }
    function encerrarEnsaio() {
      if (!ensaio) return;
      ensaio.kill();
      ensaio = null;
      rolos.forEach(function (rolo) {
        window.gsap.set([rolo.nitida, rolo.borrada], { yPercent: porcento(-1), force3D: true });
        window.gsap.set(rolo.borrada, { opacity: 0 });
      });
      tabuleiroEl.classList.remove('aquecendo');
    }

    // Fim da rodada: os rolos somem e as células (que já têm o tabuleiro final) voltam.
    function recolher() {
      if (tabuleiroEl) tabuleiroEl.classList.remove('girando');
    }

    // Interrompe tudo (reinício): linha do tempo, explosões e posições voltam ao estado de repouso.
    function parar() {
      if (linha) {
        linha.kill();
        linha = null;
      }
      if (!disponivel()) return;
      encerrarEnsaio();
      const g = window.gsap;
      const pecas = pecasAnimadas();
      matarAnimacoesDasPecas(Tela.pecasDaRevelacao());
      g.set(pecas, { clearProps: 'transform,opacity' });
      rolos.forEach(function (rolo) {
        g.killTweensOf([rolo.nitida, rolo.borrada]);
        g.set(rolo.nitida, { opacity: 1 });
        g.set(rolo.borrada, { opacity: 0 });
      });
      recolher();
    }

    return { preparar: preparar, disponivel: disponivel, aquecer: aquecer, encenar: encenar, recolher: recolher, parar: parar };
  })();

  /* ---------- 5.7.1 FESTA (confete e chuva de moedas, proporcionais ao multiplicador) ----------
     Duas camadas <canvas> por cima do jogo (#festa): o confete é do canvas-confetti (bloco de bibliotecas)
     e a chuva de moedas é desenhada aqui, com devicePixelRatio limitado a 2. Tudo anda por
     requestAnimationFrame (pausa com a aba oculta). A quantidade de partículas e a duração crescem com o
     multiplicador: 1x = um confete simples; 20x = rajadas de confete por ~6 s e uma chuva grande de moedas.
     Aparelhos fracos e "reduzir movimento" recebem menos partículas. parar() apaga tudo na hora. */
  const Festa = (function () {
    let camada = null, telaConfete = null, telaMoedas = null, ctx = null, confete = null;
    let largura = 0, altura = 0, dpr = 1, raio = 12, moeda = null, cores = [];
    let moedas = [], rajadas = [], emissoes = [], quadro = 0, inicio = 0, ultimo = 0, pausadaEm = 0;

    function preparar() {
      camada = document.getElementById('festa');
      telaConfete = document.getElementById('festa-confete');
      telaMoedas = document.getElementById('festa-moedas');
      if (!camada || !telaConfete || !telaMoedas) return;
      ctx = telaMoedas.getContext('2d');
      if (typeof window.confetti === 'function' && typeof window.confetti.create === 'function') {
        confete = window.confetti.create(telaConfete, { resize: true, useWorker: false });
      } else {
        avisar('Biblioteca de confete (canvas-confetti) ausente: a festa segue só com as moedas.');
      }
    }

    function token(nome, reserva) {
      const v = getComputedStyle(document.documentElement).getPropertyValue(nome).trim();
      return v || reserva;
    }
    // "Reduzir movimento" e o fator de partículas (aparelho fraco, quadros lentos) vêm dos Efeitos (5.7.3).
    function movimentoReduzido() { return Efeitos.reduzido(); }
    function fatorAparelho() { return Efeitos.fatorParticulas(); }

    // Plano da festa para um multiplicador (1 a 20 com as etapas padrão; a escala vai até a última etapa).
    function planejar(multiplicador, maximo) {
      const f = Math.max(0, Math.min(1, (multiplicador - 1) / Math.max(1, maximo - 1)));
      const k = fatorAparelho();
      return {
        rajadas: 1 + Math.round(f * 11),                       // 1 → 12 rajadas de confete
        porRajada: Math.max(12, Math.round((70 + f * 50) * k)), // 70 → 120 papeizinhos cada
        emissaoMs: Math.round(f * 5600),                        // 0 → 5,6 s soltando confete e moedas
        vidaConfete: Math.round(200 + f * 200),                 // quadros de vida de cada papelzinho
        moedas: Math.round(Math.pow(f, 1.5) * 380 * k),        // 0 → 380 moedas (e caem cada vez mais densas)
      };
    }

    function medir() {
      const l = camada.clientWidth, a = camada.clientHeight;
      const d = Math.min(2, window.devicePixelRatio || 1);
      if (l === largura && a === altura && d === dpr) return;
      largura = l; altura = a; dpr = d;
      telaMoedas.width = Math.max(1, Math.round(l * d));
      telaMoedas.height = Math.max(1, Math.round(a * d));
      raio = Math.max(10, Math.min(26, l * 0.034));
      moeda = desenharMoeda(raio, d);
    }

    // Moeda dourada com furo quadrado (a mesma das pontas da barra "Ganho"), desenhada uma vez por tamanho.
    function desenharMoeda(r, d) {
      const tela = document.createElement('canvas');
      const lado = Math.ceil(r * 2 * d) + 2;
      tela.width = tela.height = lado;
      const c = tela.getContext('2d');
      const m = lado / 2, rr = r * d;
      const grad = c.createRadialGradient(m - rr * 0.35, m - rr * 0.35, rr * 0.1, m, m, rr);
      grad.addColorStop(0, token('--ouro-50', '#fff6d5'));
      grad.addColorStop(0.45, token('--ouro-300', '#f6c544'));
      grad.addColorStop(1, token('--ouro-600', '#a8741a'));
      c.fillStyle = grad;
      c.beginPath(); c.arc(m, m, rr, 0, Math.PI * 2); c.fill();
      c.lineWidth = Math.max(1, rr * 0.12);
      c.strokeStyle = token('--ouro-700', '#7a5212');
      c.beginPath(); c.arc(m, m, rr * 0.82, 0, Math.PI * 2); c.stroke();
      const furo = rr * 0.5;
      c.fillStyle = token('--jade-700', '#0b5e3d');
      c.fillRect(m - furo / 2, m - furo / 2, furo, furo);
      return tela;
    }

    function soltarRajada(i, plano) {
      if (!confete) return;
      const lado = i % 3; // centro, esquerda, direita
      const origem = lado === 0 ? { x: 0.5, y: 0.42 } : { x: lado === 1 ? 0 : 1, y: 0.62 };
      confete({
        particleCount: plano.porRajada,
        angle: lado === 0 ? 90 : (lado === 1 ? 58 : 122),
        spread: lado === 0 ? 100 : 62,
        startVelocity: lado === 0 ? 42 : 58,
        ticks: plano.vidaConfete,
        gravity: 0.9,
        scalar: 1.1,
        origin: origem,
        colors: cores,
      });
    }

    function novaMoeda() {
      return {
        x: Math.random() * largura, y: -raio * 2 - Math.random() * raio * 4,
        vx: (Math.random() - 0.5) * 80, vy: 140 + Math.random() * 160,
        giro: Math.random() * Math.PI * 2, vgiro: 6 + Math.random() * 7,
        inclinacao: (Math.random() - 0.5) * 0.6,
      };
    }

    function passo(agora) {
      quadro = 0;
      const dt = Math.min(0.05, (agora - ultimo) / 1000);
      ultimo = agora;
      const t = agora - inicio;
      medir();
