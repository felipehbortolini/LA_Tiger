      while (rajadas.length && rajadas[0].ms <= t) { const r = rajadas.shift(); soltarRajada(r.i, r.plano); }
      emissoes = emissoes.filter(function (emissao) {
        const devidas = emissao.total * Math.max(0, Math.min(1, (t - emissao.de) / emissao.ms));
        while (emissao.soltas < Math.floor(devidas)) { moedas.push(novaMoeda()); emissao.soltas++; }
        return emissao.soltas < emissao.total;
      });
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, telaMoedas.width, telaMoedas.height);
      const vivas = [];
      for (let i = 0; i < moedas.length; i++) {
        const m = moedas[i];
        m.vy = Math.min(720, m.vy + 520 * dt);
        m.x += m.vx * dt; m.y += m.vy * dt; m.giro += m.vgiro * dt;
        if (m.y - raio > altura) continue;
        vivas.push(m);
        const sx = Math.max(0.12, Math.abs(Math.cos(m.giro)));
        const cos = Math.cos(m.inclinacao), sen = Math.sin(m.inclinacao);
        ctx.setTransform(dpr * cos * sx, dpr * sen * sx, -dpr * sen, dpr * cos, dpr * m.x, dpr * m.y);
        ctx.drawImage(moeda, -raio, -raio, raio * 2, raio * 2);
      }
      moedas = vivas;
      camada.dataset.moedasNaTela = moedas.length;
      if (rajadas.length || emissoes.length || moedas.length) quadro = requestAnimationFrame(passo);
      else { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, telaMoedas.width, telaMoedas.height); }
    }

    // Começa a festa de um multiplicador. atrasoMs: espera antes da primeira rajada.
    function comecar(multiplicador, maximo, atrasoMs) {
      if (!camada) return;
      parar();
      medir();
      cores = [token('--ouro-300', '#f6c544'), token('--ouro-100', '#ffe9a8'), token('--jade-400', '#1fb276'),
        token('--laca-400', '#db4630'), token('--creme', '#fff4dc'), token('--aperol-400', '#ff7a2f')];
      const plano = planejar(multiplicador, maximo);
      const atraso = atrasoMs || 0;
      for (let i = 0; i < plano.rajadas; i++) {
        rajadas.push({ i: i, plano: plano, ms: atraso + (plano.rajadas > 1 ? i * plano.emissaoMs / (plano.rajadas - 1) : 0) });
      }
      // As moedas caem junto com as rajadas, do começo ao fim da emissão.
      emissoes = plano.moedas > 0 ? [{ total: plano.moedas, soltas: 0, de: atraso, ms: Math.max(1, plano.emissaoMs) }] : [];
      camada.dataset.particulas = plano.rajadas * plano.porRajada + plano.moedas;
      camada.dataset.confete = plano.rajadas * plano.porRajada;
      camada.dataset.moedas = plano.moedas;
      camada.dataset.emissaoMs = plano.emissaoMs;
      inicio = performance.now();
      ultimo = inicio;
      quadro = requestAnimationFrame(passo);
    }

    // Apaga tudo na hora: rajadas pendentes, moedas, confete em voo e os dois canvas.
    function parar() {
      if (quadro) cancelAnimationFrame(quadro);
      quadro = 0;
      rajadas = [];
      moedas = [];
      emissoes = [];
      pausadaEm = 0;
      if (confete) confete.reset();
      if (ctx) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, telaMoedas.width, telaMoedas.height); }
      if (camada) {
        ['particulas', 'confete', 'moedas', 'emissaoMs', 'moedasNaTela'].forEach(function (k) { delete camada.dataset[k]; });
      }
    }

    // Chuva curta de moedas no meio da rodada (faixa "lendário" em diante): soma à que já estiver caindo.
    function chuva(total, ms) {
      if (!camada || !ctx || total <= 0) return;
      medir();
      const agora = performance.now();
      if (!quadro && !pausadaEm) { inicio = agora; ultimo = agora; }
      emissoes.push({ total: total, soltas: 0, de: agora - inicio, ms: Math.max(1, ms) });
      if (!quadro && !pausadaEm) quadro = requestAnimationFrame(passo);
    }

    // Aba oculta: para o desenho e, na volta, continua de onde estava (o tempo oculto não conta).
    function pausar(oculta) {
      if (oculta) {
        if (quadro) { cancelAnimationFrame(quadro); quadro = 0; pausadaEm = performance.now(); }
      } else if (pausadaEm) {
        const agora = performance.now();
        inicio += agora - pausadaEm;
        ultimo = agora;
        pausadaEm = 0;
        quadro = requestAnimationFrame(passo);
      }
    }

    return { preparar: preparar, comecar: comecar, parar: parar, chuva: chuva, pausar: pausar, movimentoReduzido: movimentoReduzido };
  })();

  /* ---------- 5.7.2 REVELAÇÃO FINAL (vitória e derrota) ----------
     desfecho(): começa na parada do último rolo da última etapa (as células já têm o tabuleiro final) e
     cabe na pausa antes do resultado (tempos.pausaAntesDoResultadoMs), sem alongar a rodada.
       Vitória: as 9 Cartas "pulam" no tabuleiro, as linhas de pagamento acendem, a barra "Ganho" conta
       até "Nx" e a festa começa (proporcional ao multiplicador).
       Derrota: os rolos ficam "mortos" (sem cor e apagando), entra o "K.O." gigante e a Logo treme.
     resultado(): no RESULTADO, anuncia na região aria-live e faz o título e a mensagem entrarem com destaque.
     limpar(): "Jogar de novo" apaga tudo (festa, camadas, K.O., animações em curso).
     Só transform e opacity. Sem GSAP, as camadas aparecem direto no estado final (sem animação). */
  const Revelacao = (function () {
    let el = null, iniciada = null, contagem = null;

    function preparar(tabuleiro) {
      const camada = function (classe) {
        const d = document.createElement('div');
        d.className = 'camada-revelacao ' + classe;
        d.setAttribute('aria-hidden', 'true');
        tabuleiro.appendChild(d);
        return d;
      };
      const linhas = camada('linhas-pagamento');
      ['1', '2', '3'].forEach(function (n) {
        const i = document.createElement('i');
        i.className = 'linha';
        i.dataset.linha = n;
        linhas.appendChild(i);
      });
      const morto = camada('morto');
      const apagado = camada('apagado');
      const ko = camada('ko');
      el = {
        tabuleiro: tabuleiro, linhas: linhas, morto: morto, apagado: apagado, ko: ko,
        tracos: Array.prototype.slice.call(linhas.querySelectorAll('.linha')),
        celulas: Array.prototype.slice.call(tabuleiro.querySelectorAll('.celula')),
        marcadores: Array.prototype.slice.call(document.querySelectorAll('#moldura-tabuleiro .marcadores span')),
        moldLogo: document.getElementById('moldura-logo'), barra: document.getElementById('barra-ganho'),
        valorGanho: document.getElementById('valor-ganho'), anuncio: document.getElementById('anuncio-resultado'),
        painel: document.getElementById('painel-resultado'),
        entrada: ['resultado-tipo', 'resultado-multiplicador', 'resultado-titulo', 'resultado-mensagem', 'botao-jogar-de-novo']
          .map(function (id) { return document.getElementById(id); }),
      };
      Festa.preparar();
    }

    function gs() { return window.gsap && typeof window.gsap.timeline === 'function' ? window.gsap : null; }
    function pecas() {
      return [el.linhas, el.morto, el.apagado, el.ko, el.moldLogo, el.barra].concat(el.tracos, el.celulas, el.marcadores, el.entrada);
    }

    function desfecho(resultado, cfg) {
      if (!el || iniciada === resultado) return;
      iniciada = resultado;
      Diretor.recolher(); // os rolos somem; as células já mostram o tabuleiro final
      const escala = 1 / (resultado.velocidade || cfg.tempos.velocidade || 1);
      Som.desfecho(resultado, cfg, escala); // fanfarra (vitória) ou "K.O." grave (derrota), 5.7.4
      if (resultado.tipo === 'ganhou') vitoria(resultado, cfg, escala);
      else derrota(resultado, cfg, escala);
      Efeitos.desfecho(resultado, cfg, escala); // jackpot: tela dourada, monograma LA e fogos (5.7.3)
    }

    function vitoria(resultado, cfg, e) {
      const g = gs();
      const reduzido = Festa.movimentoReduzido();
      el.tabuleiro.classList.add('vitoria');
      el.linhas.classList.add('ativa');
      const ordem = ['1', '2', '3'].map(function (n) { return el.tracos.filter(function (t) { return t.dataset.linha === n; })[0]; });
      // Marcadores de cada linha (os dois lados), na ordem em que as linhas acendem.
      const rotulos = ['1', '2', '3'].map(function (n) { return el.marcadores.filter(function (m) { return m.textContent.trim() === n; }); });
      Festa.comecar(resultado.multiplicador, cfg.etapas.length, Math.round(250 * e));
      if (!g) {
        ordem.forEach(function (t) { t.style.opacity = 1; });
        el.valorGanho.textContent = formatarMultiplicador(resultado.multiplicador);
        return;
      }
      // 1. As 9 Cartas tomam o tabuleiro: cada uma "pula" a partir do centro.
      g.fromTo(el.celulas, { scale: 0.55, opacity: 0.35 }, {
        scale: 1, opacity: 1, duration: 0.42 * e, ease: reduzido ? 'power1.out' : 'back.out(2.4)',
        stagger: { each: 0.045 * e, from: 'center', grid: [3, 3] },
      });
      // 2. As linhas de pagamento acendem (1, 2 e 3) e pulsam devagar (bem menos de 3 vezes por segundo).
      ordem.forEach(function (traco, i) {
        const t0 = (0.25 + i * 0.14) * e;
        g.fromTo(traco, { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.3 * e, ease: 'power2.out', delay: t0 });
        if (!reduzido) g.fromTo(rotulos[i], { scale: 1 }, { scale: 1.35, duration: 0.14 * e, yoyo: true, repeat: 1, ease: 'power2.out', delay: t0 });
      });
      g.fromTo(el.linhas, { opacity: 1 }, { opacity: 0.55, duration: 0.8, yoyo: true, repeat: 5, ease: 'sine.inOut', delay: 0.8 * e });
      // 3. A barra "Ganho" conta de 0x até Nx e dá um pulo no fim.
      const alvo = resultado.multiplicador;
      const valor = { v: 0 };
      el.valorGanho.textContent = formatarMultiplicador(0);
      contagem = g.to(valor, {
        v: alvo, duration: Math.min(1.0, 0.3 + 0.04 * alvo) * e, delay: 0.15 * e, ease: 'power1.out',
        onUpdate: function () {
          const n = Math.round(valor.v);
          const texto = formatarMultiplicador(n);
          if (el.valorGanho.textContent !== texto) el.valorGanho.textContent = texto;
        },
        onComplete: function () {
          el.valorGanho.textContent = formatarMultiplicador(alvo);
          contagem = null;
          if (!reduzido) g.fromTo(el.barra, { scale: 1 }, { scale: 1.1, duration: 0.12 * e, yoyo: true, repeat: 1, ease: 'power2.out' });
        },
      });
    }

    function derrota(resultado, cfg, e) {
      const g = gs();
      const reduzido = Festa.movimentoReduzido();
      el.tabuleiro.classList.add('derrota');
      el.ko.textContent = cfg.textos.palavraDerrota;
      [el.morto, el.apagado, el.ko].forEach(function (c) { c.classList.add('ativa'); });
      if (!g) {
        el.morto.style.opacity = 1; el.apagado.style.opacity = 0.45; el.ko.style.opacity = 1;
        return;
      }
      // 1. Rolos "mortos": a cor some e o tabuleiro apaga (camadas prontas aparecendo por opacidade).
      g.fromTo(el.morto, { opacity: 0 }, { opacity: 1, duration: 0.6 * e, ease: 'power1.out' });
      g.fromTo(el.apagado, { opacity: 0 }, { opacity: 0.45, duration: 0.9 * e, delay: 0.15 * e, ease: 'power1.out' });
      g.to(el.celulas, { scale: 0.94, duration: 0.35 * e, ease: 'power2.in', stagger: { each: 0.03 * e } });
      // 2. "K.O." gigante: cai de cima e bate no tabuleiro (com "reduzir movimento", só aparece).
      const impacto = 0.3 * e + 0.28 * e;
      if (reduzido) g.fromTo(el.ko, { opacity: 0 }, { opacity: 1, duration: 0.4 * e, delay: 0.3 * e });
      else {
        g.timeline({ delay: 0.3 * e })
          .fromTo(el.ko, { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28 * e, ease: 'power4.in' })
          .to(el.ko, { scale: 1.08, duration: 0.07 * e, ease: 'power1.out' })
          .to(el.ko, { scale: 1, duration: 0.35 * e, ease: 'elastic.out(1, 0.4)' });
      }
      // 3. A Logo treme com a pancada (com "reduzir movimento", só pisca de leve por opacidade).
      if (reduzido) g.fromTo(el.moldLogo, { opacity: 0.6 }, { opacity: 1, duration: 0.5 * e, delay: impacto });

        });

          .to(el.moldLogo, { x: -5, rotation: -1.2, duration: 0.05 * e })
          .to(el.moldLogo, { x: 4, rotation: 1, duration: 0.05 * e })

    // RESULTADO: região aria-live e entrada com destaque do tipo, multiplicador, título e mensagem.
    function resultado(res, cfg) {
      if (!el) return;
      const tipo = res.tipo === 'ganhou' ? cfg.textos.tipoGanhou : cfg.textos.tipoPerdeu;
      const frase = function (t) { t = String(t).trim(); return /[.!?…]$/.test(t) ? t : t + '.'; };
      el.anuncio.textContent = tipo + ' ' + frase(formatarMultiplicador(res.multiplicador)) + ' ' + frase(res.titulo) + ' ' + res.mensagem;
      if (res.tipo === 'ganhou') el.valorGanho.textContent = formatarMultiplicador(res.multiplicador);
      const g = gs();

        .fromTo(mensagemEl, { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'power2.out' }, 0.22)
        .fromTo(botaoEl, { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.3)

    // "Jogar de novo": para todas as animações da revelação, apaga a festa e esconde as camadas.
    function limpar() {
      iniciada = null;
      Festa.parar();
      Efeitos.limpar();
      if (!el) return;
      if (contagem) { contagem.kill(); contagem = null; }
      const g = gs();
      const todas = pecas();
      if (g) {
        g.killTweensOf(todas);
        g.set(todas, { clearProps: 'transform,opacity' });

      todas.forEach(function (p) { if (p && p.style) { p.style.removeProperty('opacity'); p.style.removeProperty('transform'); } });
      [el.linhas, el.morto, el.apagado, el.ko].forEach(function (c) { c.classList.remove('ativa'); });

    return { preparar: preparar, desfecho: desfecho, resultado: resultado, limpar: limpar };
  })();

  /* ---------- 5.7.3 EFEITOS POR INTENSIDADE (faixas, Logo, flashes, reduzir movimento) ----------
     Cada passo do Roteiro traz a intensidade da etapa, e os efeitos crescem com ela. Eles se sobrepõem à
     linha do tempo da rodada (entram na revelação de cada etapa), sem alongar nada:
       morno ........ brilho e faíscas leves;
       quente ....... giro mais rápido (Diretor), mais faíscas, moldura dourada pulsando (CSS 2.10.2), Logo pulando;
       pegando-fogo . tremor de tela, brasas subindo, fundo esquentando e "batimento" do tabuleiro;
       lendario ..... câmera lenta na parada (Diretor), raios, chuva de moedas e zoom;
       jackpot ...... tudo isso e, na vitória, tela dourada com o monograma LA em tela cheia e fogos.
     A Logo reage em todas as faixas (pula, treme, balança e brilha), mais forte nas faixas altas.
     Flashes: TODO clarão (raio, flash de tela, brilho rápido da Logo) passa por pedirFlash(), que deixa no
     mínimo 400 ms entre um e outro: nunca mais de 3 por segundo, em nenhuma velocidade.
     "Reduzir movimento" (classe .reduzir-movimento na raiz, lida de prefers-reduced-motion na abertura):
     nada treme, pula ou dá zoom; os clarões viram fades lentos (no mínimo 1,2 s entre um e outro) e as
     partículas ficam limitadas.
     Partículas: num <canvas> com devicePixelRatio de no máximo 2. A quantidade escala com a faixa e cai em

     Aba oculta: pausar() congela a linha do tempo do GSAP, o canvas, a festa e as animações CSS. */
  const Efeitos = (function () {
    // Força de cada efeito por faixa (px, graus, fração de escala, partículas por evento ou por segundo).
    const NIVEIS = {
      'morno':        { n: 0, giro: 1,    faiscas: 12, brasas: 0,  calor: 0,    tremor: 0, raios: 0, moedas: 0,  zoom: 0,    pulo: 5,  treme: 1.5, balanco: 1.5, brilho: 0.35 },
      'quente':       { n: 1, giro: 1.22, faiscas: 24, brasas: 0,  calor: 0,    tremor: 0, raios: 0, moedas: 0,  zoom: 0,    pulo: 11, treme: 2.5, balanco: 3,   brilho: 0.55 },
      'pegando-fogo': { n: 2, giro: 1.32, faiscas: 32, brasas: 24, calor: 0.45, tremor: 5, raios: 0, moedas: 0,  zoom: 0,    pulo: 13, treme: 4,   balanco: 3.5, brilho: 0.7 },
      'lendario':     { n: 3, giro: 1.4,  faiscas: 40, brasas: 34, calor: 0.62, tremor: 7, raios: 1, moedas: 16, zoom: 0.07, pulo: 15, treme: 6,   balanco: 4.5, brilho: 0.85 },
      'jackpot':      { n: 4, giro: 1.45, faiscas: 48, brasas: 46, calor: 0.78, tremor: 9, raios: 2, moedas: 28, zoom: 0.1,  pulo: 18, treme: 8,   balanco: 6,   brilho: 1 },
    };
    const FLASH_MIN_MS = 400;          // 400 ms entre clarões = no máximo 3 por segundo
    const FLASH_MIN_REDUZIDO_MS = 1200; // com "reduzir movimento", os fades lentos ficam ainda mais espaçados
    let el = null, ctx = null, cores = null;
    let largura = 0, altura = 0, dpr = 1;
    let particulas = [], raios = [], quadro = 0, ultimo = 0, pausado = false;
    let brasasPorSegundo = 0, brasasDevidas = 0;
    let ultimoFlash = -Infinity, flashes = 0;
    let fpsMedio = 60, quadrosMedidos = 0, fpsBaixo = false, medindo = false;
    let jackpotTl = null;

    function gs() { return window.gsap && typeof window.gsap.timeline === 'function' ? window.gsap : null; }
    function nivel(id) { return NIVEIS[id] || NIVEIS.morno; }
    function reduzido() { return document.documentElement.classList.contains('reduzir-movimento'); }

    // Menos partículas em aparelho fraco (poucos núcleos, pouca memória ou quadros lentos) e com "reduzir movimento".
    function fatorParticulas() {
      let f = 1;
      if (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) f *= 0.7;
      if (navigator.deviceMemory && navigator.deviceMemory <= 2) f *= 0.7;

      if (reduzido()) f *= 0.35;
      return f;
    }
    function limiteParticulas() { return reduzido() ? 90 : Math.round(560 * fatorParticulas()); }

    function preparar() {
      const camada = document.getElementById('efeitos');
      const tela = document.getElementById('efeitos-canvas');
      if (!camada || !tela) return;
      const moldura = document.getElementById('moldura-tabuleiro');
      const moldLogo = document.getElementById('moldura-logo');
      const aura = document.createElement('div');
      aura.className = 'aura-tabuleiro';
      aura.setAttribute('aria-hidden', 'true');
      if (moldura) moldura.appendChild(aura);
      const brilho = document.createElement('span');
      brilho.className = 'brilho-logo';
      brilho.setAttribute('aria-hidden', 'true');
      if (moldLogo) moldLogo.appendChild(brilho);
      el = {
        camada: camada, tela: tela, aura: aura, brilho: brilho, moldLogo: moldLogo, moldura: moldura,
        jogo: document.getElementById('jogo'), area: document.getElementById('area-tabuleiro'),
        tabuleiro: document.getElementById('tabuleiro'), selo: document.getElementById('selo-multiplicador'),
        gabinete: document.getElementById('gabinete'),
        calor: camada.querySelector('.calor'), flash: camada.querySelector('.flash'),
        jackpot: camada.querySelector('.jackpot'), raiosSol: camada.querySelector('.raios-sol'),
        monograma: camada.querySelector('.monograma'), monogramaUso: camada.querySelector('.monograma use'),
        jackpotTexto: camada.querySelector('.jackpot-texto'),
      };
      ctx = tela.getContext('2d');
      const css = getComputedStyle(document.documentElement);
      const tk = function (nome, reserva) { return css.getPropertyValue(nome).trim() || reserva; };
      cores = {
        ouro: [tk('--ouro-50', '#fff6d5'), tk('--ouro-100', '#ffe9a8'), tk('--ouro-300', '#f6c544')],
        fogo: [tk('--ouro-100', '#ffe9a8'), tk('--ouro-300', '#f6c544'), tk('--aperol-400', '#ff7a2f'), tk('--laca-400', '#db4630')],
        fogos: [tk('--ouro-300', '#f6c544'), tk('--ouro-50', '#fff6d5'), tk('--jade-400', '#1fb276'), tk('--laca-400', '#db4630'), tk('--aperol-400', '#ff7a2f'), tk('--creme', '#fff4dc')],
      };
    }

    // Todo clarão pede licença aqui: no mínimo 400 ms (1,2 s com "reduzir movimento") desde o último.
    function pedirFlash() {
      const agora = performance.now();
      if (agora - ultimoFlash < (reduzido() ? FLASH_MIN_REDUZIDO_MS : FLASH_MIN_MS)) return false;
      ultimoFlash = agora;
      flashes++;
      if (el) el.camada.dataset.flashes = flashes;
      return true;
    }
    // Clarão de uma peça (só opacidade): rápido no modo normal; fade lento com "reduzir movimento".
    function clarear(alvo, forca) {
      const g = gs();
      if (!g || !alvo) return;
      g.killTweensOf(alvo, 'opacity');
      const r = reduzido();
      g.timeline()
        .fromTo(alvo, { opacity: 0 }, { opacity: forca * (r ? 0.5 : 1), duration: r ? 0.35 : 0.06, ease: r ? 'sine.inOut' : 'power1.out' })
        .to(alvo, { opacity: 0, duration: r ? 0.7 : 0.32, ease: 'power1.in' });
    }

    // ---- Canvas das partículas ----
    function medir() {
      const l = el.camada.clientWidth, a = el.camada.clientHeight;
      const d = Math.min(2, window.devicePixelRatio || 1); // devicePixelRatio limitado a 2
      if (l === largura && a === altura && d === dpr) return;
      largura = l; altura = a; dpr = d;
      el.tela.width = Math.max(1, Math.round(l * d));
      el.tela.height = Math.max(1, Math.round(a * d));
      el.camada.dataset.dpr = d;
    }
    function caixa(alvo) {
      const base = el.camada.getBoundingClientRect();
      const r = alvo ? alvo.getBoundingClientRect() : base;
      return { x: r.left - base.left, y: r.top - base.top, l: r.width, a: r.height };
    }
    function sorteio(a, b) { return a + Math.random() * (b - a); } // só enfeite (posições e cores)
    function cor(lista) { return lista[Math.floor(Math.random() * lista.length) % lista.length]; }
    function cabe() { return particulas.length < limiteParticulas(); }
    function rodar() {
      if (!quadro && !pausado && el) { ultimo = performance.now(); quadro = requestAnimationFrame(passo); }
    }

    function faiscas(x, y, n, espalha) {
      for (let i = 0; i < n && cabe(); i++) {
        const ang = -Math.PI / 2 + sorteio(-espalha, espalha);
        const v = sorteio(170, 430);
        particulas.push({ tipo: 'faisca', x: x, y: y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, vida: 0, max: sorteio(0.35, 0.75), r: sorteio(1.2, 2.4), cor: cor(cores.ouro), g: 620 });
      }
      rodar();
    }
    function brasa() {
      const gab = caixa(el.gabinete);
      const tab = caixa(el.tabuleiro);
      const doTabuleiro = Math.random() < 0.35;
      particulas.push({
        tipo: 'brasa', x: doTabuleiro ? tab.x + sorteio(0, tab.l) : gab.x + sorteio(0, gab.l), y: doTabuleiro ? tab.y + tab.a : altura + 6,
        vx: sorteio(-18, 18), vy: -sorteio(70, 175), vida: 0, max: sorteio(1.2, 2.3), r: sorteio(2.2, 5.4), fase: sorteio(0, 6.3), g: -20,
      });
    }
    function fogos(x, y, n) {
      for (let i = 0; i < n && cabe(); i++) {
        const ang = (i / n) * Math.PI * 2 + sorteio(-0.08, 0.08);
        const v = sorteio(0.5, 1) * Math.min(largura, altura) * 0.8;
        particulas.push({ tipo: 'fogo', x: x, y: y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, vida: 0, max: sorteio(1, 1.5), r: sorteio(2.6, 4.2), cor: cor(cores.fogos), g: 150, arrasto: 0.1 });
      }
      rodar();
    }
    // Raio: linha quebrada do alto da tela até a borda de cima do tabuleiro, com um galho.
    function raio() {
      const tab = caixa(el.tabuleiro);
      const gab = caixa(el.gabinete);
      const x0 = gab.x + sorteio(0.15, 0.85) * gab.l, x1 = tab.x + sorteio(0.2, 0.8) * tab.l, y1 = tab.y + tab.a * 0.08;
      const pontos = [[x0, 0]];
      const n = 11;
      for (let i = 1; i < n; i++) {
        const t = i / n;
        pontos.push([x0 + (x1 - x0) * t + sorteio(-1, 1) * gab.l * 0.07, y1 * t]);
      }
      pontos.push([x1, y1]);
      const k = 4 + Math.floor(Math.random() * 4);
      const galho = [pontos[k]];
      for (let i = 1; i <= 4; i++) galho.push([pontos[k][0] + i * sorteio(8, 22) * (x0 < x1 ? -1 : 1), pontos[k][1] + i * sorteio(14, 30)]);
      raios.push({ linhas: [pontos, galho], vida: 0, max: 0.24 });
      rodar();
    }

    function passo(agora) {
      quadro = 0;
      if (pausado) return;
      const dt = Math.min(0.05, Math.max(0, (agora - ultimo) / 1000));
      ultimo = agora;
      medir();
      if (brasasPorSegundo > 0) {
        brasasDevidas += brasasPorSegundo * dt;
        while (brasasDevidas >= 1) { brasasDevidas -= 1; if (cabe()) brasa(); }
      }
      const c = ctx;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, el.tela.width, el.tela.height);
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.globalCompositeOperation = 'lighter';
      const vivas = [];
      for (let i = 0; i < particulas.length; i++) {
        const p = particulas[i];
        p.vida += dt;
        if (p.vida >= p.max) continue;
        if (p.arrasto) { const a = Math.pow(p.arrasto, dt); p.vx *= a; p.vy *= a; }
        p.vy += p.g * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        const resta = 1 - p.vida / p.max;
        // Fogos com cor cheia (sobre a tela dourada); faíscas e brasas somando luz.
        const modo = p.tipo === 'fogo' ? 'source-over' : 'lighter';
        if (c.globalCompositeOperation !== modo) c.globalCompositeOperation = modo;
        if (p.tipo === 'faisca') {
          c.globalAlpha = resta;
          c.strokeStyle = p.cor;
          c.lineWidth = p.r;
          c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035); c.stroke();
        } else if (p.tipo === 'brasa') {
          p.x += Math.sin(p.fase + p.vida * 5) * 18 * dt;
          c.globalAlpha = Math.min(1, resta * 1.4);
          c.fillStyle = cores.fogo[Math.min(3, Math.floor((1 - resta) * 4))];
          c.beginPath(); c.arc(p.x, p.y, p.r * (0.45 + 0.55 * resta), 0, Math.PI * 2); c.fill();
        } else {
          c.globalAlpha = Math.min(1, resta * 1.6);
          c.fillStyle = p.cor;
          c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI * 2); c.fill();
        }
        vivas.push(p);
      }
      particulas = vivas;
      c.globalCompositeOperation = 'lighter';
      raios = raios.filter(function (r) {
        r.vida += dt;
        if (r.vida >= r.max) return false;
        const a = 1 - r.vida / r.max;
        r.linhas.forEach(function (pts, j) {
          [[7, 0.3, cores.ouro[2]], [2.4, 1, cores.ouro[0]]].forEach(function (traco) {
            c.globalAlpha = a * traco[1] * (j ? 0.7 : 1);
            c.strokeStyle = traco[2];
            c.lineWidth = traco[0] * (j ? 0.6 : 1);
            c.beginPath();
            pts.forEach(function (pt, k) { if (k) c.lineTo(pt[0], pt[1]); else c.moveTo(pt[0], pt[1]); });

          });
        });
        return true;
      });
      c.globalAlpha = 1;
      c.globalCompositeOperation = 'source-over';
      el.camada.dataset.particulas = particulas.length;
      if (particulas.length || raios.length || brasasPorSegundo > 0) quadro = requestAnimationFrame(passo);
      else { c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, el.tela.width, el.tela.height); }
    }

    // Quadros por segundo durante a rodada (ticker do GSAP): se ficar lento, as partículas caem pela metade.
    function medirQuadro(tempo, deltaMs) {
      if (!(deltaMs > 0) || deltaMs > 250) return; // aba voltando / pausa: não conta
      fpsMedio = fpsMedio * 0.92 + (1000 / deltaMs) * 0.08;
      quadrosMedidos++;
      if (quadrosMedidos > 30) {
        if (fpsMedio < 34) fpsBaixo = true;
        else if (fpsMedio > 50) fpsBaixo = false;
      }
    }

    // ---- Opções que o Diretor usa nos rolos ----
    function opcoesDoGiro(id) {
      const nv = nivel(id);
      return { giro: reduzido() ? 1 : nv.giro, lenta: nv.n >= 3 };
    }

    function inicioDaRodada() {
      if (!el) return;
      const g = gs();
      if (g && !medindo) { g.ticker.add(medirQuadro); medindo = true; }
      quadrosMedidos = 0;
      el.camada.dataset.fator = fatorParticulas().toFixed(2);
    }

    // ---- Revelação de cada etapa (chamada pelo Diretor na parada do último rolo) ----
    function etapa(passo, info) {
      const g = gs();
      if (!el || !g) return;
      const nv = nivel(passo.intensidade);
      const e = 1 / (info.velocidade || 1);
      const r = reduzido();
      const k = fatorParticulas();
      const perdeuAqui = passo.final && info.tipo === 'perdeu';
      el.camada.dataset.intensidade = passo.intensidade;
      el.camada.dataset.fator = k.toFixed(2);
      // Fundo esquentando e brasas (pegando fogo em diante): sobem aos poucos e ficam até o fim da rodada.
      g.to(el.calor, { opacity: nv.calor, duration: 0.6 * e, ease: 'sine.inOut', overwrite: true });
      brasasPorSegundo = nv.brasas * k;
      // Faíscas: do selo do multiplicador e dos dois cantos de cima do tabuleiro.
      const selo = caixa(el.selo), tab = caixa(el.tabuleiro);
      const n = Math.max(3, Math.round(nv.faiscas * k));
      faiscas(selo.x + selo.l / 2, selo.y + selo.a / 2, Math.ceil(n * 0.5), 1.4);
      faiscas(tab.x + 6, tab.y + 6, Math.ceil(n * 0.25), 0.9);
      faiscas(tab.x + tab.l - 6, tab.y + 6, Math.ceil(n * 0.25), 0.9);
      // Clarão do momento (um por revelação, se o limite de flashes deixar): brilho rápido da Logo e, do
      // lendário em diante, raios com clarão de tela. Sem licença, a Logo só pula e treme.
      if (pedirFlash()) {
        clarear(el.brilho, nv.brilho);
        if (nv.raios) {
          clarear(el.flash, 0.38 + 0.12 * nv.raios);
          if (!r) for (let i = 0; i < nv.raios; i++) raio();
        }
      }
      // Chuva de moedas (lendário em diante), só nas etapas intermediárias: no desfecho entra a festa ou o K.O.
      if (nv.moedas && !passo.final) Festa.chuva(Math.max(4, Math.round(nv.moedas * k)), 420 * e);
      if (r) return; // "reduzir movimento": nada treme, pula ou dá zoom
      // Logo: pula (y + escala), balança (rotação) e treme (x). Na derrota final, quem treme é o K.O. (5.7.2).
      if (!perdeuAqui && el.moldLogo) {
        g.killTweensOf(el.moldLogo);
        const tl = g.timeline({ onComplete: function () { g.set(el.moldLogo, { clearProps: 'transform' }); } });
        tl.to(el.moldLogo, { y: -nv.pulo, scale: 1 + nv.pulo / 300, rotation: nv.balanco, duration: 0.12 * e, ease: 'power2.out' })
          .to(el.moldLogo, { y: 0, scale: 1, rotation: -nv.balanco * 0.6, duration: 0.16 * e, ease: 'power2.in' });
        [1, -0.8, 0.6, -0.4, 0].forEach(function (f) {
          tl.to(el.moldLogo, { x: nv.treme * f, rotation: nv.balanco * f * 0.5, duration: 0.035 * e, ease: 'none' });
        });
      }
      // Tremor de tela (pegando fogo em diante).
      if (nv.tremor) {
        g.killTweensOf(el.jogo);
        const tr = g.timeline({ onComplete: function () { g.set(el.jogo, { clearProps: 'transform' }); } });
        [[1, -0.6], [-0.9, 0.8], [0.7, -0.9], [-0.5, 0.5], [0.3, -0.2], [0, 0]].forEach(function (p) {
          tr.to(el.jogo, { x: nv.tremor * p[0], y: nv.tremor * p[1], duration: 0.04 * e, ease: 'none' });
        });
      }
      // "Batimento" do tabuleiro (pegando fogo em diante): tum-tum.
      if (nv.n >= 2 && el.moldura) {
        g.killTweensOf(el.moldura);
        g.timeline({ onComplete: function () { g.set(el.moldura, { clearProps: 'transform' }); } })
          .to(el.moldura, { scale: 1.035, duration: 0.08 * e, ease: 'power2.out' })
          .to(el.moldura, { scale: 1, duration: 0.09 * e, ease: 'power2.in' })
          .to(el.moldura, { scale: 1.022, duration: 0.07 * e, ease: 'power2.out' })
          .to(el.moldura, { scale: 1, duration: 0.16 * e, ease: 'power2.in' });
      }
      // Zoom (lendário em diante): a "câmera" chega perto do tabuleiro e volta.
      if (nv.zoom && el.area) {
        g.killTweensOf(el.area);
        g.timeline({ onComplete: function () { g.set(el.area, { clearProps: 'transform' }); } })
          .to(el.area, { scale: 1 + nv.zoom, duration: 0.12 * e, ease: 'power2.out' })
          .to(el.area, { scale: 1, duration: 0.42 * e, ease: 'power2.inOut' });
      }
    }

    // Suspense da última etapa (o "quase"): do lendário em diante, câmera lenta com zoom devagar no tabuleiro
    // e a Logo balançando, até o último rolo parar.
    function suspense(passo, duracao) {
      const g = gs();
      if (!el || !g || reduzido()) return;
      const nv = nivel(passo.intensidade);
      if (nv.n < 3) return;
      g.killTweensOf(el.area);
      g.to(el.area, { scale: 1 + nv.zoom * 0.6, duration: duracao, ease: 'sine.inOut' });
      g.killTweensOf(el.moldLogo);
      g.to(el.moldLogo, { rotation: nv.balanco * 0.5, duration: Math.max(0.1, duracao / 4), ease: 'sine.inOut', yoyo: true, repeat: 3 });
    }

    // Desfecho (parada do último rolo da última etapa; o zoom do suspense já voltou na revelação da etapa):
    // se for vitória numa etapa "jackpot", começa a revelação em tela cheia.
    function desfecho(resultado, cfg, e) {
      const g = gs();
      if (!el || !g) return;
      const ultimo = resultado.roteiro[resultado.roteiro.length - 1];
      if (resultado.tipo === 'ganhou' && ultimo && ultimo.intensidade === 'jackpot') jackpot(resultado, cfg, e);
    }

    // Jackpot: tela dourada com raios de sol, o monograma LA (a Carta) em tela cheia e fogos. Começa no
    // desfecho, segue por cima do RESULTADO por ~1,4 s e some, mostrando o resultado (tudo em ~3,5 s).
    function jackpot(resultado, cfg, e) {
      const g = gs();
      const r = reduzido();
      const carta = cfg.simbolos.filter(function (s) { return s.carta; })[0];
      if (carta && el.monogramaUso) apontarPara(el.monogramaUso, Simbolos.desenhoDe(carta));
      el.jackpotTexto.textContent = cfg.textos.palavraVitoriaMaxima;
      el.jackpot.classList.add('ativo');
      el.camada.dataset.jackpot = 'sim';
      const segura = (cfg.tempos.pausaAntesDoResultadoMs / 1000 + 1.4) * e; // até ~1,4 s depois do RESULTADO
      const k = fatorParticulas();
      const tl = g.timeline({ onComplete: function () { jackpotTl = null; esconderJackpot(); } });
      jackpotTl = tl;
      tl.fromTo(el.jackpot, { opacity: 0 }, { opacity: 1, duration: (r ? 0.9 : 0.45) * e, ease: 'sine.inOut' }, 0);
      if (r) tl.fromTo([el.monograma, el.jackpotTexto], { opacity: 0, scale: 1 }, { opacity: 1, duration: 0.8 * e }, 0.2 * e);
      else {
        tl.fromTo(el.monograma, { scale: 0.15, rotation: -14, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.75 * e, ease: 'back.out(1.7)' }, 0.1 * e)
          .fromTo(el.jackpotTexto, { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35 * e, ease: 'power3.in' }, 0.55 * e)
          .fromTo(el.raiosSol, { rotation: 0 }, { rotation: 60, duration: segura + 0.6 * e, ease: 'none' }, 0)
          .to(el.monograma, { scale: 1.06, duration: 0.5 * e, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 0.9 * e);
      }
      // Fogos: uma explosão a cada ~0,4 s em pontos da metade de cima da tela.
      const explosoes = r ? 3 : Math.max(4, Math.round(9 * Math.min(1, k * 1.2)));
      const porExplosao = Math.max(14, Math.round((r ? 26 : 64) * Math.min(1, k * 1.2)));
      for (let i = 0; i < explosoes; i++) {
        tl.call(function () {
          medir();
          fogos(sorteio(0.18, 0.82) * largura, sorteio(0.12, 0.5) * altura, porExplosao);
        }, null, (0.35 + i * (r ? 0.9 : 0.4)) * e);
      }
      tl.to([el.jackpot], { opacity: 0, duration: 0.6 * e, ease: 'sine.inOut' }, segura);
    }
    function esconderJackpot() {
      if (!el) return;
      el.jackpot.classList.remove('ativo');
      delete el.camada.dataset.jackpot;
      const g = gs();
      if (g) g.set([el.jackpot, el.monograma, el.jackpotTexto, el.raiosSol], { clearProps: 'transform,opacity' });
    }
    // Quanto a entrada do resultado deve esperar (em segundos): só enquanto a tela do jackpot cobre a tela.
    function atrasoDaEntrada() {
      if (!jackpotTl) return 0;
      return Math.max(0, jackpotTl.duration() - jackpotTl.time() - 0.3);
    }

    // RESULTADO: as brasas param de nascer e o fundo esfria (as que estão no ar terminam o voo).
    function fimDaRodada() {
      if (!el) return;
      brasasPorSegundo = 0;
      const g = gs();
      if (g) g.to(el.calor, { opacity: 0, duration: 0.8, ease: 'sine.inOut', overwrite: true });
      if (g && medindo) { g.ticker.remove(medirQuadro); medindo = false; }
      el.camada.dataset.fps = Math.round(fpsMedio);
      el.camada.dataset.fator = fatorParticulas().toFixed(2);
    }

    // "Jogar de novo": apaga tudo na hora.
    function limpar() {
      if (!el) return;
      const g = gs();
      if (jackpotTl) { jackpotTl.kill(); jackpotTl = null; }
      const pecas = [el.calor, el.flash, el.brilho, el.jackpot, el.monograma, el.jackpotTexto, el.raiosSol, el.jogo, el.area, el.moldura, el.moldLogo];
      if (g) {
        g.killTweensOf(pecas);
        g.set(pecas, { clearProps: 'transform,opacity' });
        if (medindo) { g.ticker.remove(medirQuadro); medindo = false; }
      }
      esconderJackpot();
      if (quadro) cancelAnimationFrame(quadro);
      quadro = 0;
      particulas = [];
      raios = [];
      brasasPorSegundo = 0;
      brasasDevidas = 0;
      if (ctx) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, el.tela.width, el.tela.height); }
      // A marcação volta à da primeira abertura: sem a palavra do jackpot e sem o contador de flashes
      // (o contador recomeça a cada rodada). Ficam só data-fps/data-fator/data-dpr, que são a medição do aparelho.
      if (el.jackpotTexto) el.jackpotTexto.textContent = '';
      flashes = 0;
      ['intensidade', 'particulas', 'flashes'].forEach(function (k) { delete el.camada.dataset[k]; });
    }

    // Aba oculta: congela a linha do tempo do GSAP (rolos, revelação, efeitos), o canvas, a festa e as
    // animações CSS; na volta, tudo continua de onde parou (o tempo oculto não conta).
    function pausar(oculta) {
      document.documentElement.classList.toggle('aba-oculta', oculta);
      const g = gs();
      if (g) { if (oculta) g.globalTimeline.pause(); else g.globalTimeline.resume(); }
      Festa.pausar(oculta);
      if (oculta) {
        pausado = true;
        if (quadro) { cancelAnimationFrame(quadro); quadro = 0; }
      } else if (pausado) {
        pausado = false;
        if (particulas.length || raios.length || brasasPorSegundo > 0) rodar();
      }
    }

    return {
      preparar: preparar, reduzido: reduzido, fatorParticulas: fatorParticulas, opcoesDoGiro: opcoesDoGiro,
      inicioDaRodada: inicioDaRodada, etapa: etapa, suspense: suspense, desfecho: desfecho,
      atrasoDaEntrada: atrasoDaEntrada, fimDaRodada: fimDaRodada, limpar: limpar, pausar: pausar,
    };
  })();

  /* ---------- 5.7.4 SOM (efeitos sintetizados na hora pela Web Audio; nenhum arquivo de áudio) ----------
     Todos os efeitos são originais, montados com osciladores, envelopes e ruído no momento em que tocam.
     Sem música de fundo. Os efeitos se prendem aos momentos da rodada:
       - giro: um "vush" curto quando os rolos arrancam em cada etapa;
       - tique: estalos enquanto os rolos giram (mais espaçados quando só o último gira; no suspense,
         cada vez mais lentos, acompanhando o "quase");
       - parada: baque grave de cada rolo que para;
       - etapa: duas notas que sobem, com um tom de base que sobe um semitom a cada etapa;
       - desfecho: fanfarra (vitória; mais longa e mais rica quanto maior o multiplicador) ou "K.O." grave.
     Regras:
       - O AudioContext só é criado no primeiro toque de verdade (exigência do iOS). Antes disso, e
         enquanto o contexto não estiver "running", nenhum som tenta tocar.
       - Onde existir, navigator.audioSession.type = "playback" (toca com o iPhone no silencioso).
       - Mudo: o ganho master vai a 0 na hora e o que estiver soando é cortado. O botão nunca é travado.
       - Vibração curta (navigator.vibrate, só onde existir) na parada e na vitória; o mudo também a corta.
       - Qualquer falha de áudio deixa o jogo mudo, com no máximo um aviso no console; a rodada segue. */
  const Som = (function () {
    const FATOR_VOLUME = 0.55; // volume moderado (salão): ganho master = som.volume × este fator
    const FAIXAS = ['morno', 'quente', 'pegando-fogo', 'lendario', 'jackpot'];
    const EVENTOS_DE_TOQUE = ['pointerdown', 'pointerup', 'touchend', 'mousedown', 'keydown', 'click'];
    let ctx = null;
    let master = null;
    let ruidoBuf = null;
    let botao = null;
    let volume = 0.8;
    let mudo = false;
    let quebrado = false; // Web Audio ausente ou com falha: o jogo segue mudo
    let avisou = false;
    let silencioTocado = false;
    const ativos = new Set(); // fontes agendadas/tocando (para o mudo e o reinício cortarem na hora)

    function avisar(texto, erro) {
      if (avisou) return;
      avisou = true;
      if (erro) console.warn('[Tigrinho] ' + texto + ' O jogo segue mudo.', erro);
      else console.warn('[Tigrinho] ' + texto + ' O jogo segue mudo.');
    }
    // Toda função pública passa por aqui: um erro de áudio nunca chega à rodada.
    function seguro(funcao) {
      return function () {
        try {
          return funcao.apply(null, arguments);
        } catch (erro) {
          avisar('Falha no som.', erro);
          return undefined;
        }
      };
    }
    function alvo() { return mudo ? 0 : volume * FATOR_VOLUME; }
    function pronto() { return !!(ctx && master && !mudo && ctx.state === 'running'); }
    function nivelDe(intensidade) { return Math.max(0, FAIXAS.indexOf(intensidade)); }

    function criarContexto() {
      if (ctx) return true;
      if (quebrado) return false;
      const Classe = window.AudioContext || window.webkitAudioContext;
      if (!Classe) {
        quebrado = true;
        avisar('Web Audio indisponível neste navegador.');
        return false;
      }
      try {
        try { ctx = new Classe({ latencyHint: 'interactive' }); } catch (e) { ctx = new Classe(); }
        // master → compressor (segura os picos da fanfarra) → saída
        const compressor = ctx.createDynamicsCompressor();
        compressor.threshold.value = -16;
        compressor.knee.value = 12;
        compressor.ratio.value = 5;
        compressor.attack.value = 0.004;
        compressor.release.value = 0.2;
        master = ctx.createGain();
        master.gain.value = alvo();
        master.connect(compressor);
        compressor.connect(ctx.destination);
        // 1 s de ruído branco, reaproveitado por todos os efeitos de ruído.
        const n = Math.floor(ctx.sampleRate);
        ruidoBuf = ctx.createBuffer(1, n, ctx.sampleRate);
        const dados = ruidoBuf.getChannelData(0);
        for (let i = 0; i < n; i++) dados[i] = Math.random() * 2 - 1;
        return true;
      } catch (erro) {
        ctx = null;
        master = null;
        quebrado = true;
        avisar('Não foi possível iniciar o som.', erro);
        return false;
      }
    }

    // Primeiro toque de verdade (e os seguintes, se o sistema suspender o áudio): cria/retoma o contexto
    // e toca 1 amostra de silêncio, que é o que destrava o áudio no iOS. Cliques simulados não destravam.
    function destravar(evento) {
      if (quebrado || (evento && evento.isTrusted === false)) return;
      if (ctx && ctx.state === 'running' && silencioTocado) return;
      const ativacao = navigator.userActivation;
      if (ativacao && !ativacao.isActive) return; // ex.: pointerdown de toque no Android (a ativação vem no pointerup)
      if (!criarContexto()) return;
      try {
        if (ctx.state !== 'running' && ctx.resume) {
          const promessa = ctx.resume();
          if (promessa && promessa.catch) promessa.catch(function () {});
        }
        if (!silencioTocado) {
          silencioTocado = true;
          const fonte = ctx.createBufferSource();
          fonte.buffer = ctx.createBuffer(1, 1, 22050);
          fonte.connect(ctx.destination);
          fonte.start(0);
        }
      } catch (erro) {
        avisar('Falha ao destravar o som.', erro);
      }
    }

    function registrar(fonte) {
      ativos.add(fonte);
      fonte.onended = function () { ativos.delete(fonte); };
    }
    function pararTudo() {
      ativos.forEach(function (fonte) { try { fonte.stop(); } catch (e) { /* já parou */ } });
      ativos.clear();
    }
    function aplicarGanho() {
      if (!master) return;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.value = alvo();
    }
    function mostrarBotao() {
      if (!botao) return;
      botao.setAttribute('aria-pressed', mudo ? 'true' : 'false');
      botao.title = mudo ? 'Som desligado: toque para ligar' : 'Som ligado: toque para silenciar';
    }
    function definirMudo(valor) {
      mudo = !!valor;
      if (mudo) pararTudo();
      aplicarGanho();
      mostrarBotao();
    }

    function vibrar(padrao) {
      if (mudo || typeof navigator.vibrate !== 'function') return;
      const ativacao = navigator.userActivation;
      if (ativacao && !ativacao.hasBeenActive) return; // sem toque ainda: o navegador recusaria (e avisaria)
      try { navigator.vibrate(padrao); } catch (e) { /* sem vibração */ }
    }

    // Saída de um efeito: envelope (ganho) → filtro opcional → master.
    function saida(entrada, o, t0) {
      const g = ctx.createGain();
      const ataque = o.ataque || 0.005;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.vol, t0 + ataque);
      if (o.sustenta) g.gain.linearRampToValueAtTime(o.vol * 0.7, t0 + o.dur * 0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
      entrada.connect(g);
      if (o.passaBaixa) {
        const filtro = ctx.createBiquadFilter();
        filtro.type = 'lowpass';
        filtro.frequency.value = o.passaBaixa;
        g.connect(filtro);
        filtro.connect(master);
      } else {
        g.connect(master);
      }
    }
    // Uma nota: { tipo, f, f2 (deslize até), deslize (s), t (atraso s), dur, vol, ataque, sustenta, passaBaixa }
    function tom(o) {
      const t0 = ctx.currentTime + (o.t || 0);
      const osc = ctx.createOscillator();
      osc.type = o.tipo || 'triangle';
      osc.frequency.value = o.f;
      osc.frequency.setValueAtTime(o.f, t0);
      if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + (o.deslize || o.dur));
      if (o.desafina) osc.detune.value = o.desafina;
      saida(osc, o, t0);
      osc.start(t0);
      osc.stop(t0 + o.dur + 0.03);
      registrar(osc);
    }
    // Ruído filtrado: { t, dur, vol, filtro ('bandpass'|'lowpass'|'highpass'), freq, freq2, q }
    function ruido(o) {
      const t0 = ctx.currentTime + (o.t || 0);
      const fonte = ctx.createBufferSource();
      fonte.buffer = ruidoBuf;
      const filtro = ctx.createBiquadFilter();
      filtro.type = o.filtro || 'bandpass';
      filtro.frequency.setValueAtTime(o.freq, t0);
      if (o.freq2) filtro.frequency.exponentialRampToValueAtTime(o.freq2, t0 + o.dur);
      filtro.Q.value = o.q || 1;
      fonte.connect(filtro);
      saida(filtro, o, t0);
      fonte.start(t0, Math.random() * Math.max(0, 0.95 - o.dur));
      fonte.stop(t0 + o.dur + 0.03);
      registrar(fonte);
    }
    function semitons(f, n) { return f * Math.pow(2, n / 12); }

    // ---- Efeitos ----
    function giro(passo) {
      if (!pronto()) return;
      const n = nivelDe(passo && passo.intensidade);
      ruido({ dur: 0.24, vol: 0.06 + 0.012 * n, filtro: 'bandpass', freq: 380, freq2: 2600, q: 1.4, ataque: 0.04 });
    }

    // Instantes dos tiques de uma etapa (s, contados do começo da etapa), a partir das paradas do Roteiro.
    function tiquesDaEtapa(passo) {
      const p = passo.paradasMs.map(function (ms) { return ms / 1000; });
      const lista = [];
      let t = 0.08;
      while (t < p[1] - 0.03) { lista.push(t); t += t < p[0] ? 0.075 : 0.085; }
      t = Math.max(t, p[1] + 0.06);
      let intervalo = passo.suspense ? 0.09 : 0.095;
      while (t < p[2] - 0.05) {
        lista.push(t);
        t += intervalo;
        if (passo.suspense) intervalo = Math.min(0.32, intervalo * 1.13); // o último rolo freia: estalos espaçando
      }
      return lista;
    }
    function tique() {
      if (!pronto()) return;
      ruido({ dur: 0.028, vol: 0.09, filtro: 'bandpass', freq: 2200 + Math.random() * 600, q: 5, ataque: 0.002 });
      tom({ tipo: 'triangle', f: 1500 + Math.random() * 200, dur: 0.03, vol: 0.035, ataque: 0.002 });
    }

    function parada(rolo, passo) {
      if (rolo === 2) vibrar(12);
      if (!pronto()) return;
      const ultimo = rolo === 2 && passo && passo.final;
      tom({ tipo: 'sine', f: 200 - 18 * rolo, f2: 62, deslize: 0.12, dur: ultimo ? 0.24 : 0.16, vol: ultimo ? 0.34 : 0.26, ataque: 0.003 });
      ruido({ dur: 0.07, vol: 0.12, filtro: 'lowpass', freq: 1600, freq2: 260, ataque: 0.002 });
      tom({ tipo: 'square', f: 760 + 90 * rolo, dur: 0.035, vol: 0.022, ataque: 0.002, passaBaixa: 2400 });
    }

    // Subida de etapa: a base sobe um semitom por etapa (sol 392 Hz na 1ª); duas notas para cima.
    function etapa(passo, velocidade) {
      if (!pronto()) return;
      const e = 1 / (velocidade || 1);
      const n = nivelDe(passo.intensidade);
      const base = semitons(392, Math.min(30, passo.etapa - 1));
      tom({ tipo: 'triangle', f: base, f2: semitons(base, 5), deslize: 0.09 * e, dur: 0.14 * e, vol: 0.15 });
      tom({ tipo: 'triangle', f: semitons(base, 7), t: 0.09 * e, dur: 0.26 * e, vol: 0.14 });
      tom({ tipo: 'square', f: semitons(base, 7), t: 0.09 * e, dur: 0.2 * e, vol: 0.03, passaBaixa: 3000 });
      if (n >= 1) tom({ tipo: 'triangle', f: semitons(base, 12), t: 0.17 * e, dur: 0.28 * e, vol: 0.09 });
      if (n >= 3) tom({ tipo: 'sine', f: 110, f2: 46, dur: 0.38 * e, vol: 0.22 });
    }

    // Fanfarra: r = 0 (1ª etapa) … 1 (última). Mais notas no arpejo, acorde mais longo e mais vozes,
    // baixo, brilhos e (no jackpot) o "ta-ta-ta-taaam" de abertura.
    function fanfarra(r, jackpot, e) {
      const raiz = 523.25; // dó 5
      const ARPEJO = [0, 4, 7, 12, 16, 19, 24];
      let t = 0;
      if (jackpot) {
        [0, 0.11, 0.22, 0.33].forEach(function (tt, k) {
          const f = semitons(raiz, k < 3 ? 7 : 12);
          tom({ tipo: 'square', f: f, t: tt * e, dur: (k < 3 ? 0.09 : 0.3) * e, vol: 0.05, passaBaixa: 3200 });
          tom({ tipo: 'triangle', f: f, t: tt * e, dur: (k < 3 ? 0.1 : 0.32) * e, vol: 0.11 });
        });
        t = 0.62 * e;
      }
      const nArpejo = 3 + Math.round(r * 4); // 3 a 7 notas
      const passo = 0.085 * e;
      for (let k = 0; k < nArpejo; k++) {
        const f = semitons(raiz, ARPEJO[k]);
        tom({ tipo: 'triangle', f: f, t: t + k * passo, dur: 0.16 * e, vol: 0.12 });
        tom({ tipo: 'square', f: f, t: t + k * passo, dur: 0.12 * e, vol: 0.03, passaBaixa: 3200 });
      }
      const tAcorde = t + nArpejo * passo;
      const durAcorde = (0.5 + r * 1.5) * e;
      const vozes = [0, 4, 7];
      if (r > 0.2) vozes.push(12);
      if (r > 0.55) vozes.push(16);
      vozes.forEach(function (sem, k) {
        tom({ tipo: 'triangle', f: semitons(raiz, sem), t: tAcorde, dur: durAcorde, vol: 0.09, ataque: 0.012, sustenta: true });
        if (r > 0.4) tom({ tipo: 'sawtooth', f: semitons(raiz, sem), t: tAcorde, dur: durAcorde, vol: 0.018, ataque: 0.02, sustenta: true, passaBaixa: 2200, desafina: k % 2 ? 6 : -6 });
      });
      if (r > 0.15) tom({ tipo: 'sine', f: semitons(raiz, -24), t: tAcorde, dur: durAcorde, vol: 0.2, ataque: 0.01, sustenta: true });
      const brilhos = Math.round(r * 14);
      const PENTA = [0, 2, 4, 7, 9, 12, 14, 16];
      for (let k = 0; k < brilhos; k++) {
        tom({ tipo: 'sine', f: semitons(raiz * 2, PENTA[k % PENTA.length]), t: tAcorde + (k / Math.max(1, brilhos)) * durAcorde * 0.85, dur: 0.14 * e, vol: 0.045 });
      }
      return tAcorde + durAcorde;
    }

    // "K.O.": os rolos "apagam" num tom que despenca e, na pancada do letreiro (~0,58 s, como na
    // revelação final), um baque grave com as duas sílabas descendo ("kei" … "ôu").
    function nocaute(e) {
      tom({ tipo: 'sawtooth', f: 330, f2: 82, dur: 0.5 * e, vol: 0.07, passaBaixa: 1200 });
      const ti = 0.58 * e;
      ruido({ t: ti, dur: 0.35, vol: 0.3, filtro: 'lowpass', freq: 700, freq2: 110, ataque: 0.003 });
      tom({ tipo: 'sine', t: ti, f: 120, f2: 38, dur: 0.9, vol: 0.42, ataque: 0.004 });
      tom({ tipo: 'sawtooth', t: ti + 0.02, f: 233, f2: 208, dur: 0.22, vol: 0.07, passaBaixa: 900 });
      tom({ tipo: 'sawtooth', t: ti + 0.26, f: 175, f2: 92, dur: 0.8, vol: 0.08, passaBaixa: 700, sustenta: true });
    }

    function desfecho(resultado, cfg, escala) {
      const e = escala || 1;
      if (resultado.tipo === 'ganhou') {
        const total = Math.max(1, (cfg && cfg.etapas ? cfg.etapas.length : 1) - 1);
        const r = Math.min(1, Math.max(0, (resultado.etapa - 1) / total));
        const passos = resultado.roteiro || [];
        const ultimo = passos[passos.length - 1];
        const jackpot = !!(ultimo && ultimo.intensidade === 'jackpot');
        vibrar(jackpot ? [40, 50, 40, 50, 140] : r > 0.3 ? [30, 40, 70] : [35, 40, 35]);
        if (pronto()) fanfarra(r, jackpot, e);
      } else if (pronto()) {
        nocaute(e);
      }
    }

    // Aba oculta: o áudio suspende junto com a animação e volta quando ela volta.
    function pausar(oculta) {
      if (!ctx) return;
      const promessa = oculta ? ctx.suspend() : (ctx.state !== 'running' ? ctx.resume() : null);
      if (promessa && promessa.catch) promessa.catch(function () {});
    }

    function preparar(cfgSom, botaoEl) {
      volume = cfgSom ? cfgSom.volume : 0.8;
      mudo = !(cfgSom ? cfgSom.ligado : true);
      botao = botaoEl || null;
      if (botao) botao.addEventListener('click', function () { definirMudo(!mudo); });
      mostrarBotao();
      // Sessão de áudio "playback" (Safari 16.4+): toca mesmo com a chave de silencioso do iPhone.
      try {
        if (navigator.audioSession && 'type' in navigator.audioSession) navigator.audioSession.type = 'playback';
      } catch (e) { /* sem suporte: segue normalmente */ }
      EVENTOS_DE_TOQUE.forEach(function (tipo) { window.addEventListener(tipo, destravar, { capture: true, passive: true }); });
    }

    return {
      preparar: seguro(preparar), tiquesDaEtapa: function (passo) { try { return tiquesDaEtapa(passo); } catch (e) { return []; } },
      giro: seguro(giro), tique: seguro(tique), parada: seguro(parada), etapa: seguro(etapa), desfecho: seguro(desfecho),
      parar: seguro(pararTudo), pausar: seguro(pausar), mudo: function () { return mudo; },
    };
  })();

  // Reserva sem GSAP: o tabuleiro inteiro troca a cada etapa, nos tempos do Roteiro.
  function encenarSimples(resultado, aoTerminar, aoDesfecho) {
    const rodada = app.rodada;
    let inicio = 0;
    resultado.roteiro.forEach(function (passo) {
      agendar(function () {
        if (rodada !== app.rodada) return;
        Tela.mostrarPasso(passo, app.config);
        Som.parada(2, passo);
        if (!passo.final) Som.etapa(passo, 1);
        if (passo.final && aoDesfecho) aoDesfecho();
      }, inicio + passo.revelacaoMs);
      inicio += passo.duracaoMs;
    });
    agendar(function () { if (rodada === app.rodada) aoTerminar(); }, inicio);
  }

  function encenar(resultado, aoTerminar, aoDesfecho) {
    const rodada = app.rodada;
    const terminar = function () { if (rodada === app.rodada) aoTerminar(); };
    const desfecho = function () { if (rodada === app.rodada) aoDesfecho(); };
    if (Diretor.disponivel()) {
      try {
        Diretor.encenar(resultado, app.config, terminar, desfecho);
        return;
      } catch (erro) {
        console.error('[Tigrinho] Falha na animação dos rolos (seguindo sem ela):', erro);
        Diretor.parar();
      }
    }
    encenarSimples(resultado, terminar, desfecho);
  }

  /* ---------- 5.8 FLUXO DE TELAS (INICIO → GIRANDO → RESULTADO → INICIO) ---------- */
  function definirEstado(estado) {
    app.estado = estado;
    Tela.mostrarEstado(estado, app.config.textos);
  }

  function comecarRodada() {
    if (app.estado !== 'INICIO') return; // toques extras são ignorados
    let resultado;
    try {
      resultado = Motor.sortear(app.config, app.fonte); // o Resultado inteiro, na hora do toque
    } catch (erro) {
      console.error('[Tigrinho] Falha no sorteio:', erro);
      return;
    }
    app.resultado = resultado;
    app.rodada++;
    definirEstado('GIRANDO');
    const revelarDesfecho = function () {
      try {
        Revelacao.desfecho(resultado, app.config);
      } catch (erro) {
        console.error('[Tigrinho] Falha na revelação final (seguindo sem ela):', erro);
      }
    };
    encenar(resultado, function () { // os rolos começam a girar já neste toque
      revelarDesfecho(); // se a encenação não chegou a chamar (não faz nada se já começou)
      Diretor.recolher();
      Tela.marcarFase(null);
      Tela.mostrarResultado(resultado, app.config);
      definirEstado('RESULTADO'); // fica na tela até tocarem em "Jogar de novo"
      Efeitos.fimDaRodada();
      try {
        Revelacao.resultado(resultado, app.config);
      } catch (erro) {
        console.error('[Tigrinho] Falha na entrada do resultado (seguindo sem ela):', erro);
      }
    }, revelarDesfecho);
  }

  // Rede de segurança do reinício: tira da linha do tempo global do GSAP as animações que já deveriam ter
  // terminado e ficaram presas (não desenham nada, mas acumulariam a cada rodada e deixariam o relógio do
  // GSAP acordado na tela inicial). Animações pausadas, em andamento ou sem fim não são tocadas.
  function varrerAnimacoesEncerradas() {
    const g = window.gsap;
    if (!g || !g.globalTimeline || typeof g.globalTimeline.getChildren !== 'function') return;
    try {
      const agora = g.globalTimeline.time();
      g.globalTimeline.getChildren(false, true, true).forEach(function (a) {
        if (!a.paused() && !a.isActive() && a.endTime() < agora - 0.05) a.kill();
      });
    } catch (erro) {
      /* nada a varrer */
    }
  }

  // Reinício completo em memória, sem recarregar a página.
  function voltarAoInicio() {
    app.rodada++;
    cancelarAgendados();
    Diretor.parar();
    Som.parar(); // corta a cauda de uma fanfarra que ainda estivesse tocando
    Revelacao.limpar(); // festa, camadas, "K.O." e animações da revelação
    varrerAnimacoesEncerradas();
    app.resultado = null;
    Tela.aplicarTextos(app.config.textos);
    Tela.telaInicial(app.config);
    definirEstado('INICIO');
  }

  function jogarDeNovo() {
    if (app.estado !== 'RESULTADO') return;
    voltarAoInicio();
  }

  /* ---------- 5.8.1 PROTEÇÃO CONTRA TOQUES ACIDENTAIS ----------
     O CSS (2.2) já bloqueia zoom, rolagem, menu e seleção. Isto cobre os navegadores que ignoram parte
     do CSS (Safari antigo, pinça no trackpad do iPad): nada na página rola nem dá zoom, então arrastar
     e pinçar não fazem nada. Um toque simples continua virando clique nos botões. */
  function protegerToques() {
    const bloquear = function (evento) { if (evento.cancelable) evento.preventDefault(); };
    const ativo = { passive: false };
    // Pinça do Safari (iPhone e iPad).
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (tipo) { document.addEventListener(tipo, bloquear, ativo); });
    // Dois dedos na tela = pinça: não começa.
    document.addEventListener('touchstart', function (evento) { if (evento.touches && evento.touches.length > 1) bloquear(evento); }, ativo);
    // Arrastar o dedo: sem rolagem, sem efeito elástico e sem puxar para recarregar.
    document.addEventListener('touchmove', bloquear, ativo);
    // Segurar o dedo numa imagem ou símbolo: sem menu. Arrastar imagem: não arrasta.
    document.addEventListener('contextmenu', bloquear);
    document.addEventListener('dragstart', bloquear);
    // Pinça no trackpad / Ctrl + roda do mouse: sem zoom.
    document.addEventListener('wheel', function (evento) { if (evento.ctrlKey) bloquear(evento); }, ativo);
  }

  /* ---------- 5.8.2 TELA LIGADA (Screen Wake Lock) ----------
     Pede ao navegador para a tela não apagar sozinha. O pedido sai no primeiro toque (o mesmo que destrava
     o som) e de novo sempre que a aba volta a ficar visível, porque o navegador solta a trava quando a aba
     vai para o segundo plano. Se o sistema soltar a trava por conta própria, o toque seguinte pede outra.
     Sem suporte, pedido recusado ou qualquer erro: falha em silêncio (nada no console, nada na tela) e a
     rodada segue normal. Os ouvintes são registrados uma vez só, na abertura. */
  const TelaLigada = (function () {
    const EVENTOS = ['pointerup', 'touchend', 'click', 'keydown']; // eventos que contam como toque do usuário
    let trava = null; // a trava ativa (WakeLockSentinel)
    let pedindo = false; // um pedido por vez
    let tocou = false; // só pede depois do primeiro toque
    let recusadoEm = 0; // hora da última recusa
    let preparada = false;

    function suportada() {
      try {
        return !!(navigator.wakeLock && typeof navigator.wakeLock.request === 'function');
      } catch (erro) {
        return false;
      }
    }
    function ativa() {
      return !!(trava && trava.released !== true);
    }
    function pedir() {
      try {
        if (!tocou || pedindo || ativa() || document.visibilityState === 'hidden' || !suportada()) return;
        pedindo = true;
        Promise.resolve(navigator.wakeLock.request('screen')).then(function (sentinela) {
          pedindo = false;
          trava = sentinela || null;
          if (trava && typeof trava.addEventListener === 'function') {
            trava.addEventListener('release', function () { if (trava === sentinela) trava = null; }, { once: true });
          }
        }, function () {
          pedindo = false; // recusado (bateria fraca, permissão, aba oculta…): tenta de novo num próximo toque
          recusadoEm = Date.now();
        });
      } catch (erro) {
        pedindo = false;
      }
    }
    function aoTocar() {
      tocou = true;
      if (Date.now() - recusadoEm < 1000) return; // os vários eventos de um mesmo toque não repetem um pedido recusado
      pedir();
    }
    function preparar() {
      if (preparada || !suportada()) return; // sem suporte: nenhum ouvinte e nenhum aviso
      preparada = true;
      EVENTOS.forEach(function (tipo) { window.addEventListener(tipo, aoTocar, { capture: true, passive: true }); });
    }
    function aoMudarVisibilidade() {
      if (document.visibilityState === 'visible') pedir();
    }
    return { preparar: preparar, aoMudarVisibilidade: aoMudarVisibilidade };
  })();

  /* ---------- 5.9 INICIALIZAÇÃO ---------- */
  function iniciar() {
    try {
      app.config = prepararConfig(window.CONFIG);
    } catch (erro) {
      avisar('Não foi possível ler o CONFIG (' + (erro && erro.message) + '): usando valores seguros.');
      app.config = prepararConfig({});
    }
    Motor.tabelaDeDesfechos(app.config); // confere as chances já na abertura (avisos só no console)
    const el = Tela.pegarElementos();
    Diretor.preparar(el.tabuleiro); // rolos (camada por cima das células), montados uma vez só
    Revelacao.preparar(el.tabuleiro); // camadas da revelação final e a festa (5.7.1 e 5.7.2)
    Efeitos.preparar(); // efeitos por intensidade: aura, brilho da Logo, fogo, raios, jackpot (5.7.3)
    // "Reduzir movimento": a preferência do aparelho vira a classe .reduzir-movimento na raiz (o CSS e os
    // efeitos leem a classe) e acompanha a mudança se ela for trocada com o jogo aberto.
    const preferencia = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    const aplicarPreferencia = function () {
      document.documentElement.classList.toggle('reduzir-movimento', !!(preferencia && preferencia.matches));
    };
    aplicarPreferencia();
    if (preferencia && preferencia.addEventListener) preferencia.addEventListener('change', aplicarPreferencia);
    else if (preferencia && preferencia.addListener) preferencia.addListener(aplicarPreferencia);
    // Aba oculta: rolos, efeitos e festa pausam e continuam de onde pararam.
    // Ao voltar a ficar visível, a tela ligada (5.8.2) pede a trava de novo.
    document.addEventListener('visibilitychange', function () {
      TelaLigada.aoMudarVisibilidade();
      const oculta = document.visibilityState === 'hidden';
      Efeitos.pausar(oculta);
      Som.pausar(oculta);
    });
    // Som (5.7.4): lê som.ligado e som.volume, liga o botão de mudo, pede a sessão de áudio "playback" e
    // espera o primeiro toque para destravar o áudio. Falhas deixam o jogo mudo (aviso só no console).
    Som.preparar(app.config.som, el.botaoMudo);
    // Tela ligada (5.8.2): o mesmo primeiro toque que destrava o som pede a trava da tela.
    TelaLigada.preparar();
    if (!Diretor.disponivel()) avisar('Biblioteca de animação (GSAP) ausente: a rodada segue sem os rolos girando.');
    // Fontes e Logo do bloco ASSETS e imagens reais dos símbolos (se o CONFIG der): tudo é carregado e
    // decodificado já na abertura (assíncrono; problemas só no console). Quando fica pronto (e o cartão
    // inicial já apareceu por inteiro), os rolos fazem o ensaio invisível: o primeiro giro já encontra
    // tudo desenhado. Em aparelho lento o ensaio pode pesar um instante, mas só na tela inicial parada.
    Promise.all([
      Recursos.instalar(el),
      Simbolos.carregarImagens(app.config, Tela.redesenharSimbolos),
    ]).then(function () {
      setTimeout(function () { if (app.estado === 'INICIO') Diretor.aquecer(app.config); }, 1200);
    }, function () {});
    el.botaoComecar.addEventListener('click', comecarRodada);
    el.botaoGirar.addEventListener('click', comecarRodada);
    el.botaoJogarDeNovo.addEventListener('click', jogarDeNovo);
    protegerToques();
    voltarAoInicio();
  }

  // Só inicia depois que todos os scripts (inclusive o ASSETS, no fim) foram lidos.
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})();
</script>
